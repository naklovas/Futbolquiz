// ---------- Topoloji modeli ----------
// Sorgulanan IP'nin karşısındaki sunucular (1. seviye), hit'e göre sıralı.
function sideServers(dir) {
  const edges = dir === "in" ? state.data.inbound : state.data.outbound;
  const m = new Map();
  for (const e of edges) {
    let s = m.get(e.peerIp);
    if (!s) m.set(e.peerIp, s = { ip: e.peerIp, dir, hits: 0, fwDenied: 0, ports: new Set(), seg: e.peerSegment, apps: appNames(e.peerApps), localApps: new Set(),
      viaVip: e.viaVip ?? null, peerVip: e.peerVip ?? null, peerVipGw: e.peerVipGw ?? null });
    s.hits += e.hits; s.fwDenied += e.firewallDenied ?? 0; s.ports.add(e.port);
    if (e.peerVip && !s.peerVip) s.peerVip = e.peerVip;
    if (dir === "in") appNames(e.localApp).forEach(a => s.localApps.add(a));
  }
  return [...m.values()].sort((a, b) => b.hits - a.hits);
}

// 2. seviye segmentler: çizilen sunucuların (gelen ya da giden) trafiğinin segment özeti.
function sideSegments(dir, servers) {
  const peers = state.hop2?.peers;
  if (!peers) return [];
  const m = new Map();
  for (const srv of servers) {
    const hop = peers.get(srv.ip); if (!hop) continue;
    for (const a of (state.hopDir[dir] === "in" ? hop.inbound : hop.outbound)) {
      if (!envSegAllowed(a.segment)) continue;
      const k = segKey(a.segment);
      let g = m.get(k);
      if (!g) m.set(k, g = { key: k, seg: a.segment, cidrs: new Set(), vlans: new Set(), hits: 0, ips: new Set(), ports: new Set(), apps: new Set(), links: new Map() });
      if (a.segment) { g.cidrs.add(a.segment.cidr); if (a.segment.vlan) g.vlans.add(a.segment.vlan); }
      g.hits += a.hits; a.topIps.forEach(ip => g.ips.add(ip)); a.ports.forEach(p => g.ports.add(p)); a.apps.forEach(x => g.apps.add(x));
      g.ipCount = (g.ipCount ?? 0) + a.ipCount;
      // Aynı sunucunun aynı adlı birden fazla CIDR'ı tek bağlantıda toplanır.
      const l = g.links.get(srv.ip) ?? { hits: 0, agg: { ports: [], apps: [], topIps: [] } };
      l.hits += a.hits;
      l.agg = { ports: [...new Set([...l.agg.ports, ...a.ports])], apps: [...new Set([...l.agg.apps, ...a.apps])], topIps: [...new Set([...l.agg.topIps, ...a.topIps])].slice(0, 10) };
      g.links.set(srv.ip, l);
    }
  }
  let list = [...m.values()].sort((a, b) => (a.key === UNK) - (b.key === UNK) || b.hits - a.hits);
  if (list.length > state.maxSegs) {
    const rest = list.slice(state.maxSegs - 1);
    const other = { key: "__other", other: rest, hits: 0, ipCount: 0, ips: new Set(), ports: new Set(), apps: new Set(), links: new Map() };
    for (const r of rest) {
      other.hits += r.hits; other.ipCount += r.ipCount;
      r.links.forEach((v, k) => other.links.set(k, { hits: (other.links.get(k)?.hits ?? 0) + v.hits }));
    }
    list = [...list.slice(0, state.maxSegs - 1), other];
  }
  return list;
}

const trunc = (s, n) => (s = String(s ?? "")).length > n ? s.slice(0, n - 1) + "…" : s;
const portSort = (a, b) => (a === "" ? 1e9 : +a || 0) - (b === "" ? 1e9 : +b || 0);
const portsLabel = set => { const p = [...set].sort(portSort).map(x => x === "" ? "web" : ":" + x); return p.slice(0, 4).join(" ") + (p.length > 4 ? "…" : ""); };
const segTitle = g => g.key === "__other" ? `Diğer ${g.other.length} segment` : g.seg ? g.seg.label : "Segment envanterinde yok";
const cidrText = set => set.size <= 1 ? [...set].join("") : `${set.size} CIDR`;
const segSub = g => {
  if (g.key === "__other" || !g.seg) return "";
  const c = cidrText(g.cidrs);
  return [c !== g.seg.label && c, g.vlans.size && "VLAN " + [...g.vlans].join(",")].filter(Boolean).join(" · ");
};

// ---------- Topoloji çizimi ----------
// Sütunlar: [segment] → [gelen sunucu] → [SORGULANAN IP] → [gidilen sunucu] → [segment]
function renderTopology() {
  const d = state.data;
  if (!d.inbound.length && !d.outbound.length) {
    $("#topo").innerHTML = `<div class="empty">Bu aralıkta akış bulunamadı.</div>`;
    renderFilterbar(); return;
  }
  const cols = {};
  for (const dir of ["in", "out"]) {
    const all = sideServers(dir);
    const shown = all.slice(0, state.maxServers);
    const hidden = all.slice(state.maxServers);
    const srv = shown.map(x => ({ ...x }));
    if (hidden.length) srv.push({ more: true, ip: `+ ${hidden.length} sunucu`, dir, hits: hidden.reduce((n, x) => n + x.hits, 0), ports: new Set(), apps: [], localApps: new Set(), list: hidden });
    cols[dir] = { srv, seg: sideSegments(dir, shown) };
  }

  const TOP = 56, SH = 58, SG = 10, GH = 50, GG = 10, TH = 140;
  const X = { segIn: 12, srvIn: 390, tgt: 740, srvOut: 1040, segOut: 1420 };
  const SW = 250, VW = 270, TW = 220, W = X.segOut + SW + 12;
  const colH = (n, h, g) => n ? n * h + (n - 1) * g : 0;
  const hop2Pending = !state.hop2 || state.hop2.status !== "ok";
  const inner = Math.max(TH, colH(cols.in.srv.length, SH, SG), colH(cols.out.srv.length, SH, SG),
    colH(cols.in.seg.length, GH, GG), colH(cols.out.seg.length, GH, GG), 80);
  const H = TOP + inner + 20, center = TOP + inner / 2;
  const place = (list, h, g) => { let y = TOP + (inner - colH(list.length, h, g)) / 2; list.forEach(n => { n.y = y; y += h + g; }); };
  for (const dir of ["in", "out"]) { place(cols[dir].srv, SH, SG); place(cols[dir].seg, GH, GG); }
  const ty = center - TH / 2;

  const allHits = [cols.in, cols.out].flatMap(c => [...c.srv.map(x => x.hits), ...c.seg.flatMap(g => [...g.links.values()].map(l => l.hits))]).concat([1]);
  const maxHit = Math.max(...allHits);
  const sw = h => (1.2 + 8 * Math.log(1 + h) / Math.log(1 + maxHit)).toFixed(1);
  const curve = (x1, y1, x2, y2) => { const mx = (x1 + x2) / 2; return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`; };
  const sel = state.selected;

  let edges = "", nodes = "";
  const srvId = (dir, i) => `v${dir}${i}`, segId = (dir, i) => `g${dir}${i}`;

  for (const dir of ["in", "out"]) {
    const { srv, seg } = cols[dir];
    const srvX = dir === "in" ? X.srvIn : X.srvOut, segX = dir === "in" ? X.segIn : X.segOut;
    const srvIdx = new Map(srv.map((s, i) => [s.ip, i]));
    const segOfSrv = new Map();

    // segment ↔ sunucu bağlantıları (2. seviye)
    seg.forEach((g, gi) => {
      for (const [ip, l] of g.links) {
        const si = srvIdx.get(ip); if (si == null) continue;
        const s = srv[si];
        (segOfSrv.get(si) ?? segOfSrv.set(si, []).get(si)).push(segId(dir, gi));
        const sy = s.y + SH / 2, gy = g.y + GH / 2;
        // okun yönü trafiğin yönü: segment → sunucu (gelen) ya da sunucu → segment (giden)
        const toServer = state.hopDir[dir] === "in";
        const segEdgeX = dir === "in" ? segX + SW : segX, srvEdgeX = dir === "in" ? srvX : srvX + VW;
        const path = toServer ? curve(segEdgeX, gy, srvEdgeX, sy) : curve(srvEdgeX, sy, segEdgeX, gy);
        const cls = toServer ? "in" : "out";
        edges += `<path class="edge hop ${cls}" data-rel="${segId(dir, gi)} ${srvId(dir, si)}" marker-end="url(#arr-${cls})" stroke-width="${sw(l.hits)}" d="${path}"><title>${esc(toServer ? `${segTitle(g)} → ${s.ip}` : `${s.ip} → ${segTitle(g)}`)}: ${fmt(l.hits)} hit</title></path>`;
      }
    });

    // sunucu ↔ sorgulanan IP
    srv.forEach((s, i) => {
      const sy = s.y + SH / 2;
      const tyy = ty + 24 + (TH - 48) * (srv.length > 1 ? i / (srv.length - 1) : 0.5);
      const rel = srvId(dir, i);
      const path = dir === "in" ? curve(X.srvIn + VW, sy, X.tgt, tyy) : curve(X.tgt + TW, tyy, X.srvOut, sy);
      // Trafiğin tamamı firewall'da engellendiyse çizgi kırmızı kesikli.
      const blocked = s.fwDenied > 0 && s.fwDenied >= s.hits;
      edges += `<path class="edge ${dir}${blocked ? " denied" : ""}" data-rel="${rel}" marker-end="url(#arr-${dir})" stroke-width="${sw(s.hits)}" d="${path}"><title>${esc(dir === "in" ? `${s.ip} → ${d.target.ip}` : `${d.target.ip} → ${s.ip}`)} ${esc(portsLabel(s.ports))}: ${fmt(s.hits)} hit${s.fwDenied ? ` · firewall ${fmt(s.fwDenied)} engelledi` : ""}</title></path>`;

      const isSel = sel && sel.type === "srv" && sel.dir === dir && sel.ip === s.ip;
      let appTxt = dir === "in"
        ? (s.apps.join(", ") || "uygulama ?") + (s.localApps.size ? `  →  ${[...s.localApps].join(", ")}` : "")
        : (s.apps.join(", ") || "uygulama ?");
      // VIP işaretleri: üye (VIP → üye), karşı IP VIP, karşı IP LB GW
      let vipTag = "", line3 = [segLabel(s.seg) ?? "segment ?", portsLabel(s.ports)].join(" · ");
      if (s.viaVip) {
        vipTag = s.viaVip.verified ? "VIP ÜYESİ ✓" : "VIP ÜYESİ";
        appTxt = `${s.viaVip.hostname ?? ""} ${s.apps.length ? "· " + s.apps.join(", ") : ""}`.trim() || appTxt;
        const gws = s.viaVip.gwIps;
        line3 = s.hits ? `${segLabel(s.seg) ?? "segment ?"} · GW ${gws[0] ?? "?"}${gws.length > 1 ? " +" + (gws.length - 1) : ""}` : "trafik görülmedi (envanter)";
      } else if (s.peerVip) {
        vipTag = `VIP → ${s.peerVip.length} ÜYE`;
        appTxt = [...new Set(s.peerVip.map(m => m.hostname ?? m.ip))].join(", ");
      } else if (s.peerVipGw) {
        vipTag = "LB GW";
        appTxt = `Load balancer GW · ${s.peerVipGw}`;
      }
      nodes += `<g class="srv ${dir}${s.more ? " more" : ""}${isSel ? " sel" : ""}${vipTag ? " vip" : ""}${s.viaVip && !s.hits ? " nohit" : ""}" data-id="${srvId(dir, i)}" data-dir="${dir}" data-ip="${esc(s.ip)}" transform="translate(${srvX},${s.y})">
        <title>${esc(s.ip)}\n${esc(s.more ? s.list.slice(0, 30).map(x => x.ip).join(", ") : [segLabel(s.seg) ?? "segment ?", s.apps.join(", "), "Port: " + portsLabel(s.ports)].join("\n"))}\n${fmt(s.hits)} hit</title>
        <rect width="${VW}" height="${SH}" rx="8"></rect>
        <text class="t1" x="10" y="19">${esc(s.ip)}</text>
        <text class="num" x="${VW - 10}" y="19" text-anchor="end">${fmt(s.hits)}</text>
        ${vipTag ? `<text class="vipt" x="${VW - 60}" y="19" text-anchor="end">${esc(vipTag)}</text>` : ""}
        ${s.more ? `<text class="t3" x="10" y="38">2. seviyede sorgulanmadı</text>` : `
        <text class="t2" x="10" y="35">${esc(trunc(appTxt, 38))}</text>
        <text class="t3" x="10" y="50">${esc(trunc(line3, 42))}</text>`}
      </g>`;
    });

    // 2. seviye segment düğümleri
    seg.forEach((g, gi) => {
      const isSel = sel && sel.type === "seg" && sel.dir === dir && sel.key === g.key;
      const same = isTargetSeg(g.seg);
      nodes += `<g class="sgn ${dir}${g.key === UNK ? " unknown" : ""}${g.key === "__other" ? " more" : ""}${same ? " same" : ""}${isSel ? " sel" : ""}" data-id="${segId(dir, gi)}" data-dir="${dir}" data-key="${esc(g.key)}" transform="translate(${segX},${g.y})">
        <title>${esc(segTitle(g))}\n${esc(g.cidrs ? [...g.cidrs].join(", ") : g.other.map(segTitle).join(", "))}\n${fmt(g.links.size)} sunucu · ~${fmt(g.ipCount)} IP · ${fmt(g.hits)} hit${g.apps.size ? "\nUygulama: " + esc([...g.apps].join(", ")) : ""}</title>
        <rect width="${SW}" height="${GH}" rx="8"></rect>
        <text class="t1" x="10" y="19">${esc(trunc(segTitle(g), 24))}</text>
        <text class="num" x="${SW - 10}" y="19" text-anchor="end">${fmt(g.hits)}</text>
        <text class="t3" x="10" y="38">${esc(trunc(segSub(g) || `${fmt(g.links.size)} sunucu`, same ? 17 : 24))}</text>
        ${same ? `<text class="badge-same" x="${SW - 10}" y="38" text-anchor="end">AYNI SEGMENT</text>` : `<text class="num" x="${SW - 10}" y="38" text-anchor="end">${g.key === "__other" || !segSub(g) ? "" : fmt(g.links.size) + " sunucu"}</text>`}
      </g>`;
    });
  }

  // 2. seviye durum yazısı
  const hopHint = x => {
    if (!$("#hop2On").checked && !state.hop2) return `<text class="hint" x="${x}" y="${center}">2. seviye kapalı</text>`;
    if (!state.hop2 || state.hop2.status === "loading") return `<text class="hint" x="${x}" y="${center}">sunucuların trafiği sorgulanıyor…</text>`;
    if (state.hop2.status === "error") return `<text class="hint err" x="${x}" y="${center}">${esc(trunc(state.hop2.error, 40))}</text>`;
    return "";
  };
  const hopWarn = state.hop2?.status === "ok" && state.hop2.warn ? `<text class="hint err" x="${W / 2}" y="44" text-anchor="middle">${esc(trunc(state.hop2.warn, 140))}</text>` : "";

  const t = d.target;
  const tApps = [...new Set(t.apps.map(appName))];
  const lbl = { in: "SUNUCULARA GELEN SEGMENTLER", out: "SUNUCULARIN GİTTİĞİ SEGMENTLER" };
  const svg = `<svg class="topo" id="topoSvg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      ${["in", "out"].map(c => `<marker id="arr-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" style="fill:var(--${c})"></path></marker>`).join("")}
    </defs>
    <text class="colhead" x="${X.segIn}" y="22">${lbl[state.hopDir.in]} · ${fmt(cols.in.seg.length)}</text>
    <text class="colhead" x="${X.srvIn}" y="22">GELEN SUNUCULAR · ${fmt(sideServers("in").length)}</text>
    <text class="colhead" x="${X.tgt + TW / 2}" y="22" text-anchor="middle">SORGULANAN IP</text>
    <text class="colhead" x="${X.srvOut}" y="22">GİDİLEN SUNUCULAR · ${fmt(sideServers("out").length)}</text>
    <text class="colhead" x="${X.segOut + SW}" y="22" text-anchor="end">${lbl[state.hopDir.out]} · ${fmt(cols.out.seg.length)}</text>
    ${hopWarn}
    ${hop2Pending ? hopHint(X.segIn) + hopHint(X.segOut) : ""}
    ${edges}
    ${nodes}
    <g class="tnode" transform="translate(${X.tgt},${ty})">
      <title>${esc(t.ip)}\n${esc(t.segment ? `${t.segment.label} (${t.segment.cidr})` : "segment ?")}\n${esc(tApps.join(", "))}</title>
      <rect width="${TW}" height="${TH}" rx="12"></rect>
      <text x="${TW / 2}" y="30" text-anchor="middle" style="font-size:12px;font-weight:700;letter-spacing:.06em">SORGULANAN IP</text>
      <text x="${TW / 2}" y="55" text-anchor="middle" style="font-size:17px;font-weight:700">${esc(t.ip)}</text>
      <text x="${TW / 2}" y="78" text-anchor="middle" style="font-weight:600">${esc(trunc(t.segment ? t.segment.label : "segment ?", 28))}</text>
      <text x="${TW / 2}" y="96" text-anchor="middle" style="font-size:11px">${esc(t.segment ? [t.segment.cidr, t.segment.vlan && "VLAN " + t.segment.vlan].filter(Boolean).join(" · ") : "")}</text>
      <text x="${TW / 2}" y="120" text-anchor="middle" style="font-size:11.5px">${esc(trunc(t.vip?.length ? `VIP · ${[...new Set(t.vip.map(m => (m.pool ?? "").split("/").pop()))].join(", ")}` : tApps.join(", ") || "uygulama kaydı yok", 32))}</text>
    </g>
  </svg>`;
  $("#topo").innerHTML = svg;
  state.cols = cols;
  applyZoom();
  wireTopology();
  renderFilterbar();
}

function applyZoom() {
  const svg = $("#topoSvg"); if (!svg) return;
  const base = Math.max($("#topo").clientWidth - 2, 1200);
  svg.style.width = Math.round(base * state.zoom) + "px";
}

function wireTopology() {
  const svg = $("#topoSvg");
  const edgesOf = id => Array.from(svg.querySelectorAll(".edge")).filter(p => p.dataset.rel.split(" ").includes(id));
  svg.querySelectorAll("[data-id]").forEach(n => {
    // Vurgu: düğümün kendi bağlantıları + segment için bağlı sunucuların sorgulanan IP'ye giden yolu.
    n.addEventListener("mouseenter", () => {
      svg.classList.add("hl");
      const id = n.dataset.id;
      for (const p of edgesOf(id)) {
        p.classList.add("on");
        for (const other of p.dataset.rel.split(" ")) {
          if (other === id) continue;
          svg.querySelector(`[data-id="${other}"]`)?.classList.add("on");
          if (n.classList.contains("sgn"))
            svg.querySelectorAll(`.edge[data-rel="${other}"]`).forEach(x => x.classList.add("on"));
        }
      }
      n.classList.add("on");
    });
    n.addEventListener("mouseleave", () => {
      svg.classList.remove("hl");
      svg.querySelectorAll(".on").forEach(x => x.classList.remove("on"));
    });
  });
  svg.querySelectorAll(".srv").forEach(n => n.addEventListener("click", () => {
    const dir = n.dataset.dir, ip = n.dataset.ip;
    const s = state.cols[dir].srv.find(x => x.ip === ip);
    const same = state.selected && state.selected.type === "srv" && state.selected.dir === dir && state.selected.ip === ip;
    if (same) { clearFilter(); return; }
    const set = new Set(s.more ? s.list.map(x => x.ip) : [ip]);
    state.selected = s.more ? null : { type: "srv", dir, ip };
    state.filter = { dir, label: s.more ? s.ip : ip, test: e => set.has(e.peerIp) };
    renderTopology(); renderDetail(); renderTables();
  }));
  svg.querySelectorAll(".sgn").forEach(n => n.addEventListener("click", () => {
    const dir = n.dataset.dir, key = n.dataset.key;
    const g = state.cols[dir].seg.find(x => x.key === key);
    const same = state.selected && state.selected.type === "seg" && state.selected.dir === dir && state.selected.key === key;
    if (same) { clearFilter(); return; }
    const set = new Set(g.links.keys());
    state.selected = { type: "seg", dir, key };
    state.filter = { dir, label: `${segTitle(g)} ile bağlantılı sunucular`, test: e => set.has(e.peerIp) };
    renderTopology(); renderDetail(); renderTables();
  }));
}

function renderFilterbar() {
  $("#filterbar").innerHTML = state.filter
    ? `<div style="margin-bottom:8px"><span class="chip">${state.filter.dir === "in" ? "Gelen" : "Giden"}: ${esc(state.filter.label)} <button type="button" id="clr" title="Filtreyi kaldır">✕</button></span></div>` : "";
  $("#clr")?.addEventListener("click", clearFilter);
}
function clearFilter() { state.filter = null; state.selected = null; renderTopology(); renderDetail(); renderTables(); }

function segDl(seg) {
  return seg ? `<dl><dt>Segment</dt><dd><b>${esc(seg.label)}</b></dd><dt>CIDR</dt><dd>${esc(seg.cidr)}</dd>
    ${[["VLAN", seg.vlan], ["Tenant", seg.tenant], ["App Profile", seg.applicationProfile], ["EPG", seg.epgName], ["BD", seg.bd], ["Domain", seg.domain]]
      .filter(x => x[1]).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : `<div class="unk">Segment envanterinde yok.</div>`;
}

function hopTable(list, title) {
  if (!list) return "";
  list = list.filter(a => envSegAllowed(a.segment));
  return `<h2 style="margin-top:12px">${title} <span class="muted" style="font-weight:400">(${fmt(list.length)} segment)</span></h2>
    ${list.length ? `<div class="tbl-wrap" style="max-height:260px"><table>
      <thead><tr><th>Segment</th><th class="num">IP</th><th>Port</th><th>Uygulama</th><th>Örnek IP'ler</th><th class="num">Hit</th></tr></thead>
      <tbody>${list.map(a => `<tr><td>${segCell(a.segment)}</td><td class="num">${fmt(a.ipCount)}</td>
        <td class="mono">${esc(a.ports.join(", "))}</td><td>${esc(a.apps.join(", "))}</td>
        <td class="mono small">${esc(a.topIps.join(", "))}</td><td class="num">${fmt(a.hits)}</td></tr>`).join("")}</tbody>
    </table></div>` : `<div class="empty">Kayıt yok.</div>`}`;
}

// Seçili sunucu / segment detay kartı
function renderDetail() {
  const el = $("#detail"); const s = state.selected;
  if (!s) { el.innerHTML = ""; return; }
  if (s.type === "seg") {
    const g = state.cols?.[s.dir]?.seg.find(x => x.key === s.key);
    if (!g) { el.innerHTML = ""; return; }
    const toServer = state.hopDir[s.dir] === "in";
    const rows = [...g.links].sort((a, b) => b[1].hits - a[1].hits);
    el.innerHTML = `<div class="panel">
      <div class="toolbar"><h2 style="margin:0">${esc(segTitle(g))} <span class="muted" style="font-weight:400">${toServer ? "→ bu sunuculara geliyor" : "← bu sunucular buraya gidiyor"}</span></h2>
        <button type="button" id="closeDetail">Kapat</button></div>
      <div class="target-grid"><div>${g.key === "__other" ? `<div class="muted">${esc(g.other.map(segTitle).join(", "))}</div>` : segDl(g.seg)
        + (g.cidrs.size > 1 ? `<div style="margin-top:8px"><b>Bu adla ${g.cidrs.size} CIDR:</b><div class="mono small">${[...g.cidrs].map(esc).join("<br>")}</div></div>` : "")}</div>
      <div class="tbl-wrap" style="max-height:300px"><table>
        <thead><tr><th>Sunucu</th><th>Port</th><th>Uygulama</th><th>Örnek IP'ler</th><th class="num">Hit</th></tr></thead>
        <tbody>${rows.map(([ip, l]) => `<tr><td class="mono">${esc(ip)}</td><td class="mono">${esc(l.agg?.ports.join(", ") ?? "")}</td>
          <td>${esc(l.agg?.apps.join(", ") ?? "")}</td><td class="mono small">${esc(l.agg?.topIps.join(", ") ?? "")}</td><td class="num">${fmt(l.hits)}</td></tr>`).join("")}</tbody>
      </table></div></div></div>`;
    $("#closeDetail").addEventListener("click", clearFilter);
    return;
  }
  const edges = (s.dir === "in" ? state.data.inbound : state.data.outbound).filter(e => e.peerIp === s.ip);
  const seg = edges[0]?.peerSegment;
  const apps = edges.flatMap(e => e.peerApps?.apps ?? []);
  const hop = state.hop2?.peers?.get(s.ip);
  const pv = edges.find(e => e.peerVip)?.peerVip, via = edges.find(e => e.viaVip)?.viaVip, gw = edges.find(e => e.peerVipGw)?.peerVipGw;
  const vipHtml = pv ? `<div class="vipbox"><h2>Bu IP bir VIP · ${fmt(pv.length)} havuz üyesi</h2>
      ${pv.map(m => `<div class="mono small">${esc(m.hostname ?? "")} · ${esc(m.ip)}:${esc(m.port ?? "")} <span class="muted">${esc(m.pool ?? "")}</span></div>`).join("")}
      <div class="small muted" style="margin-top:4px">Arkasını görmek için "Bu IP'nin topolojisini aç".</div></div>`
    : via ? `<div class="vipbox"><h2>VIP havuz üyesi</h2><div class="small">${esc(via.hostname ?? "")} · VIP ${esc(via.lbIp)}:${esc(via.lbPort ?? "")} · ${esc(via.pool ?? "")}
      <br>GW: ${esc(via.gwIps.join(", ") || "?")} (${esc(via.fw ?? "")}) · ${via.verified ? "GW → üye trafiği görüldü" : "GW → üye trafiği görülmedi"}</div></div>`
    : gw ? `<div class="vipbox"><h2>Load balancer GW</h2><div class="small">Bu IP bir LB GW'si (${esc(gw)}); istemciler buraya bir VIP üzerinden geliyor.</div></div>` : "";
  el.innerHTML = `<div class="panel">
    <div class="toolbar">
      <h2 style="margin:0">${esc(s.ip)} <span class="muted" style="font-weight:400">${s.dir === "in" ? "→ sorgulanan IP'ye geliyor" : "← sorgulanan IP buraya gidiyor"}</span></h2>
      <div style="display:flex;gap:8px">
        <button type="button" id="drill" class="primary">Bu IP'nin topolojisini aç</button>
        <button type="button" id="closeDetail">Kapat</button>
      </div>
    </div>
    <div class="target-grid">
      <div>${segDl(seg)}
        ${apps.length ? `<div style="margin-top:8px"><b>Uygulama:</b> ${esc([...new Set(apps.map(appName))].join(", "))}
          <div class="small muted">${esc([...new Set(apps.map(a => a.varlikMuhafizi).filter(Boolean))].join(", "))}</div></div>` : ""}
        ${vipHtml}
      </div>
      <div>
        <div class="tbl-wrap" style="max-height:220px"><table>
          <thead><tr><th>Port</th><th>${s.dir === "in" ? "Karşılayan uygulama" : "Hedef uygulama"}</th><th class="num">Hit</th><th>Son görülme</th><th>Detay</th></tr></thead>
          <tbody>${edges.map(e => `<tr><td class="mono">${esc(portText(e.port))}</td>
            <td>${appsCell(s.dir === "in" ? e.localApp : e.peerApps, true)}</td><td class="num">${fmt(e.hits)}</td>
            <td class="mono">${esc(e.lastSeen ?? "")}</td><td>${detailCell(e)}</td></tr>`).join("")}</tbody>
        </table></div>
        ${hop ? hopTable(hop.inbound, "Bu sunucuya gelen segmentler") + hopTable(hop.outbound, "Bu sunucunun gittiği segmentler")
          : state.hop2?.status === "loading" ? `<div class="muted" style="margin-top:10px"><span class="spinner"></span> 2. seviye yükleniyor…</div>` : ""}
      </div>
    </div></div>`;
  $("#closeDetail").addEventListener("click", clearFilter);
  $("#drill").addEventListener("click", () => { $("#ip").value = s.ip; window.scrollTo({ top: 0, behavior: "smooth" }); run(); });
}

// ---------- Sunucu içi akış: gelen → süreç → giden (Carbon Black) ----------
// Sorgulanan sunucuda gelen bağlantıyı hangi süreç karşılıyor ve o süreç nereye bağlanıyor.
// Süreç bazında bir bağdır (istek bazında değil): aynı süreçten geçen gelen ve giden trafik.
let procAbort = null;
const PROC_INFRA = new Set(["22", "53", "88", "123", "135", "137", "138", "139", "161", "162", "389", "445", "464", "514",
  "636", "3268", "3269", "3389", "5985", "5986", "10050", "10051"]);
const PROC_MAX = { procs: 8, side: 14 };

async function runProc(params) {
  procAbort?.abort();
  procAbort = new AbortController();
  state.proc = { status: "loading" };
  renderProc();
  try {
    const p = new URLSearchParams({ ip: params.get("ip"), start: params.get("start"), end: params.get("end") });
    const r = await fetch("api/surec?" + p, { signal: procAbort.signal });
    const body = await r.json().catch(() => ({ error: `HTTP ${r.status}: sunucu JSON yerine başka bir yanıt döndü (zaman aşımı, yetki ya da sunucu hata sayfası olabilir)` }));
    if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
    expectList(body, "processes");
    state.proc = { status: "ok", body, infra: false };
  } catch (e) {
    state.proc = e.name === "AbortError" ? null : { status: "error", error: e.message };
  }
  renderProc();
}

function procView() {
  const pr = state.proc, show = p => (pr.infra || !PROC_INFRA.has(p.port)) && envSegAllowed(p.segment);
  const procs = pr.body.processes
    .map(n => ({ ...n, inbound: n.inbound.filter(show), outbound: n.outbound.filter(show) }))
    .filter(n => n.inbound.length || n.outbound.length)
    .map(n => ({ ...n, hits: n.inbound.reduce((a, p) => a + p.hits, 0) + n.outbound.reduce((a, p) => a + p.hits, 0) }))
    .sort((a, b) => b.hits - a.hits);
  const shownProcs = state.procSel ? procs.filter(n => n.key === state.procSel) : procs.slice(0, PROC_MAX.procs);
  // Kenarlardaki düğümler: karşı IP (gelende) / IP (gidende); portlar alt satırda.
  const side = dir => {
    const m = new Map();
    for (const n of shownProcs) for (const p of n[dir]) {
      let x = m.get(p.ip);
      if (!x) m.set(p.ip, x = { ip: p.ip, hits: 0, ports: new Set(), seg: p.segment, apps: new Set(), vip: p.vip, lbGw: p.lbGw, links: new Map() });
      x.hits += p.hits; x.ports.add(p.port); p.apps.forEach(a => x.apps.add(a));
      x.links.set(n.key, (x.links.get(n.key) ?? 0) + p.hits);
    }
    const list = [...m.values()].sort((a, b) => b.hits - a.hits);
    if (list.length <= PROC_MAX.side) return list;
    const rest = list.slice(PROC_MAX.side - 1);
    const other = { ip: `Diğer ${rest.length} IP`, other: true, hits: rest.reduce((a, x) => a + x.hits, 0), ports: new Set(), apps: new Set(), links: new Map() };
    rest.forEach(x => x.links.forEach((h, k) => other.links.set(k, (other.links.get(k) ?? 0) + h)));
    return [...list.slice(0, PROC_MAX.side - 1), other];
  };
  return { procs, shownProcs, left: side("inbound"), right: side("outbound") };
}

const procLabel = n => n.pid ? `${n.name} (PID ${n.pid})` : n.name;

// Panel iki sekmeli: Oturum akışı (AppResponse, aynı oturumda gelen → giden) ve Süreçler (Carbon Black).
function renderProc() {
  const el = $("#flowModalBody");
  if (!el || $("#flowModal").hidden) return;
  const tab = state.procTab ?? "yolculuk";
  const tabs = `<div class="seg">
      <button type="button" data-ptab="yolculuk" class="${tab === "yolculuk" ? "on" : ""}">Uçtan uca yolculuk</button>
      <button type="button" data-ptab="oturum" class="${tab === "oturum" ? "on" : ""}">Oturum akışı (AppResponse + Firewall)</button>
      <button type="button" data-ptab="surec" class="${tab === "surec" ? "on" : ""}">Süreçler (Carbon Black)</button></div>`;
  if (tab === "yolculuk") renderJourney(el, tabs); else if (tab === "oturum") renderSess(el, tabs); else renderSurec(el, tabs);
  el.querySelectorAll("[data-ptab]").forEach(b => b.addEventListener("click", () => { state.procTab = b.dataset.ptab; ensureFlowData(); renderProc(); }));
  flowZoom(el, tab);
}

// Modal grafiği: yaklaştır / uzaklaştır / sığdır. Ölçek sekme başına saklanır (yeniden çizimde korunur);
// null = genişliğe yay (varsayılan). Grafik alanı modalın kalan yüksekliğini kaplar, kendi içinde kayar. Ctrl + tekerlek de çalışır.
function flowZoom(el, tab) {
  const svg = el.querySelector("svg.proc-svg"), wrap = svg?.closest(".topo-wrap");
  if (!svg || !wrap) return;
  const [, , W, H] = svg.getAttribute("viewBox").split(/\s+/).map(Number);
  const bar = document.createElement("div");
  bar.className = "zoom flow-zoom";
  bar.innerHTML = `<button type="button" data-fz="-" title="Uzaklaş">−</button><button type="button" data-fz="fit" title="Grafiğin tamamını ekrana sığdır">Sığdır</button>
    <button type="button" data-fz="+" title="Yakınlaş">+</button><button type="button" data-fz="w" title="Genişliğe yay (varsayılan)">Genişlik</button><span class="small muted" id="fzPct"></span>`;
  wrap.before(bar);
  const fitWrap = () => { wrap.style.height = Math.max(240, el.getBoundingClientRect().bottom - wrap.getBoundingClientRect().top - 14) + "px"; };
  fitWrap();
  state.flowZoom ??= {};
  const apply = () => {
    const z = state.flowZoom[tab];
    if (z == null) { svg.setAttribute("width", "100%"); svg.removeAttribute("height"); svg.style.width = ""; }
    else { svg.style.minWidth = "0"; svg.setAttribute("width", Math.round(W * z)); svg.setAttribute("height", Math.round(H * z)); }
    $("#fzPct").textContent = z == null ? "" : `%${Math.round(z * 100)}`;
  };
  const current = () => state.flowZoom[tab] ?? svg.getBoundingClientRect().width / W;
  const set = z => { state.flowZoom[tab] = Math.min(4, Math.max(0.1, z)); apply(); };
  bar.querySelectorAll("[data-fz]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.fz;
    if (k === "w") { state.flowZoom[tab] = null; renderProc(); return; }
    if (k === "fit") set(Math.min((wrap.clientWidth - 4) / W, (wrap.clientHeight - 4) / H));
    else set(current() * (k === "+" ? 1.25 : 0.8));
    if (k === "fit") wrap.scrollTo(0, 0);
  }));
  wrap.addEventListener("wheel", ev => { if (!ev.ctrlKey) return; ev.preventDefault(); set(current() * (ev.deltaY < 0 ? 1.1 : 0.9)); }, { passive: false });
  apply();
}

// Modal: açılınca seçili sekmenin verisi (henüz yoksa) çekilir; sorgu her yeni IP sorgusunda sıfırlanır.
function openFlow() {
  if (!state.lastParams) return;
  $("#flowModalTitle").textContent = `Sunucu içi akış · ${state.lastParams.get("ip")}`;
  $("#flowModal").hidden = false;
  document.body.style.overflow = "hidden";
  ensureFlowData();
  renderProc();
}
function closeFlow() {
  $("#flowModal").hidden = true;
  document.body.style.overflow = "";
}
function ensureFlowData() {
  const tab = state.procTab ?? "yolculuk";
  if (tab === "yolculuk" && !state.jour && ($("#srcAr").checked || $("#srcFw").checked)) runJourney(state.lastParams);
  if (tab === "oturum" && !state.sess && ($("#srcAr").checked || $("#srcFw").checked)) runSess(state.lastParams);
  if (tab === "surec" && !state.proc && $("#srcSplunk").checked) runProc(state.lastParams);
}
$("#flowModalClose").addEventListener("click", closeFlow);
// Modal yalnızca Kapat düğmesiyle kapanır (arka plana tıklama / Esc kapatmaz: uzun sorgu sonucu yanlışlıkla kaybolmasın).

function renderSurec(el, tabs) {
  const pr = state.proc;
  const head = extra => `<div class="toolbar">${tabs}${extra ?? ""}</div>
    <div class="small muted" style="margin:-4px 0 8px">Carbon Black: sorgulanan sunucuda gelen bağlantıyı hangi süreç karşılıyor ve o süreç nereye bağlanıyor. Süreç bazındadır; tek tek istekleri değil, aynı süreçten geçen trafiği birlikte gösterir.</div>`;
  if (!pr) { el.innerHTML = head() + `<div class="muted">Splunk (Carbon Black) kaynağı seçili değil.</div>`; return; }
  if (pr.status === "loading") { el.innerHTML = head() + `<div class="muted"><span class="spinner"></span> Süreçler sorgulanıyor…</div>`; return; }
  if (pr.status === "error") { el.innerHTML = head() + `<div style="color:var(--err)">${esc(pr.error)}</div>`; return; }

  const v = procView();
  const tools = `<div class="checks" style="padding:0">
      <label title="DNS, AD, RPC, SMB, RDP, izleme gibi altyapı portları"><input type="checkbox" id="procInfra" ${pr.infra ? "checked" : ""}> Altyapı portları</label>
      ${state.procSel ? `<span class="chip">Süreç: ${esc(procLabel(state.proc.body.processes.find(n => n.key === state.procSel) ?? { name: "?" }))} <button type="button" id="procClear" title="Tümünü göster">✕</button></span>` : ""}
      <span class="muted small">${fmt(v.procs.length)} süreç${!state.procSel && v.procs.length > PROC_MAX.procs ? `, en yoğun ${PROC_MAX.procs} gösteriliyor` : ""}</span>
    </div>`;
  if (!v.shownProcs.length) {
    el.innerHTML = head(tools) + `<div class="muted">Bu aralıkta sorgulanan sunucunun Carbon Black kaydı yok (ajan kurulu değil ya da trafik yalnızca altyapı portlarında).</div>`;
    wireProc();
    return;
  }

  const W = 1180, NW = 300, PW = 300, NH = 44, PH = 60, GAP = 10;
  const X = { l: 0, p: (W - PW) / 2, r: W - NW };
  const colH = (n, h) => n * (h + GAP) - GAP;
  const H = Math.max(colH(v.left.length, NH), colH(v.shownProcs.length, PH), colH(v.right.length, NH), PH) + 40;
  const y0 = (n, h) => 30 + (H - 30 - colH(n, h)) / 2;
  const maxHit = Math.max(1, ...v.left.map(x => x.hits), ...v.right.map(x => x.hits));
  const sw = h => (1.2 + 7 * Math.log(1 + h) / Math.log(1 + maxHit)).toFixed(1);
  const curve = (x1, y1, x2, y2) => { const mx = (x1 + x2) / 2; return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`; };
  const procY = new Map(v.shownProcs.map((n, i) => [n.key, y0(v.shownProcs.length, PH) + i * (PH + GAP)]));
  const procName = new Map(v.shownProcs.map(n => [n.key, procLabel(n)]));
  const label = x => x.other ? "" : [...x.apps].slice(0, 2).join(", ") || (x.vip ? "VIP" : x.lbGw ? "Load balancer GW" : "uygulama ?");
  const sub = x => x.other ? "" : `${x.seg ? x.seg.label : "segment ?"} · ${portsLabel(x.ports)}`;

  let edges = "", nodes = "";
  const sideNodes = (list, dir) => list.forEach((x, i) => {
    const y = y0(list.length, NH) + i * (NH + GAP), xx = dir === "in" ? X.l : X.r;
    for (const [pkey, h] of x.links) {
      const py = procY.get(pkey); if (py == null) continue;
      const pname = procName.get(pkey);
      const path = dir === "in" ? curve(X.l + NW, y + NH / 2, X.p, py + PH / 2) : curve(X.p + PW, py + PH / 2, X.r, y + NH / 2);
      edges += `<path class="pe ${dir}" data-p="${esc(pkey)}" data-n="${dir}:${esc(x.ip)}" stroke-width="${sw(h)}" d="${path}"><title>${esc(dir === "in" ? `${x.ip} → ${pname}` : `${pname} → ${x.ip}`)}: ${fmt(h)} bağlantı</title></path>`;
    }
    nodes += `<g class="pn ${dir}" data-n="${dir}:${esc(x.ip)}" data-ip="${x.other ? "" : esc(x.ip)}" transform="translate(${xx},${y})">
      <rect width="${NW}" height="${NH}" rx="6"/><title>${esc(x.ip)}\n${esc([...x.apps].join(", "))}\n${fmt(x.hits)} bağlantı${x.other ? "" : "\nTıkla: bu IP'nin topolojisini aç"}</title>
      <text class="t1" x="8" y="16">${esc(trunc(x.ip, 24))}</text><text class="t3" x="${NW - 8}" y="16" text-anchor="end">${fmt(x.hits)}</text>
      <text class="t2" x="8" y="29">${esc(trunc(label(x), 44))}</text><text class="t3" x="8" y="40">${esc(trunc(sub(x), 48))}</text></g>`;
  });
  sideNodes(v.left, "in"); sideNodes(v.right, "out");
  v.shownProcs.forEach(n => {
    const y = procY.get(n.key);
    nodes += `<g class="pn proc" data-p="${esc(n.key)}" transform="translate(${X.p},${y})">
      <rect width="${PW}" height="${PH}" rx="8"/><title>${esc(procLabel(n))}\nGelen ${fmt(n.inHits)} · giden ${fmt(n.outHits)}\nTıkla: yalnızca bu süreç</title>
      <text class="t1" x="10" y="18">⚙ ${esc(trunc(procLabel(n), 30))}</text>
      <text class="t3" x="${PW - 10}" y="18" text-anchor="end">${fmt(n.inHits)} → ${fmt(n.outHits)}</text>
      <text class="t2" x="10" y="35">${esc(trunc(n.listenPorts.length ? "dinler: " + n.listenPorts.slice(0, 6).map(p => ":" + p).join(" ") : "yalnızca giden bağlantı", 44))}</text>
      <text class="t3" x="10" y="51">${esc(trunc(n.localApps.join(", "), 46))}</text></g>`;
  });
  const colHead = (x, t, anchor) => `<text class="colhead" x="${x}" y="14" text-anchor="${anchor}">${t}</text>`;
  el.innerHTML = head(tools) + `<div class="topo-wrap"><svg class="proc-svg" id="procSvg" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:900px">
      ${colHead(X.l, `GELEN (${fmt(v.left.length)})`, "start")}${colHead(X.p + PW / 2, "SÜREÇ (SORGULANAN SUNUCU)", "middle")}${colHead(W, `GİDEN (${fmt(v.right.length)})`, "end")}
      ${edges}${nodes}</svg></div>`;
  wireProc();
}

function wireProc() {
  $("#procInfra")?.addEventListener("change", ev => { state.proc.infra = ev.target.checked; renderProc(); });
  $("#procClear")?.addEventListener("click", () => { state.procSel = null; renderProc(); });
  const svg = $("#procSvg"); if (!svg) return;
  const hl = (sel) => {
    svg.classList.add("hl");
    svg.querySelectorAll(".pe").forEach(e => {
      const on = sel.p ? e.dataset.p === sel.p : e.dataset.n === sel.n;
      e.classList.toggle("on", on);
      if (on) { svg.querySelectorAll(`.pn[data-n="${CSS.escape(e.dataset.n)}"], .pn[data-p="${CSS.escape(e.dataset.p)}"]`).forEach(x => x.classList.add("on")); }
    });
    svg.querySelectorAll(sel.p ? `.pn[data-p="${CSS.escape(sel.p)}"]` : `.pn[data-n="${CSS.escape(sel.n)}"]`).forEach(x => x.classList.add("on"));
  };
  const clear = () => { svg.classList.remove("hl"); svg.querySelectorAll(".on").forEach(x => x.classList.remove("on")); };
  svg.querySelectorAll(".pn").forEach(g => {
    g.addEventListener("mouseenter", () => hl(g.dataset.p ? { p: g.dataset.p } : { n: g.dataset.n }));
    g.addEventListener("mouseleave", clear);
    g.addEventListener("click", () => {
      if (g.dataset.p) { state.procSel = state.procSel === g.dataset.p ? null : g.dataset.p; renderProc(); }
      else if (g.dataset.ip) { $("#ip").value = g.dataset.ip; closeFlow(); run(); }
    });
  });
}

// ---------- Uçtan uca yolculuk: dış IP → … → sorgulanan → … → DB (durak durak oturum eşleştirmesi) ----------
let jourAbort = null;
async function runJourney(params) {
  jourAbort?.abort();
  jourAbort = new AbortController();
  state.jour = { status: "loading" };
  renderProc();
  try {
    const p = new URLSearchParams({ ip: params.get("ip"), start: params.get("start"), end: params.get("end"), appliance: params.get("appliance"), sources: params.get("sources") });
    const r = await fetch("api/yolculuk?" + p, { signal: jourAbort.signal });
    const body = await r.json().catch(() => ({ error: `HTTP ${r.status}: sunucu JSON yerine başka bir yanıt döndü (zaman aşımı, yetki ya da sunucu hata sayfası olabilir)` }));
    if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
    expectList(body, "nodes");
    state.jour = { status: "ok", body };
  } catch (e) {
    state.jour = e.name === "AbortError" ? null : { status: "error", error: e.message };
  }
  renderProc();
}

// Düğümler sütun (seviye) içinde uygulama bazında tek kutu: VIP'ler kendi kutusu, dış IP'ler tek "İnternet" kutusu.
function journeyGroups(b) {
  const keyOf = n => n.kind === "dis" ? "dis" : n.kind === "vip" ? `vip:${n.ip}:${n.port}`
    : n.apps.length ? "a:" + [...n.apps].sort().join(" + ") : "s:" + (n.segment ? n.segment.label : n.ip);
  const nameOf = n => n.kind === "dis" ? "Dış IP'ler (internet)" : n.kind === "vip" ? `VIP ${n.ip}:${n.port ?? ""}`
    : n.apps.length ? [...n.apps].sort().join(" + ") : `${n.segment ? n.segment.label : "Segment ?"} · uygulaması bilinmeyen`;
  const groups = new Map(), byNode = new Map();
  for (const n of b.nodes.filter(n => n.kind === "dis" || envSegAllowed(n.segment))) {
    // Ortak hizmet (SiteScope, Redis, Splunk…): hangi durakta görülürse görülsün tek kutu (sütunlar dışında, altta)
    const ortak = n.ortak && n.level !== 0;
    const k = ortak ? `o|${n.ortak}` : `${n.level}|${keyOf(n)}`;
    const g = groups.get(k) ?? groups.set(k, { k, level: n.level, name: ortak ? n.ortak : nameOf(n), kind: n.kind, ortak,
      sub: ortak ? "ortak hizmet" : n.kind === "vip" && n.apps.length ? n.apps.join(", ") : "", ips: [], root: n.level === 0 }).get(k);
    if (!g.ips.includes(n.ip)) g.ips.push(n.ip);
    byNode.set(n.id, k);
  }
  const links = new Map();
  for (const e of b.edges) {
    const a = byNode.get(e.from), c = byNode.get(e.to);
    if (!a || !c) continue;
    const l = links.get(`${a}>${c}`) ?? links.set(`${a}>${c}`, { a, c, w: 0, oran: 0, havuz: true }).get(`${a}>${c}`);
    l.w += e.w; l.oran = Math.min(1, l.oran + (e.oran ?? 0)); l.havuz &&= !!e.havuz;
  }
  return { groups: [...groups.values()], links: [...links.values()] };
}

function renderJourney(el, tabs) {
  const js = state.jour;
  const head = `<div class="toolbar">${tabs}</div>
    <div class="small muted" style="margin:-4px 0 8px">Sorgulanan sunucudan geriye (dış IP'lere) ve ileriye (veritabanına) durak durak: her durakta bir önceki duraktan gelen oturumların içinde nereye gidildiğine bakılır (AppResponse + Firewall, zaman eşleştirmesi). VIP'ler ve NAT çözülür. Çizgi kalınlığı oturum sayısı; kesik çizgi DB bağlantı havuzu (önceden açık bağlantı).</div>`;
  if (!js) { el.innerHTML = head + `<div class="muted">AppResponse ya da Firewall kaynağı seçili değil.</div>`; return; }
  if (js.status === "loading") { el.innerHTML = head + `<div class="muted"><span class="spinner"></span> Duraklar sırayla sorgulanıyor (her seviye ayrı sorgu, en fazla son 5 dk; 1-3 dakika sürebilir)…</div>`; return; }
  if (js.status === "error") { el.innerHTML = head + `<div style="color:var(--err)">${esc(js.error)}</div>`; return; }

  const b = js.body, { groups: allGroups, links } = journeyGroups(b);
  const groups = allGroups.filter(g => !g.ortak), shared = allGroups.filter(g => g.ortak);
  const levels = [...new Set(groups.map(g => g.level))].sort((x, y) => x - y);
  const BW = 250, GX = 80, LINE = 14, MAXL = 5, GAP = 14;
  const boxH = g => 40 + LINE * (Math.min(g.ips.length, MAXL) + (g.ips.length > MAXL ? 1 : 0)) + (g.sub ? LINE : 0);
  const cols = levels.map(l => groups.filter(g => g.level === l).sort((x, y) => sumW(y) - sumW(x)));
  function sumW(g) { return links.filter(l => l.a === g.k || l.c === g.k).reduce((s2, l) => s2 + l.w, 0); }
  const colH = c => c.reduce((s2, g) => s2 + boxH(g) + GAP, -GAP);
  const W = Math.max(levels.length * BW + (levels.length - 1) * GX, BW), HM = Math.max(...cols.map(colH), 80) + 50;
  const pos = new Map();
  cols.forEach((c, ci) => { let y = 36 + (HM - 36 - colH(c)) / 2; c.forEach(g => { pos.set(g.k, { x: ci * (BW + GX), y }); y += boxH(g) + GAP; }); });
  // Ortak hizmetler altta tek sıra: çizgi çekilmez (veriyi ezmesin), bağlantıları kutuda yazar, üstüne gelince vurgulanır
  const perRow = Math.max(1, Math.floor((W + GAP) / (BW + GAP)));
  const sharedTop = HM + 24, sharedRowH = Math.max(0, ...shared.map(boxH)) + 16 + GAP;
  shared.forEach((g, i) => {
    const conn = links.filter(l => l.a === g.k || l.c === g.k);
    g.sub = `${fmt(Math.round(conn.reduce((s2, l) => s2 + l.w, 0)))} oturum · ${new Set(conn.map(l => l.a === g.k ? l.c : l.a)).size} kutuya bağlı`;
    pos.set(g.k, { x: (i % perRow) * (BW + GAP), y: sharedTop + 20 + Math.floor(i / perRow) * sharedRowH });
  });
  const H = shared.length ? sharedTop + 20 + Math.ceil(shared.length / perRow) * sharedRowH : HM;
  const maxW = Math.max(1, ...links.map(l => l.w));
  const sw = w => (1.5 + 9 * Math.log(1 + w) / Math.log(1 + maxW)).toFixed(1);
  const colTitle = l => l === 0 ? "SORGULANAN" : l < 0 ? `${-l}. DURAK ÖNCESİ` : `${l}. DURAK SONRASI`;

  let edges = "", nodes = "";
  const sharedKeys = new Set(shared.map(g => g.k));
  for (const l of links) {
    if (sharedKeys.has(l.a) || sharedKeys.has(l.c)) continue;
    const A = pos.get(l.a), C = pos.get(l.c); if (!A || !C) continue;
    const ga = groups.find(g => g.k === l.a), gc = groups.find(g => g.k === l.c);
    const y1 = A.y + boxH(ga) / 2, y2 = C.y + boxH(gc) / 2, x1 = A.x + BW, x2 = C.x, mx = (x1 + x2) / 2;
    const tip = l.havuz ? `${fmt(Math.round(l.w))} havuz bağlantısı (önceden açık DB bağlantısı; istek anında açılmadığı için oturumla eşleşmez)`
      : `${fmt(Math.round(l.w))} oturum${l.oran ? ` (${pct(l.oran)})` : ""}`;
    edges += `<path class="pe out${l.havuz ? " pool" : ""}" data-a="${esc(l.a)}" data-c="${esc(l.c)}" stroke-width="${l.havuz ? 2 : sw(l.w)}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"><title>${esc(ga.name)} → ${esc(gc.name)}: ${tip}</title></path>`;
  }
  for (const g of [...groups, ...shared]) {
    const P = pos.get(g.k), cls = g.root ? "proc" : g.ortak ? "shared" : g.level < 0 ? "in" : "out";
    const ipLines = g.ips.slice(0, MAXL).map((ip, i) => `<text class="t3 mono" x="10" y="${(g.sub ? 50 : 36) + i * LINE}">${esc(ip)}</text>`).join("")
      + (g.ips.length > MAXL ? `<text class="t3" x="10" y="${(g.sub ? 50 : 36) + MAXL * LINE}">+${g.ips.length - MAXL} daha</text>` : "");
    nodes += `<g class="pn ${cls}" data-g="${esc(g.k)}" ${g.ips.length === 1 && g.kind !== "dis" ? `data-ip="${esc(g.ips[0])}"` : ""} transform="translate(${P.x},${P.y})">
      <rect width="${BW}" height="${boxH(g)}" rx="8" ${g.kind === "vip" ? `style="stroke:var(--vip)"` : g.kind === "dis" ? `style="stroke-dasharray:5 3"` : ""}/>
      <title>${esc(g.name)}${g.ortak ? ` (ortak hizmet)\n${esc(g.sub)}` : ""}\n${g.ips.map(esc).join("\n")}</title>
      <text class="t1" x="10" y="18">${esc(trunc(g.name, 30))}</text>
      ${g.sub ? `<text class="t2" x="10" y="34">${esc(trunc(g.sub, 34))}</text>` : ""}${ipLines}</g>`;
  }
  const heads = levels.map((l, i) => `<text class="colhead" x="${i * (BW + GX) + BW / 2}" y="16" text-anchor="middle">${colTitle(l)}</text>`).join("")
    + (shared.length ? `<line x1="0" x2="${W}" y1="${sharedTop}" y2="${sharedTop}" class="sep"/><text class="colhead" x="0" y="${sharedTop + 14}">ORTAK HİZMETLER (izleme, önbellek, log — hangi durakta görülürse görülsün tek kutu; üstüne gelince bağlı kutular yanar)</text>` : "");
  el.innerHTML = head + `<div class="status" style="margin-bottom:8px"><span class="pill">${esc(b.kaynaklar)} · ${esc(b.pencere)}</span>
      <span class="pill">${fmt(groups.length)} durak · ${(b.sureMs / 1000).toFixed(1)} sn</span></div>
    ${b.mesajlar.length ? `<div class="msgs">${esc(b.mesajlar.join("\n"))}</div>` : ""}
    <div class="topo-wrap"><svg class="proc-svg" id="jourSvg" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${Math.min(W, 1100)}px">${heads}${edges}${nodes}</svg></div>`;

  // Bir kutunun üstüne gelince ondan geçen tüm yol (geriye ve ileriye) vurgulanır.
  const svg = $("#jourSvg");
  const out = new Map(), inn = new Map();
  links.forEach(l => { (out.get(l.a) ?? out.set(l.a, []).get(l.a)).push(l); (inn.get(l.c) ?? inn.set(l.c, []).get(l.c)).push(l); });
  svg.querySelectorAll(".pn").forEach(n => {
    n.addEventListener("mouseenter", () => {
      const on = new Set([n.dataset.g]), onE = new Set();
      // Ortak hizmet kutusundan geçilmez (her şeyi yakmasın); ortak kutunun üstündeyken yalnızca bağlı kutular yanar
      const walk = (k, map, next) => (map.get(k) ?? []).forEach(l => { onE.add(`${l.a}>${l.c}`); if (!on.has(l[next])) { on.add(l[next]); if (!sharedKeys.has(l[next])) walk(l[next], map, next); } });
      if (sharedKeys.has(n.dataset.g)) links.forEach(l => { if (l.a === n.dataset.g) on.add(l.c); if (l.c === n.dataset.g) on.add(l.a); });
      else { walk(n.dataset.g, out, "c"); walk(n.dataset.g, inn, "a"); }
      svg.classList.add("hl");
      svg.querySelectorAll(".pn").forEach(x => x.classList.toggle("on", on.has(x.dataset.g)));
      svg.querySelectorAll(".pe").forEach(x => x.classList.toggle("on", onE.has(`${x.dataset.a}>${x.dataset.c}`)));
    });
    n.addEventListener("mouseleave", () => { svg.classList.remove("hl"); svg.querySelectorAll(".on").forEach(x => x.classList.remove("on")); });
    n.addEventListener("click", () => { if (n.dataset.ip) { $("#ip").value = n.dataset.ip; closeFlow(); run(); } });
  });
}

// ---------- Oturum akışı: aynı oturumda gelen → giden (AppResponse, zaman kapsaması) ----------
let sessAbort = null;

async function runSess(params) {
  sessAbort?.abort();
  sessAbort = new AbortController();
  state.sess = { status: "loading" };
  renderProc();
  try {
    const p = new URLSearchParams({ ip: params.get("ip"), start: params.get("start"), end: params.get("end"), appliance: params.get("appliance"),
      sources: params.get("sources") });
    const r = await fetch("api/oturum?" + p, { signal: sessAbort.signal });
    const body = await r.json().catch(() => ({ error: `HTTP ${r.status}: sunucu JSON yerine başka bir yanıt döndü (zaman aşımı, yetki ya da sunucu hata sayfası olabilir)` }));
    if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
    expectList(body, "girisler");
    state.sess = { status: "ok", body, rare: false, sel: null };
  } catch (e) {
    state.sess = e.name === "AbortError" ? null : { status: "error", error: e.message };
  }
  renderProc();
}

const pct = x => `%${Math.round(x * 100)}`;
const peerLabel = p => p.apps.length ? p.apps.slice(0, 2).join(", ") : p.vip ? "VIP" : p.lbGw ? "Load balancer GW" : "uygulama ?";

function renderSess(el, tabs) {
  const ss = state.sess;
  const head = extra => `<div class="toolbar">${tabs}${extra ?? ""}</div>
    <div class="small muted" style="margin:-4px 0 8px">AppResponse (milisaniye, segment içi dahil) ve Firewall (saniye, yalnızca firewall'dan geçen): sorgulanan sunucuya gelen her kısa bağlantının (bir istek) açık olduğu süre içinde sunucunun açtığı giden bağlantılar o isteğe bağlanır. Çizgi kalınlığı bağlantı sayısı, koyuluğu o girişin oturumlarından yüzde kaçında görüldüğü.</div>`;
  if (!ss) { el.innerHTML = head() + `<div class="muted">AppResponse ya da Firewall kaynağı seçili değil.</div>`; return; }
  if (ss.status === "loading") { el.innerHTML = head() + `<div class="muted"><span class="spinner"></span> Bağlantılar tek tek çekiliyor ve oturumlar eşleştiriliyor (en fazla son 15 dk)…</div>`; return; }
  if (ss.status === "error") { el.innerHTML = head() + `<div style="color:var(--err)">${esc(ss.error)}</div>`; return; }

  const b = ss.body;
  const trust = b.ortAyniAnda <= 1.5 ? ["güvenilir", "ok"] : b.ortAyniAnda <= 4 ? ["orta", "warn"] : ["zayıf", "err"];
  const stats = `<div class="status" style="margin-bottom:8px">
      <span class="pill">${esc(b.kutu)} bağlantı · ${esc(b.pencere)} · çözünürlük: ${esc(b.cozunurluk)}</span>
      <span class="pill">${fmt(b.gelenOturum - b.uzunOturum)} gelen oturum${b.uzunOturum ? ` (+${fmt(b.uzunOturum)} uzun/keep-alive, dışarıda)` : ""}</span>
      <span class="pill">${fmt(b.gidenBaglanti)} giden bağlantı · ${fmt(b.eslesmeyen)} tanesi hiçbir oturuma düşmedi</span>
      <span class="pill" title="Bir giden bağlantının başladığı anda ortalama kaç gelen oturum açıktı. 1'e yakınsa eşleşme kesin.">aynı anda ort. ${b.ortAyniAnda} → eşleşme <b style="color:var(--${trust[1]})">${trust[0]}</b></span>
    </div>${b.mesajlar.length ? `<div class="msgs">${esc(b.mesajlar.join("\n"))}</div>` : ""}`;
  const tools = `<div class="checks" style="padding:0">
      <label title="Oturumların %5'inden azında görülen hedefler (genelde arka plan trafiği)"><input type="checkbox" id="sessRare" ${ss.rare ? "checked" : ""}> Seyrek hedefler</label>
      ${ss.sel ? `<span class="chip">Giriş: ${esc(ss.sel.slice(2))} <button type="button" id="sessClear" title="Tümünü göster">✕</button></span>` : ""}</div>`;

  const girisler = b.girisler.filter(g => envSegAllowed(g.kaynak.segment))
    .map(g => ({ ...g, hedefler: g.hedefler.filter(h => (ss.rare || h.oran >= 0.05) && envSegAllowed(h.hedef.segment)) }));
  if (!girisler.length) {
    el.innerHTML = head(tools) + stats + `<div class="muted">Bu aralıkta eşleşen gelen oturum yok.</div>`;
    wireSess(); return;
  }

  // Uygulama bazında tek kutu: aynı uygulamanın IP'leri kutunun içinde liste. Uygulaması bilinmeyenler segmente göre.
  const appKey = p => p.apps.length ? "a:" + [...p.apps].sort().join(" + ") : "s:" + (p.segment ? p.segment.label : "?");
  const appName = p => p.apps.length ? [...p.apps].sort().join(" + ") : `${p.segment ? p.segment.label : "Segment ?"} · uygulaması bilinmeyen`;
  const leftMap = new Map(), rightMap = new Map();
  for (const g of girisler) {
    const lk = appKey(g.kaynak);
    const L = leftMap.get(lk) ?? leftMap.set(lk, { k: lk, name: appName(g.kaynak), members: new Map(), n: 0, ms: [], links: new Map() }).get(lk);
    L.n += g.oturum; L.ms.push(g.sureMsMedyan);
    L.members.set(`${g.kaynak.ip} → :${g.kaynak.port}`, (L.members.get(`${g.kaynak.ip} → :${g.kaynak.port}`) ?? 0) + g.oturum);
    const cover = new Map();   // bu girişin oturumlarının yüzde kaçı hedef gruba gitti (üst sınır 1)
    for (const h of g.hedefler) {
      const rk = appKey(h.hedef);
      const R = rightMap.get(rk) ?? rightMap.set(rk, { k: rk, name: appName(h.hedef), members: new Map(), w: 0, ip: h.hedef.ip }).get(rk);
      R.w += h.agirlik;
      R.members.set(`${h.hedef.ip}:${h.hedef.port}`, (R.members.get(`${h.hedef.ip}:${h.hedef.port}`) ?? 0) + h.agirlik);
      const e = L.links.get(rk) ?? L.links.set(rk, { w: 0, exact: 0, cov: 0 }).get(rk);
      e.w += h.agirlik; e.exact += h.kesin;
      cover.set(rk, Math.min(1, (cover.get(rk) ?? 0) + h.oran));
    }
    for (const [rk, c] of cover) L.links.get(rk).cov += c * g.oturum;
  }
  const leftAll = [...leftMap.values()].sort((x, y) => y.n - x.n);
  const left = ss.sel ? leftAll.filter(L => L.k === ss.sel) : leftAll;
  const usedRight = new Set(left.flatMap(L => [...L.links.keys()]));
  const right = [...rightMap.values()].filter(R => usedRight.has(R.k)).sort((x, y) => y.w - x.w);

  const W = 1240, NW = 360, GAP = 12, CX = W / 2, CW = 170, LINE = 14, MAXL = 6;
  const boxH = m => 36 + LINE * (Math.min(m.size, MAXL) + (m.size > MAXL ? 1 : 0));
  const colH = list => list.reduce((a, x) => a + boxH(x.members) + GAP, -GAP);
  const H = Math.max(colH(left), colH(right), 80) + 50;
  const place = list => { let y = 34 + (H - 34 - colH(list)) / 2; return new Map(list.map(x => { const r = [x.k, y]; y += boxH(x.members) + GAP; return r; })); };
  const ly = place(left), ry = place(right);
  const maxW = Math.max(1, ...left.flatMap(L => [...L.links.values()].map(e => e.w)));
  const sw = w => (1.5 + 9 * Math.log(1 + w) / Math.log(1 + maxW)).toFixed(1);
  const memberLines = (m, x0, y0, fmtV) => {
    const list = [...m.entries()].sort((a, c) => c[1] - a[1]);
    let out = list.slice(0, MAXL).map(([t, v], i) => `<text class="t3 mono" x="${x0}" y="${y0 + i * LINE}">${esc(trunc(t, 34))}</text><text class="t3" x="${NW - 10}" y="${y0 + i * LINE}" text-anchor="end">${fmtV(v)}</text>`).join("");
    if (list.length > MAXL) out += `<text class="t3" x="${x0}" y="${y0 + MAXL * LINE}">+${list.length - MAXL} daha</text>`;
    return out;
  };

  let edges = "", nodes = "";
  left.forEach(L => {
    const y1 = ly.get(L.k) + boxH(L.members) / 2;
    for (const [rk, e] of L.links) {
      if (!ry.has(rk)) continue;
      const R = rightMap.get(rk), y2 = ry.get(rk) + boxH(R.members) / 2, oran = e.cov / L.n;
      edges += `<path class="pe out" data-l="${esc(L.k)}" data-r="${esc(rk)}" stroke-width="${sw(e.w)}" stroke-opacity="${(0.35 + 0.65 * oran).toFixed(2)}"
        d="M${NW},${y1} C${CX - 60},${y1} ${CX - 60},${(y1 + y2) / 2} ${CX},${(y1 + y2) / 2} S${CX + 60},${y2} ${W - NW},${y2}"><title>${esc(L.name)} oturumlarının ${pct(oran)}'ünde → ${esc(R.name)}\n${fmt(Math.round(e.w))} bağlantı (${fmt(e.exact)} kesin)</title></path>`;
    }
    const med = L.ms.sort((a, c) => a - c)[Math.floor(L.ms.length / 2)];
    nodes += `<g class="pn in" data-l="${esc(L.k)}" transform="translate(0,${ly.get(L.k)})"><rect width="${NW}" height="${boxH(L.members)}" rx="8"/>
      <title>${esc(L.name)}\n${fmt(L.n)} oturum, medyan ${fmt(med)} ms\nTıkla: yalnızca bu uygulama</title>
      <text class="t1" x="10" y="17">${esc(trunc(L.name, 40))}</text><text class="t3" x="${NW - 10}" y="17" text-anchor="end">${fmt(L.n)} oturum</text>
      ${memberLines(L.members, 10, 34, v => fmt(v))}</g>`;
  });
  right.forEach(R => {
    const single = R.members.size === 1;
    nodes += `<g class="pn out" data-r="${esc(R.k)}" ${single ? `data-ip="${esc(R.ip)}"` : ""} transform="translate(${W - NW},${ry.get(R.k)})"><rect width="${NW}" height="${boxH(R.members)}" rx="8"/>
      <title>${esc(R.name)}\n${[...R.members.keys()].map(esc).join("\n")}${single ? "\nTıkla: bu IP'nin topolojisini aç" : ""}</title>
      <text class="t1" x="10" y="17">${esc(trunc(R.name, 40))}</text><text class="t3" x="${NW - 10}" y="17" text-anchor="end">${fmt(Math.round(R.w))}</text>
      ${memberLines(R.members, 10, 34, v => fmt(Math.round(v)))}</g>`;
  });
  const center = `<g><rect x="${CX - CW / 2}" y="28" width="${CW}" height="${H - 36}" rx="10" fill="var(--target)" opacity=".08"/>
    <text class="colhead" x="${CX}" y="16" text-anchor="middle">${esc(b.ip)}</text></g>`;
  el.innerHTML = head(tools) + stats + `<div class="topo-wrap" style="max-height:none"><svg class="proc-svg" id="sessSvg" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:1000px">
      <text class="colhead" x="0" y="16">GELEN (${fmt(left.length)} uygulama)</text><text class="colhead" x="${W}" y="16" text-anchor="end">AYNI OTURUMDA GİDİLEN (${fmt(right.length)} uygulama)</text>
      ${center}${edges}${nodes}</svg></div>`;
  wireSess();
}

function wireSess() {
  $("#sessRare")?.addEventListener("change", ev => { state.sess.rare = ev.target.checked; renderProc(); });
  $("#sessClear")?.addEventListener("click", () => { state.sess.sel = null; renderProc(); });
  const svg = $("#sessSvg"); if (!svg) return;
  const clear = () => { svg.classList.remove("hl"); svg.querySelectorAll(".on").forEach(x => x.classList.remove("on")); };
  svg.querySelectorAll(".pn").forEach(g => {
    g.addEventListener("mouseenter", () => {
      svg.classList.add("hl"); g.classList.add("on");
      svg.querySelectorAll(".pe").forEach(e => {
        if (g.dataset.l ? e.dataset.l !== g.dataset.l : e.dataset.r !== g.dataset.r) return;
        e.classList.add("on");
        svg.querySelectorAll(`.pn[data-l="${CSS.escape(e.dataset.l)}"], .pn[data-r="${CSS.escape(e.dataset.r)}"]`).forEach(x => x.classList.add("on"));
      });
    });
    g.addEventListener("mouseleave", clear);
    g.addEventListener("click", () => {
      if (g.dataset.l) { state.sess.sel = state.sess.sel === g.dataset.l ? null : g.dataset.l; renderProc(); }
      else if (g.dataset.ip) { $("#ip").value = g.dataset.ip; closeFlow(); run(); }
    });
  });
}

// ---------- AI etki analizi ----------
const AI_DEFAULT_Q = "Bu sunucuda bir değişiklik (bakım, yeniden başlatma, sürüm/konfigürasyon değişikliği, kapatma) yapılırsa nereler etkilenir?";
const AI_MAX_PEERS = 30;
let aiAbort = null;

// Sorgu sonucunu AI'a gidecek bağlantı listesine çevirir: her (karşı IP, port) için iki uçtaki uygulamalar.
// 2. seviye gönderilmez; etki listesi backend'de servis → kullanan uygulama olarak gruplanır.
const AI_MAX_EDGES = 80;
function buildAiRequest() {
  const d = state.data;
  // Firewall'da tamamen engellenen bağlantılar çalışan bir bağımlılık değildir; AI'a gönderilmez.
  const edgesOf = dir => (dir === "in" ? d.inbound : d.outbound)
    .filter(e => !(e.firewallDenied && e.firewallDenied >= e.hits))
    .slice().sort((a, b) => b.hits - a.hits).slice(0, AI_MAX_EDGES)
    .map(e => {
      const apps = e.peerApps?.apps ?? [];
      return {
        ip: e.peerIp,
        segment: e.peerSegment ? `${e.peerSegment.label}${e.peerSegment.label !== e.peerSegment.cidr ? " " + e.peerSegment.cidr : ""}` : null,
        apps: [...appNames(e.peerApps), ...(vipText(e) ? [vipText(e)] : [])],
        owners: [...new Set(apps.flatMap(a => [a.varlikMuhafizi, a.uygulamaVarlikSahibi]).filter(Boolean))],
        port: e.port === "" ? "web" : e.port,
        hits: e.hits,
        localApps: dir === "in" ? appNames(e.localApp) : null,
        processes: dir === "out" ? e.processes.slice(0, 6) : null
      };
    });
  const t = d.target;
  return {
    question: $("#aiQ").value.trim(),
    ip: t.ip,
    segment: t.segment ? `${t.segment.label} (${t.segment.cidr}${t.segment.vlan ? ", VLAN " + t.segment.vlan : ""})` : null,
    apps: [...new Set(t.apps.map(a => `${appName(a)}${a.port ? " :" + a.port : ""}`)),
      ...(t.vip?.length ? [`VIP (load balancer), havuz: ${[...new Set(t.vip.map(m => m.pool).filter(Boolean))].join(", ")}; üyeler: ${t.vip.map(m => `${m.hostname ?? ""} ${m.ip}:${m.port ?? ""}`).join(", ")}`] : []),
      ...(t.memberOf?.length ? [`VIP havuz üyesi: ${t.memberOf.map(m => `${m.lbIp}:${m.lbPort ?? ""} (${m.pool ?? ""})`).join(", ")}`] : [])],
    period: state.lastParams ? `${state.lastParams.get("start").replace("T", " ")} - ${state.lastParams.get("end").replace("T", " ")}` : null,
    inbound: edgesOf("in"), outbound: edgesOf("out"),
    inboundTotal: sideServers("in").length, outboundTotal: sideServers("out").length
  };
}

// Alttaki sabit soru satırı; cevap hemen onun üstünde açılan panelde (#aiPanel) gösterilir, kaydırma gerekmez.
function showAiPanel(html) {
  if (!$("#aiPanel")) return;
  $("#aiOut").innerHTML = html;
  $("#aiPanel").hidden = false;
  $("#aiShow").hidden = true;
  $("#aiPanel").scrollTop = 0;
}
// Sayfa sonundaki içerik sabit satırın altında kalmasın diye satır yüksekliği kadar boşluk bırakılır.
let dockObserver = null;
function watchDockHeight() {
  dockObserver?.disconnect();
  const dock = $("#aiDock");
  if (!dock || !window.ResizeObserver) return;
  dockObserver = new ResizeObserver(() => document.documentElement.style.setProperty("--dock-h", dock.offsetHeight + "px"));
  dockObserver.observe(dock);
}

async function runAi() {
  aiAbort?.abort();
  aiAbort = new AbortController();
  const btn = $("#aiGo");
  btn.disabled = true;
  showAiPanel(`<div class="muted"><span class="spinner"></span> AI yorumluyor… (birkaç dakika sürebilir)</div>`);
  try {
    const r = await fetch("api/ai/etki", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(buildAiRequest()), signal: aiAbort.signal });
    const body = await r.json().catch(() => ({ error: `HTTP ${r.status}: sunucu JSON yerine başka bir yanıt döndü (zaman aşımı, yetki ya da sunucu hata sayfası olabilir)` }));
    if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
    showAiPanel(`<div class="ai-out">${renderMarkdown(body.answer)}</div>
      <div class="ai-meta">Model: ${esc(body.model)} · ${(body.elapsedMs / 1000).toFixed(1)} sn
        <details><summary>AI'a gönderilen metin</summary><pre>${esc(body.prompt)}</pre></details></div>`);
  } catch (e) {
    if (e.name !== "AbortError") showAiPanel(`<div style="color:var(--err)">${esc(e.message)}</div>`);
  } finally {
    btn.disabled = false;
  }
}

// Modelin döndürdüğü basit markdown: ## başlık, - madde, **kalın**.
function renderMarkdown(text) {
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  let html = "", inList = false;
  for (const raw of String(text ?? "").split(/\r?\n/)) {
    const line = raw.trim();
    const item = line.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (item) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(item[1])}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    const h = line.match(/^#{1,6}\s+(.*)$/);
    if (h) html += `<h3>${inline(h[1])}</h3>`;
    else if (line) html += `<p>${inline(line)}</p>`;
  }
  return html + (inList ? "</ul>" : "");
}

// ---------- Segment özeti ----------
function renderSummary() {
  for (const dir of ["in", "out"]) {
    const edges = dir === "in" ? state.data.inbound : state.data.outbound;
    const m = new Map();
    for (const e of edges) {
      const k = zoneKey(e);
      let r = m.get(k);
      if (!r) m.set(k, r = { key: k, seg: e.peerSegment, same: sameSegment(e), cidrs: new Set(), vlans: new Set(), ips: new Set(), ports: new Set(), apps: new Set(), hits: 0 });
      if (e.peerSegment) { r.cidrs.add(e.peerSegment.cidr); if (e.peerSegment.vlan) r.vlans.add(e.peerSegment.vlan); }
      r.ips.add(e.peerIp); r.ports.add(e.port); r.hits += e.hits;
      appNames(dir === "in" ? e.localApp : e.peerApps).forEach(a => r.apps.add(a));
    }
    const rows = [...m.values()].sort((a, b) => b.hits - a.hits);
    $("#sum-" + dir).innerHTML = `
      <h2 style="color:var(--${dir})">${dir === "in" ? `Gelen: ${fmt(rows.length)} segmentten geliniyor` : `Giden: ${fmt(rows.length)} segmente gidiliyor`}</h2>
      ${rows.length ? `<div class="tbl-wrap" style="max-height:340px"><table>
        <thead><tr><th>Segment</th><th>VLAN</th><th class="num">IP</th><th>Port</th><th>${dir === "in" ? "Karşılayan uygulama" : "Hedef uygulama"}</th><th class="num">Hit</th></tr></thead>
        <tbody>${rows.map(r => `<tr class="click" data-dir="${dir}" data-key="${esc(r.key)}">
          <td>${r.seg ? `<b>${esc(r.seg.label)}</b>${r.same ? ' <span class="badge strong">aynı segment</span>' : ""}<div class="small muted mono" title="${esc([...r.cidrs].join(", "))}">${esc([...r.cidrs].slice(0, 3).join(", "))}${r.cidrs.size > 3 ? ` +${r.cidrs.size - 3}` : ""}${r.seg.tenant ? " · " + esc(r.seg.tenant) : ""}</div>` : `<span class="unk">Segment envanterinde yok</span>`}</td>
          <td class="mono">${esc([...r.vlans].join(", "))}</td>
          <td class="num">${fmt(r.ips.size)}</td>
          <td class="mono">${esc([...r.ports].sort(portSort).map(portText).slice(0, 8).join(", "))}${r.ports.size > 8 ? "…" : ""}</td>
          <td>${esc([...r.apps].slice(0, 4).join(", "))}${r.apps.size > 4 ? "…" : ""}</td>
          <td class="num">${fmt(r.hits)}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">Kayıt yok.</div>`}`;
    $("#sum-" + dir).querySelectorAll("tr.click").forEach(tr => tr.addEventListener("click", () => {
      const k = tr.dataset.key, row = rows.find(r => r.key === k);
      state.selected = null;
      state.filter = { dir, label: row.seg ? row.seg.label : "segment bilinmiyor", test: e => zoneKey(e) === k };
      renderTopology(); renderDetail(); renderTables();
      document.getElementById("tbl-" + dir).scrollIntoView({ behavior: "smooth" });
    }));
  }
}

// ---------- Görüntü indirme ----------
function exportImage(kind) {
  const src = $("#topoSvg"); if (!src) return;
  const clone = src.cloneNode(true);
  const props = ["fill", "stroke", "stroke-width", "stroke-dasharray", "opacity", "font-size", "font-weight", "font-family", "font-style"];
  const a = [src, ...src.querySelectorAll("*")], b = [clone, ...clone.querySelectorAll("*")];
  a.forEach((el, i) => { const cs = getComputedStyle(el); b[i].setAttribute("style", props.map(p => `${p}:${cs.getPropertyValue(p)}`).join(";")); });
  const [, , w, h] = src.getAttribute("viewBox").split(" ").map(Number);
  clone.setAttribute("width", w); clone.setAttribute("height", h);
  clone.querySelector("*") && clone.insertAdjacentHTML("afterbegin", `<rect width="${w}" height="${h}" fill="${getComputedStyle(document.body).backgroundColor}"></rect>`);
  const xml = new XMLSerializer().serializeToString(clone);
  const name = `DeltaFlow_${uiMode === "app" ? appState.data.name.replace(/[^\w.-]+/g, "_") : state.data.target.ip}_topoloji`;
  const save = (blob, ext) => { const l = document.createElement("a"); l.href = URL.createObjectURL(blob); l.download = `${name}.${ext}`; l.click(); setTimeout(() => URL.revokeObjectURL(l.href), 1000); };
  if (kind === "svg") { save(new Blob([xml], { type: "image/svg+xml" }), "svg"); return; }
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas"); c.width = w * 2; c.height = h * 2;
    const ctx = c.getContext("2d"); ctx.scale(2, 2); ctx.drawImage(img, 0, 0);
    c.toBlob(bl => save(bl, "png"));
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
}

// ---------- Tablolar ----------
const COLS = {
  in: [
    { h: "Kaynak IP", v: e => e.peerIp, c: "mono" },
    { h: "Kaynak segment", v: e => segLabel(e.peerSegment) ?? "", html: e => segCell(e.peerSegment) },
    { h: "Kaynak uygulama", v: e => [appNames(e.peerApps).join(", "), vipText(e)].filter(Boolean).join(" · "), html: e => appsCell(e.peerApps, false) + vipBadge(e) },
    { h: "Port", v: e => portText(e.port), c: "mono" },
    { h: "Karşılayan uygulama", v: e => appNames(e.localApp).join(", "), html: e => appsCell(e.localApp, true) },
    ...commonCols()
  ],
  out: [
    { h: "Hedef IP", v: e => e.peerIp, c: "mono" },
    { h: "Hedef segment", v: e => segLabel(e.peerSegment) ?? "", html: e => segCell(e.peerSegment) },
    { h: "Port", v: e => portText(e.port), c: "mono" },
    { h: "Hedef uygulama", v: e => [appNames(e.peerApps).join(", "), vipText(e)].filter(Boolean).join(" · "), html: e => appsCell(e.peerApps, true) + vipBadge(e) },
    ...commonCols()
  ]
};

function commonCols() {
  return [
    { h: "Hit", v: e => e.hits, c: "num", html: e => fmt(e.hits) },
    { h: "Splunk", v: e => e.splunkHits, c: "num", html: e => e.splunkHits ? fmt(e.splunkHits) : "" },
    { h: "AppResp.", v: e => e.appResponseHits, c: "num", html: e => e.appResponseHits ? fmt(e.appResponseHits) : "" },
    { h: "Firewall", v: e => e.firewallHits ?? 0, c: "num", html: fwCell },
    { h: "Son görülme", v: e => e.lastSeen ?? "", c: "mono" },
    { h: "Detay", v: e => [...e.computers, ...e.processes, ...e.urls, ...(e.fwRules ?? []), ...(e.fwApps ?? [])].join(" "), html: detailCell }
  ];
}

const vipText = e => e.peerVip ? `VIP → ${[...new Set(e.peerVip.map(m => m.hostname ?? m.ip))].join(", ")}`
  : e.viaVip ? `VIP üyesi (${e.viaVip.lbIp}:${e.viaVip.lbPort ?? ""})` : e.peerVipGw ? `LB GW (${e.peerVipGw})` : "";
const vipBadge = e => vipText(e) ? `<div><span class="badge vip">${esc(vipText(e))}</span></div>` : "";

function segCell(s) {
  return s ? `${esc(s.label)}<div class="small muted mono">${esc(s.cidr)}${s.vlan ? " · VLAN " + esc(s.vlan) : ""}</div>` : `<span class="unk">bilinmiyor</span>`;
}
function appsCell(m, showBadge) {
  const n = appNames(m);
  if (!n.length) return `<span class="unk">bilinmiyor</span>`;
  const owner = [...new Set(m.apps.map(a => a.varlikMuhafizi).filter(Boolean))][0];
  return `${n.map(x => `<div>${esc(x)}</div>`).join("")}${owner ? `<div class="small muted">${esc(owner)}</div>` : ""}${showBadge ? matchBadge(m) : ""}`;
}
// Firewall oturum sayısı; engellenen varsa kırmızı ayrıca
function fwCell(e) {
  if (!e.firewallHits) return "";
  const allowed = e.firewallHits - (e.firewallDenied ?? 0);
  return `${allowed ? fmt(allowed) : ""}${e.firewallDenied ? `<div class="fw-deny" title="Firewall'da engellenen oturum">⛔ ${fmt(e.firewallDenied)} engel</div>` : ""}`;
}
function detailCell(e) {
  const parts = [];
  if (e.fwApps?.length) parts.push(`<span class="badge" title="Firewall App-ID">${esc(e.fwApps.slice(0, 3).join(", "))}</span>`);
  if (e.fwRules?.length) parts.push(`<div class="small" title="Firewall kuralı">🛡 ${esc(e.fwRules.slice(0, 3).join(", "))}${e.fwRules.length > 3 ? "…" : ""}${e.fwDevices?.length ? ` <span class="muted">(${esc(e.fwDevices.slice(0, 2).join(", "))})</span>` : ""}</div>`);
  if (e.protocols.length) parts.push(`<span class="badge">${esc(e.protocols.join("/"))}</span>`);
  if (e.computers.length) parts.push(`<div class="small">💻 ${esc(e.computers.slice(0, 3).join(", "))}${e.computers.length > 3 ? "…" : ""}</div>`);
  if (e.processes.length) parts.push(`<div class="small">⚙ ${esc(e.processes.slice(0, 3).join(", "))}${e.processes.length > 3 ? "…" : ""}</div>`);
  if (e.urls.length) parts.push(`<details class="small"><summary>${e.urls.length} URL</summary>${e.urls.map(u => `<div class="mono">${esc(u)}</div>`).join("")}</details>`);
  return parts.join("");
}

function visibleEdges(dir) {
  let list = dir === "in" ? state.data.inbound : state.data.outbound;
  const f = state.filter;
  if (f && f.dir === dir) list = list.filter(f.test);
  const q = state.search[dir].toLowerCase();
  if (q) list = list.filter(e => COLS[dir].some(c => String(c.v(e)).toLowerCase().includes(q)));
  const s = state.sort[dir];
  if (s) {
    const col = COLS[dir][s.i];
    list = [...list].sort((a, b) => {
      const x = col.v(a), y = col.v(b);
      const r = typeof x === "number" ? x - y : String(x).localeCompare(String(y), "tr", { numeric: true });
      return s.desc ? -r : r;
    });
  }
  return list;
}

function renderTables() {
  for (const dir of ["in", "out"]) {
    const el = $("#tbl-" + dir);
    const rows = visibleEdges(dir);
    const total = (dir === "in" ? state.data.inbound : state.data.outbound).length;
    const cols = COLS[dir];
    const s = state.sort[dir];
    el.innerHTML = `
      <div class="toolbar">
        <h2 style="margin:0">${dir === "in" ? "Gelen trafik — bu makineye kim geliyor" : "Giden trafik — bu makine nereye gidiyor"}
          <span class="muted" style="font-weight:400">(${fmt(rows.length)}${rows.length !== total ? " / " + fmt(total) : ""})</span></h2>
        <div style="display:flex;gap:8px">
          <input type="search" placeholder="Tabloda ara…" value="${esc(state.search[dir])}" data-search="${dir}">
          <button type="button" data-csv="${dir}">CSV</button>
        </div>
      </div>
      ${rows.length ? `<div class="tbl-wrap"><table>
        <thead><tr>${cols.map((c, i) => `<th class="${c.c === "num" ? "num" : ""}" data-sort="${i}">${c.h}${s && s.i === i ? (s.desc ? " ▼" : " ▲") : ""}</th>`).join("")}</tr></thead>
        <tbody>${rows.map(e => `<tr>${cols.map(c => `<td class="${c.c ?? ""}">${c.html ? c.html(e) : esc(c.v(e))}</td>`).join("")}</tr>`).join("")}</tbody>
      </table></div>` : `<div class="empty">Kayıt yok.</div>`}`;

    const inp = el.querySelector("[data-search]");
    inp.addEventListener("input", () => {
      state.search[dir] = inp.value;
      const pos = inp.selectionStart;
      renderTables();
      const again = $(`#tbl-${dir} [data-search]`); again.focus(); again.setSelectionRange(pos, pos);
    });
    el.querySelector("[data-csv]").addEventListener("click", () => exportCsv(dir));
    el.querySelectorAll("th[data-sort]").forEach(th => th.addEventListener("click", () => {
      const i = +th.dataset.sort, cur = state.sort[dir];
      state.sort[dir] = cur && cur.i === i ? (cur.desc ? null : { i, desc: true }) : { i, desc: cols[i].c === "num" };
      renderTables();
    }));
  }
}

function exportCsv(dir) {
  const cols = COLS[dir];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [cols.map(c => q(c.h)).join(";"), ...visibleEdges(dir).map(e => cols.map(c => q(c.v(e))).join(";"))];
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `DeltaFlow_${state.data.target.ip}_${dir === "in" ? "gelen" : "giden"}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

window.addEventListener("resize", applyZoom);
const selectedSources = () => [$("#srcSplunk").checked && "splunk", $("#srcAr").checked && "appresponse",
  $("#srcFw").checked && "firewall"].filter(Boolean);

// ---------- Ortam filtreleri (ODM, TEST...) ----------
// Karşı IP'nin segment Domain'inde anahtar kelime geçiyorsa o kategoriye girer; kutucuk işaretli değilse gizlenir.
let envFilters = [{ key: "odm", label: "ODM", keyword: "odm" }, { key: "test", label: "TEST", keyword: "test" }];
const envShow = {};
fetch("api/filtreler").then(r => r.ok ? r.json() : null).then(f => { if (Array.isArray(f) && f.length) envFilters = f; }).catch(() => {});

function envCat(seg) {
  const d = (seg?.domain ?? "").toLocaleLowerCase("tr");
  if (!d) return null;
  return envFilters.find(f => d.includes(f.keyword.toLocaleLowerCase("tr")))?.key ?? null;
}
// Karşı IP bir VIP ise kendi segmenti (LB) ortam bilgisi taşımaz; havuz üyelerinin hepsi aynı ortamdaysa VIP de o ortamdandır.
function edgeEnv(e) {
  const own = envCat(e.peerSegment);
  if (own || !e.peerVip?.length) return own;
  const cats = e.peerVip.map(m => envCat(m.segment));
  return cats[0] && cats.every(c => c === cats[0]) ? cats[0] : null;
}
const envAllowed = e => { const c = edgeEnv(e); return !c || !!envShow[c]; };
const envSegAllowed = seg => { const c = envCat(seg); return !c || !!envShow[c]; };
// VIP'in havuz üyeleri (viaVip) sorgulanan VIP'in parçası olduğu için filtrelenmez.
const envFiltered = raw => ({
  ...raw,
  inbound: raw.inbound.filter(e => envAllowed(e)),
  outbound: raw.outbound.filter(e => e.viaVip || envAllowed(e))
});
// Kategori başına gizlenen farklı IP sayısı (ham veriden)
function envHiddenIps(raw) {
  const m = {};
  for (const e of [...raw.inbound, ...raw.outbound]) {
    const c = edgeEnv(e);
    if (c && !e.viaVip) (m[c] ??= new Set()).add(e.peerIp);
  }
  return Object.fromEntries(Object.entries(m).map(([k, v]) => [k, v.size]));
}
function envToggleHtml(counts) {
  return `<div class="checks" style="padding:0" title="Segment Domain'inde bu ifade geçen IP'ler; işaretliyse gösterilir">
    ${envFilters.map(f => `<label><input type="checkbox" data-env="${esc(f.key)}" ${envShow[f.key] ? "checked" : ""}> ${esc(f.label)} <span class="muted">(${fmt(counts[f.key] ?? 0)} IP)</span></label>`).join("")}
  </div>`;
}
function wireEnvToggles(onChange) {
  document.querySelectorAll("[data-env]").forEach(cb => cb.addEventListener("change", () => { envShow[cb.dataset.env] = cb.checked; onChange(); }));
}

fetch("api/me").then(r => r.ok ? r.json() : null).then(me => { if (me?.name) $("#me").textContent = "👤 " + me.name; }).catch(() => {});
loadAppliances().then(() => { const m = initForm(); if (m === "app") runApp(); else if (m === "ip") run(); });
</script>
