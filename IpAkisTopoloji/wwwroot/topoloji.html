<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IP Akış Topolojisi</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1d2330; --muted: #677084; --line: #dde1e8;
    --in: #2f6fd6; --in-soft: #e5eefc; --out: #d9822b; --out-soft: #fcefe2;
    --ok: #2e8b57; --err: #c8353a; --warn: #b7791f; --unknown: #9aa1ad;
    --node: #ffffff; --target: #1d2330; --target-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --panel: #1c2028; --text: #e4e7ec; --muted: #9098a8; --line: #2d333e;
      --in: #6ea0f0; --in-soft: #1f2d45; --out: #eba35c; --out-soft: #3a2c1d;
      --ok: #5cc28a; --err: #ef6b6f; --warn: #e0b050; --unknown: #6b7280;
      --node: #232833; --target: #e4e7ec; --target-text: #14171d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0 0 10px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  main { padding: 16px 20px 40px; display: grid; gap: 16px; }
  form { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  input, select, button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; }
  input[type=text] { width: 150px; }
  button { cursor: pointer; }
  button.primary { background: var(--in); border-color: var(--in); color: #fff; font-weight: 600; padding: 6px 18px; }
  button:disabled { opacity: .6; cursor: default; }
  .checks { display: flex; gap: 10px; font-size: 13px; color: var(--text); padding-bottom: 6px; }
  .checks label { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
  .status { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12.5px; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  .pill.ok::before, .pill.err::before, .pill.skip::before { content: "●"; margin-right: 6px; }
  .pill.ok::before { color: var(--ok); } .pill.err::before { color: var(--err); } .pill.skip::before { color: var(--unknown); }
  .msgs { font-size: 12px; color: var(--warn); margin-top: 6px; white-space: pre-wrap; }
  .target-grid { display: grid; grid-template-columns: minmax(220px, 340px) 1fr; gap: 16px; }
  @media (max-width: 800px) { .target-grid { grid-template-columns: 1fr; } }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; }
  .bigip { font-size: 22px; font-weight: 700; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .kpis { display: flex; flex-wrap: wrap; gap: 10px; }
  .kpi { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 120px; }
  .kpi b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 12px; color: var(--muted); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 5px 12px; }
  .seg button.on { background: var(--text); color: var(--panel); }
  .legend { font-size: 12px; color: var(--muted); display: flex; gap: 14px; }
  .legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
  .topo-wrap { overflow: auto; max-height: 80vh; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  svg.topo { display: block; height: auto; }
  svg.topo text { font-family: "Segoe UI", system-ui, sans-serif; }
  .zone > rect.box { fill: var(--panel); stroke-width: 1.4; }
  .zone.in > rect.box { stroke: var(--in); } .zone.out > rect.box { stroke: var(--out); }
  .zone.unknown > rect.box { stroke: var(--unknown); stroke-dasharray: 5 4; }
  .zone.same > rect.box { stroke-width: 2.6; }
  .zone rect.head { stroke: none; }
  .zone.in rect.head { fill: var(--in-soft); } .zone.out rect.head { fill: var(--out-soft); }
  .zone.unknown rect.head { fill: color-mix(in srgb, var(--unknown) 18%, transparent); }
  .zone .title { fill: var(--text); font-size: 13px; font-weight: 700; }
  .zone .sub { fill: var(--muted); font-size: 11px; }
  .zone .num { fill: var(--muted); font-size: 11.5px; }
  .hdr { cursor: pointer; }
  .row { cursor: pointer; }
  .row rect { fill: transparent; }
  .row:hover rect, .row.sel rect, .row.on rect { fill: color-mix(in srgb, var(--text) 8%, transparent); }
  .row .ip { fill: var(--text); font-size: 12px; font-family: Consolas, ui-monospace, monospace; }
  .row .app { fill: var(--muted); font-size: 11.5px; }
  .row .num { fill: var(--muted); font-size: 11px; }
  .row.more .ip { fill: var(--muted); font-style: italic; font-family: inherit; }
  .badge-same { fill: var(--ok); font-size: 10.5px; font-weight: 700; }
  .port rect { fill: var(--panel); stroke: var(--in); stroke-width: 1.4; }
  .port { cursor: pointer; }
  .port.sel rect, .port.on rect { stroke-width: 2.8; }
  .port .title { fill: var(--text); font-size: 12.5px; font-weight: 700; font-family: Consolas, ui-monospace, monospace; }
  .port .sub { fill: var(--muted); font-size: 11px; }
  .edge { fill: none; opacity: .5; transition: opacity .12s; }
  .edge.in { stroke: var(--in); } .edge.out { stroke: var(--out); }
  svg.hl .edge { opacity: .07; } svg.hl .edge.on { opacity: .95; }
  .tnode rect { fill: var(--target); }
  .tnode text { fill: var(--target-text); font-size: 12.5px; }
  .colhead { fill: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .05em; }
  .zoom { display: inline-flex; gap: 4px; }
  .zoom button { padding: 4px 10px; }
  .detail { margin-top: 10px; }
  .detail:empty { display: none; }
  .detail .panel { background: var(--bg); }
  .sumgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 1100px) { .sumgrid { grid-template-columns: 1fr; } }
  tr.click { cursor: pointer; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--in-soft); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; }
  .chip button { border: 0; background: transparent; padding: 0 2px; }
  .tbl-wrap { overflow-x: auto; max-height: 560px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 600; white-space: nowrap; cursor: pointer; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.mono { font-family: Consolas, ui-monospace, monospace; white-space: nowrap; }
  tr:hover td { background: color-mix(in srgb, var(--in-soft) 45%, transparent); }
  .dir-in h2 { color: var(--in); } .dir-out h2 { color: var(--out); }
  .muted { color: var(--muted); }
  .unk { color: var(--unknown); font-style: italic; }
  .badge { display: inline-block; font-size: 11px; border-radius: 4px; padding: 0 5px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.strong { border-color: var(--ok); color: var(--ok); }
  .badge.weak { border-color: var(--warn); color: var(--warn); }
  details summary { cursor: pointer; color: var(--muted); }
  .small { font-size: 11.5px; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--in); border-radius: 50%; animation: spin 1s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .grid2 { display: grid; gap: 16px; }
</style>
</head>
<body>
<header>
  <h1>IP Akış Topolojisi</h1>
  <form id="f">
    <label>IP adresi <input type="text" id="ip" placeholder="10.50.20.15" required></label>
    <label>Başlangıç <input type="datetime-local" id="start"></label>
    <label>Bitiş <input type="datetime-local" id="end"></label>
    <label>AppResponse cihazı <select id="appliance"></select></label>
    <div class="checks">
      <label><input type="checkbox" id="srcSplunk" checked> Splunk</label>
      <label><input type="checkbox" id="srcAr" checked> AppResponse</label>
    </div>
    <button class="primary" id="go" type="submit">Sorgula</button>
    <button type="button" id="cancel" hidden>İptal</button>
  </form>
</header>

<main id="main">
  <div class="panel empty" id="placeholder">Bir IP adresi girip sorgulayın.</div>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => (n ?? 0).toLocaleString("tr-TR");
const pad = n => String(n).padStart(2, "0");
const toLocalInput = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

const TOP_IPS = 6;          // kalabalık kutularda başta gösterilen IP sayısı
const AUTO_EXPAND_IPS = 40;  // bir taraftaki toplam IP bu sayıdan azsa tüm kutular açık gelir
const state = {
  data: null, mode: "segment", filter: null, zoom: 1, expand: new Map(), selected: null,
  search: { in: "", out: "" }, sort: { in: null, out: null }
};
let abort = null;

// ---------- Envanter yardımcıları ----------
const appName = a => a.appName || a.serviceName || a.unixName || a.website || "?";
const appNames = m => m && m.apps && m.apps.length ? [...new Set(m.apps.map(appName))].sort() : [];
const segLabel = s => s ? s.label : null;
const MATCH = {
  "ip-port": ["IP+Port", "strong"], "vip": ["VIP", "strong"],
  "ip": ["Sadece IP", "weak"], "vip-ip": ["VIP IP", "weak"], "yok": ["Envanterde yok", ""]
};
const matchBadge = m => m ? `<span class="badge ${MATCH[m.kind]?.[1] ?? ""}" title="Eşleşme türü">${esc(MATCH[m.kind]?.[0] ?? m.kind)}</span>` : "";
const portText = p => p === "" ? "web (L7)" : p;

const UNK = "__unk";
// Kutu (zone) anahtarı: segment modunda CIDR, uygulama modunda uygulama adları.
function zoneKey(e, mode = state.mode) {
  if (mode === "app") { const n = appNames(e.peerApps); return n.length ? n.join(" + ") : UNK; }
  return e.peerSegment ? e.peerSegment.cidr : UNK;
}
const sameSegment = e => !!(e.peerSegment && state.data.target.segment && e.peerSegment.cidr === state.data.target.segment.cidr);

// ---------- Form ----------
async function loadAppliances() {
  try {
    const list = await (await fetch("api/appliances")).json();
    $("#appliance").innerHTML = list.map(a => `<option value="${a.index}">${esc(a.name)}</option>`).join("") || `<option value="0">-</option>`;
  } catch { $("#appliance").innerHTML = `<option value="0">-</option>`; }
}

function initForm() {
  const p = new URLSearchParams(location.search);
  const now = new Date();
  $("#end").value = p.get("end") || toLocalInput(now);
  $("#start").value = p.get("start") || toLocalInput(new Date(now - 3600e3));
  if (p.get("ip")) $("#ip").value = p.get("ip");
  if (p.get("mode") === "app") state.mode = "app";
  return !!p.get("ip");
}

$("#f").addEventListener("submit", ev => { ev.preventDefault(); run(); });
$("#cancel").addEventListener("click", () => abort?.abort());

async function run() {
  const srcs = [$("#srcSplunk").checked && "splunk", $("#srcAr").checked && "appresponse"].filter(Boolean);
  if (!srcs.length) { alert("En az bir kaynak seçin."); return; }
  const params = new URLSearchParams({
    ip: $("#ip").value.trim(), start: $("#start").value, end: $("#end").value,
    appliance: $("#appliance").value || "0", sources: srcs.join(",")
  });
  history.replaceState(null, "", "?" + new URLSearchParams({ ip: params.get("ip"), start: params.get("start"), end: params.get("end"), mode: state.mode }));

  abort?.abort();
  abort = new AbortController();
  $("#go").disabled = true; $("#cancel").hidden = false;
  $("#main").innerHTML = `<div class="panel empty"><span class="spinner"></span> Sorgulanıyor… (AppResponse raporu 1 dakikaya kadar sürebilir)</div>`;
  try {
    const r = await fetch("api/flow?" + params, { signal: abort.signal });
    const body = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
    if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
    state.data = body; state.filter = null; state.selected = null; state.expand = new Map(); state.zoom = 1;
    render();
  } catch (e) {
    const msg = e.name === "AbortError" ? "Sorgu iptal edildi." : e.message;
    $("#main").innerHTML = `<div class="panel empty" style="color:var(--err)">${esc(msg)}</div>`;
  } finally {
    $("#go").disabled = false; $("#cancel").hidden = true;
  }
}

// ---------- Render ----------
function render() {
  const d = state.data;
  $("#main").innerHTML = `
    <section class="panel">${renderStatus(d)}</section>
    <section class="panel">${renderTarget(d)}</section>
    <section class="panel">
      <div class="toolbar">
        <h2 style="margin:0">Topoloji</h2>
        <div class="seg" id="modes">
          ${[["segment", "Segmente göre"], ["app", "Uygulamaya göre"]].map(([k, t]) =>
            `<button type="button" data-mode="${k}" class="${state.mode === k ? "on" : ""}">${t}</button>`).join("")}
        </div>
        <div class="legend">
          <span><i style="background:var(--in)"></i>Gelen</span><span><i style="background:var(--out)"></i>Giden</span>
          <span>Kalın çerçeve = hedefle aynı segment</span><span>Çizgi kalınlığı = hit</span>
        </div>
        <div class="zoom">
          <button type="button" data-zoom="-" title="Uzaklaş">−</button>
          <button type="button" data-zoom="0" title="Ekrana sığdır">Sığdır</button>
          <button type="button" data-zoom="+" title="Yakınlaş">+</button>
          <button type="button" data-zoom="all" title="Tüm kutuları aç / kapat">Tümünü aç</button>
          <button type="button" id="dlSvg">SVG</button>
          <button type="button" id="dlPng">PNG</button>
        </div>
      </div>
      <div id="filterbar"></div>
      <div class="topo-wrap" id="topo"></div>
      <div class="detail" id="detail"></div>
    </section>
    <section class="panel">
      <h2>Segment özeti</h2>
      <div class="sumgrid"><div id="sum-in"></div><div id="sum-out"></div></div>
    </section>
    <div class="grid2">
      <section class="panel dir-in" id="tbl-in"></section>
      <section class="panel dir-out" id="tbl-out"></section>
    </div>`;
  $("#modes").addEventListener("click", ev => {
    const m = ev.target.dataset.mode; if (!m || m === state.mode) return;
    state.mode = m; state.filter = null; state.selected = null; state.expand = new Map();
    const u = new URLSearchParams(location.search); u.set("mode", m); history.replaceState(null, "", "?" + u);
    render();
  });
  document.querySelectorAll("[data-zoom]").forEach(bt => bt.addEventListener("click", () => {
    const z = bt.dataset.zoom;
    if (z === "all") {
      const anyClosed = [...buildZones("in"), ...buildZones("out")].some(zn => zn.mode !== "all");
      for (const dir of ["in", "out"]) for (const zn of buildZones(dir)) state.expand.set(dir + "|" + zn.key, anyClosed ? "all" : "none");
      renderTopology(); return;
    }
    state.zoom = z === "0" ? 1 : Math.min(4, Math.max(0.4, state.zoom * (z === "+" ? 1.25 : 0.8)));
    applyZoom();
  }));
  $("#dlSvg").addEventListener("click", () => exportImage("svg"));
  $("#dlPng").addEventListener("click", () => exportImage("png"));
  renderTopology();
  renderSummary();
  renderTables();
}

function renderStatus(d) {
  const pill = (name, s, extra) => {
    const cls = s.ok ? "ok" : s.error === "Sorgulanmadı" ? "skip" : "err";
    const info = s.ok ? `${fmt(s.rows)} satır${s.elapsedMs != null ? ` · ${(s.elapsedMs / 1000).toFixed(1)} sn` : ""}${extra ?? ""}` : esc(s.error);
    return `<span class="pill ${cls}" title="${esc(s.error ?? "")}"><b>${name}</b> ${info}</span>`;
  };
  const msgs = [...d.splunk.messages.map(m => "Splunk: " + m), ...d.appResponse.messages.map(m => "AppResponse: " + m)];
  return `<div class="status">
      ${pill("Splunk", d.splunk)}
      ${pill("AppResponse", d.appResponse)}
      ${pill("Envanter", d.envanter, d.envanter.ok ? ` · ${esc(d.envanter.messages[0] ?? "")}` : "")}
      <span class="pill">Toplam ${(d.elapsedMs / 1000).toFixed(1)} sn</span>
    </div>${msgs.length ? `<div class="msgs">${esc(msgs.join("\n"))}</div>` : ""}`;
}

function renderTarget(d) {
  const t = d.target, s = t.segment;
  const segDl = s ? `<dl>
      <dt>Segment</dt><dd><b>${esc(s.label)}</b></dd>
      <dt>CIDR</dt><dd class="mono">${esc(s.cidr)}</dd>
      ${[["VLAN", s.vlan], ["Tenant", s.tenant], ["App Profile", s.applicationProfile], ["EPG", s.epgName], ["BD", s.bd], ["GW", s.gw], ["Domain", s.domain], ["Açıklama", s.description]]
        .filter(x => x[1]).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}
    </dl>` : `<div class="unk">Segment envanterinde bulunamadı.</div>`;

  const inPeers = new Set(d.inbound.map(e => e.peerIp)).size;
  const outPeers = new Set(d.outbound.map(e => e.peerIp)).size;
  const inSegs = new Set(d.inbound.map(e => segLabel(e.peerSegment) ?? "?")).size;
  const outSegs = new Set(d.outbound.map(e => segLabel(e.peerSegment) ?? "?")).size;
  const unknown = new Set([...d.inbound, ...d.outbound].filter(e => !e.peerSegment || !appNames(e.peerApps).length).map(e => e.peerIp)).size;

  const apps = t.apps.length ? `<div class="tbl-wrap" style="max-height:220px"><table>
      <thead><tr><th>Port</th><th>Uygulama</th><th>Servis</th><th>Unix/Host</th><th>Varlık muhafızı</th><th>İşleten birim</th><th>Varlık sahibi</th></tr></thead>
      <tbody>${[...t.apps].sort((a, b) => (+a.port || 0) - (+b.port || 0)).map(a => `<tr>
        <td class="mono">${esc(a.port ?? "")}${a.vipIp ? `<div class="small muted">VIP ${esc(a.vipIp)}:${esc(a.vipPort ?? "")}</div>` : ""}</td>
        <td><b>${esc(a.appName ?? "")}</b>${a.website ? `<div class="small muted">${esc(a.website)}</div>` : ""}</td>
        <td>${esc(a.serviceName ?? "")}</td><td>${esc(a.unixName ?? "")}</td>
        <td>${esc(a.varlikMuhafizi ?? "")}</td><td>${esc(a.sunucuIsletenBirim ?? "")}</td><td>${esc(a.uygulamaVarlikSahibi ?? "")}</td>
      </tr>`).join("")}</tbody></table></div>`
    : `<div class="unk">Bu IP için uygulama envanterinde kayıt yok.</div>`;

  return `<div class="target-grid">
      <div><div class="bigip">${esc(t.ip)}</div>${segDl}</div>
      <div>
        <div class="kpis" style="margin-bottom:12px">
          <div class="kpi"><b style="color:var(--in)">${fmt(inPeers)}</b><span>gelen IP · ${fmt(inSegs)} segment</span></div>
          <div class="kpi"><b style="color:var(--out)">${fmt(outPeers)}</b><span>gidilen IP · ${fmt(outSegs)} segment</span></div>
          <div class="kpi"><b style="color:var(--warn)">${fmt(unknown)}</b><span title="Segment veya uygulama envanterinde kaydı olmayan karşı IP sayısı">segment/uygulama kaydı eksik IP</span></div>
        </div>
        <h2>Bu makinedeki uygulamalar</h2>${apps}
      </div>
    </div>`;
}

// ---------- Topoloji modeli ----------
// Her yön için kutular (segment/uygulama), kutuların içinde karşı IP'ler.
function buildZones(dir) {
  const edges = dir === "in" ? state.data.inbound : state.data.outbound;
  const zones = new Map();
  for (const e of edges) {
    const k = zoneKey(e);
    let z = zones.get(k);
    if (!z) zones.set(k, z = {
      key: k, dir, unknown: k === UNK, seg: state.mode === "segment" ? e.peerSegment : null,
      same: state.mode === "segment" && sameSegment(e), hits: 0, ips: new Map()
    });
    z.hits += e.hits;
    let ip = z.ips.get(e.peerIp);
    if (!ip) z.ips.set(e.peerIp, ip = { ip: e.peerIp, hits: 0, ports: new Map(), edges: [], seg: e.peerSegment, apps: appNames(e.peerApps) });
    ip.hits += e.hits; ip.edges.push(e);
    ip.ports.set(e.port, (ip.ports.get(e.port) ?? 0) + e.hits);
  }
  const list = [...zones.values()]
    .map(z => ({ ...z, ips: [...z.ips.values()].sort((a, b) => b.hits - a.hits) }))
    .sort((a, b) => (a.unknown - b.unknown) || (b.hits - a.hits));
  const totalIps = list.reduce((n, z) => n + z.ips.length, 0);
  list.forEach((z, i) => {
    const def = totalIps <= AUTO_EXPAND_IPS ? "all" : i < 8 ? "top" : "none";
    z.mode = state.expand.get(dir + "|" + z.key) ?? def;
    if (z.mode === "top" && z.ips.length <= TOP_IPS + 1) z.mode = "all";
  });
  return list;
}

function zoneTitle(z) {
  if (z.unknown) return state.mode === "segment" ? "Segment envanterinde yok" : "Uygulama envanterinde yok";
  return state.mode === "segment" ? z.seg.label : z.key;
}
function zoneSub(z) {
  if (state.mode !== "segment" || !z.seg) {
    const segs = new Set(z.ips.map(i => segLabel(i.seg) ?? "?"));
    return z.unknown ? "" : `${segs.size} segment: ${[...segs].slice(0, 3).join(", ")}${segs.size > 3 ? "…" : ""}`;
  }
  const s = z.seg;
  return [s.label !== s.cidr && s.cidr, s.vlan && "VLAN " + s.vlan, s.tenant, s.applicationProfile && s.applicationProfile !== s.label && s.applicationProfile]
    .filter(Boolean).join(" · ");
}

const trunc = (s, n) => (s = String(s ?? "")).length > n ? s.slice(0, n - 1) + "…" : s;
const portSort = (a, b) => (a === "" ? 1e9 : +a || 0) - (b === "" ? 1e9 : +b || 0);

// Hedefin gelen trafikte dinlediği portlar (ortadaki sütun).
function buildPorts() {
  const m = new Map();
  for (const e of state.data.inbound) {
    let p = m.get(e.port);
    if (!p) m.set(e.port, p = { port: e.port, hits: 0, peers: new Set(), apps: appNames(e.localApp), match: e.localApp });
    p.hits += e.hits; p.peers.add(e.peerIp);
  }
  return [...m.values()].sort((a, b) => portSort(a.port, b.port));
}

// ---------- Topoloji çizimi ----------
function renderTopology() {
  const d = state.data;
  if (!d.inbound.length && !d.outbound.length) {
    $("#topo").innerHTML = `<div class="empty">Bu aralıkta akış bulunamadı.</div>`;
    renderFilterbar(); return;
  }
  const IN = buildZones("in"), OUT = buildZones("out"), PORTS = buildPorts();

  // Geometri
  const TOP = 40, HH = 46, RH = 24, ZG = 14, PH = 44, PG = 10;
  const LX = 12, LW = 370, PX = 470, PW = 210, TX = 760, TW = 220, RX = 1060, RW = 390, W = RX + RW + 12;

  const rowsOf = z => {
    if (z.mode === "none") return [];
    const shown = z.mode === "all" ? z.ips : z.ips.slice(0, TOP_IPS);
    const rows = shown.map(ip => ({ ...ip, kind: "ip" }));
    const hidden = z.ips.slice(shown.length);
    if (hidden.length) {
      const ports = new Map();
      hidden.forEach(h => h.ports.forEach((v, k) => ports.set(k, (ports.get(k) ?? 0) + v)));
      rows.push({ kind: "more", ip: `+ ${hidden.length} IP daha`, hits: hidden.reduce((n, h) => n + h.hits, 0), ports, ips: hidden });
    }
    return rows;
  };
  const zoneH = z => HH + (z.rows.length ? z.rows.length * RH + 6 : 0);
  [...IN, ...OUT].forEach(z => { z.rows = rowsOf(z); z.h = zoneH(z); });

  const colH = list => list.reduce((n, z) => n + z.h + ZG, 0) - (list.length ? ZG : 0);
  const portsH = PORTS.length * (PH + PG) - (PORTS.length ? PG : 0);
  const TH = 120;
  const inner = Math.max(colH(IN), colH(OUT), portsH, TH);
  const H = TOP + inner + 16;
  const center = TOP + inner / 2;

  const place = (list, x) => { let y = TOP + (inner - colH(list)) / 2; list.forEach(z => { z.x = x; z.y = y; y += z.h + ZG; }); };
  place(IN, LX); place(OUT, RX);
  let py = TOP + (inner - portsH) / 2;
  PORTS.forEach(p => { p.y = py; py += PH + PG; });
  const ty = center - TH / 2;

  // Kalınlık ölçeği
  const allHits = [...IN, ...OUT].flatMap(z => z.rows.map(r => r.hits)).concat(PORTS.map(p => p.hits), [1]);
  const maxHit = Math.max(...allHits);
  const sw = h => (1 + 8 * Math.log(1 + h) / Math.log(1 + maxHit)).toFixed(1);
  const curve = (x1, y1, x2, y2) => { const mx = (x1 + x2) / 2; return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`; };

  const portIdx = new Map(PORTS.map((p, i) => [p.port, i]));
  const portY = port => PORTS[portIdx.get(port)].y + PH / 2;
  const portRel = new Map(PORTS.map((p, i) => [p.port, new Set(["p" + i])]));

  let edges = "", zones = "", ports = "";
  const sel = state.selected;

  // Kutular ve satırlar
  for (const [list, dir] of [[IN, "in"], [OUT, "out"]]) {
    list.forEach((z, zi) => {
      const zid = `${dir}${zi}`;
      const hdrId = "h" + zid;
      const cls = `zone ${dir}${z.unknown ? " unknown" : ""}${z.same ? " same" : ""}`;
      const arrow = z.mode === "none" ? "▸" : "▾";
      const ipCount = `${fmt(z.ips.length)} IP · ${fmt(z.hits)} hit`;
      let g = `<g class="${cls}" transform="translate(${z.x},${z.y})">
        <rect class="box" width="${dir === "in" ? LW : RW}" height="${z.h}" rx="8"></rect>
        <g class="hdr" data-id="${hdrId}" data-zone="${dir}|${esc(z.key)}">
          <title>${esc(zoneTitle(z))}\n${esc(zoneSub(z))}\n${ipCount}\nTıkla: aç / kapat</title>
          <rect class="head" x="1" y="1" width="${(dir === "in" ? LW : RW) - 2}" height="${HH - 2}" rx="7"></rect>
          <text class="title" x="12" y="19">${arrow} ${esc(trunc(zoneTitle(z), dir === "in" ? 34 : 36))}</text>
          <text class="sub" x="12" y="36">${esc(trunc(zoneSub(z), dir === "in" ? 44 : 48))}</text>
          <text class="num" x="${(dir === "in" ? LW : RW) - 10}" y="19" text-anchor="end">${ipCount}</text>
          ${z.same ? `<text class="badge-same" x="${(dir === "in" ? LW : RW) - 10}" y="36" text-anchor="end">AYNI SEGMENT</text>` : ""}
        </g>`;
      const w = dir === "in" ? LW : RW;

      // Kapalı kutu: bağlantılar başlıktan çıkar
      const sources = z.rows.length ? z.rows.map((r, ri) => ({ r, id: `${r.kind === "more" ? "m" : "r"}${zid}_${ri}`, y: z.y + HH + ri * RH + RH / 2 + 2 }))
        : [{ r: { ports: z.ips.reduce((m, ip) => { ip.ports.forEach((v, k) => m.set(k, (m.get(k) ?? 0) + v)); return m; }, new Map()), hits: z.hits }, id: hdrId, y: z.y + HH / 2 }];

      z.rows.forEach((r, ri) => {
        const id = `${r.kind === "more" ? "m" : "r"}${zid}_${ri}`;
        const ry = HH + ri * RH + 2;
        const portsTxt = [...r.ports.keys()].sort(portSort).map(p => p === "" ? "web" : ":" + p);
        const info = r.kind === "more" ? "tıkla: hepsini göster"
          : dir === "in" ? (r.apps.join(", ") || "—")
          : `${portsTxt.slice(0, 3).join(" ")}${portsTxt.length > 3 ? "…" : ""}  ${r.apps.join(", ") || "—"}`;
        const isSel = sel && sel.dir === dir && sel.ip === r.ip;
        g += `<g class="row${r.kind === "more" ? " more" : ""}${isSel ? " sel" : ""}" data-id="${id}" data-dir="${dir}" data-ip="${esc(r.ip)}" data-zone="${dir}|${esc(z.key)}" transform="translate(0,${ry})">
          <title>${esc(r.ip)}\n${esc(r.kind === "more" ? r.ips.map(i => i.ip).slice(0, 30).join(", ") : [segLabel(r.seg), r.apps.join(", ")].filter(Boolean).join("\n"))}\nPort: ${esc(portsTxt.join(" "))}\n${fmt(r.hits)} hit</title>
          <rect x="4" width="${w - 8}" height="${RH}" rx="4"></rect>
          <text class="ip" x="12" y="16">${esc(r.ip)}</text>
          <text class="app" x="${r.kind === "more" ? 130 : 120}" y="16">${esc(trunc(info, dir === "in" ? 30 : 34))}</text>
          <text class="num" x="${w - 10}" y="16" text-anchor="end">${fmt(r.hits)}</text>
        </g>`;
      });
      zones += g + "</g>";

      // Bağlantılar
      for (const s of sources) {
        if (dir === "in") {
          for (const [port, h] of s.r.ports) {
            if (!portIdx.has(port)) continue;
            edges += `<path class="edge in" data-rel="${s.id} p${portIdx.get(port)}" stroke-width="${sw(h)}" d="${curve(LX + LW, s.y, PX, portY(port))}"><title>${esc(s.r.ip ?? zoneTitle(z))} → ${esc(portText(port))}: ${fmt(h)} hit</title></path>`;
            portRel.get(port).add(s.id);
          }
        } else {
          edges += `<path class="edge out" data-rel="${s.id}" stroke-width="${sw(s.r.hits)}" d="${curve(TX + TW, center, RX, s.y)}"><title>${esc(d.target.ip)} → ${esc(s.r.ip ?? zoneTitle(z))}: ${fmt(s.r.hits)} hit</title></path>`;
        }
      }
    });
  }

  // Ortadaki port düğümleri + hedefe bağlantılar
  PORTS.forEach((p, i) => {
    const my = p.y + PH / 2;
    const tyIn = ty + 20 + (TH - 40) * (PORTS.length > 1 ? i / (PORTS.length - 1) : 0.5);
    edges += `<path class="edge in" data-rel="${[...portRel.get(p.port)].join(" ")}" stroke-width="${sw(p.hits)}" d="${curve(PX + PW, my, TX, tyIn)}"><title>:${esc(portText(p.port))} → ${esc(d.target.ip)}: ${fmt(p.hits)} hit</title></path>`;
    const isSel = state.filter && state.filter.port === p.port;
    ports += `<g class="port${isSel ? " sel" : ""}" data-id="p${i}" data-port="${esc(p.port)}" transform="translate(${PX},${p.y})">
      <title>Port ${esc(portText(p.port))}\n${esc(p.apps.join(", ") || "Uygulama envanterinde yok")}\n${fmt(p.peers.size)} kaynak IP · ${fmt(p.hits)} hit</title>
      <rect width="${PW}" height="${PH}" rx="8"></rect>
      <text class="title" x="10" y="18">${p.port === "" ? "web (L7)" : ":" + esc(p.port)}</text>
      <text class="sub" x="${PW - 10}" y="18" text-anchor="end">${fmt(p.peers.size)} IP</text>
      <text class="sub" x="10" y="35">${esc(trunc(p.apps.join(", ") || "uygulama ?", 30))}</text>
    </g>`;
  });

  const t = d.target;
  const tApps = [...new Set(t.apps.map(appName))];
  const inIps = new Set(d.inbound.map(e => e.peerIp)).size, outIps = new Set(d.outbound.map(e => e.peerIp)).size;
  const svg = `<svg class="topo" id="topoSvg" viewBox="0 0 ${W} ${H}" data-w="${W}" xmlns="http://www.w3.org/2000/svg">
    <text class="colhead" x="${LX}" y="22">GELEN · ${fmt(IN.length)} ${state.mode === "segment" ? "SEGMENT" : "UYGULAMA"} · ${fmt(inIps)} IP</text>
    ${PORTS.length ? `<text class="colhead" x="${PX}" y="22">BİZDEKİ PORT / UYGULAMA</text>` : ""}
    <text class="colhead" x="${RX + RW}" y="22" text-anchor="end">GİDEN · ${fmt(OUT.length)} ${state.mode === "segment" ? "SEGMENT" : "UYGULAMA"} · ${fmt(outIps)} IP</text>
    ${edges}
    ${zones}
    ${ports}
    <g class="tnode" transform="translate(${TX},${ty})">
      <title>${esc(t.ip)}\n${esc(t.segment ? `${t.segment.label} (${t.segment.cidr})` : "segment ?")}\n${esc(tApps.join(", "))}</title>
      <rect width="${TW}" height="${TH}" rx="12"></rect>
      <text x="${TW / 2}" y="30" text-anchor="middle" style="font-size:17px;font-weight:700">${esc(t.ip)}</text>
      <text x="${TW / 2}" y="52" text-anchor="middle" style="font-weight:600">${esc(trunc(t.segment ? t.segment.label : "segment ?", 28))}</text>
      <text x="${TW / 2}" y="70" text-anchor="middle" style="font-size:11px">${esc(t.segment ? [t.segment.cidr, t.segment.vlan && "VLAN " + t.segment.vlan].filter(Boolean).join(" · ") : "")}</text>
      <text x="${TW / 2}" y="94" text-anchor="middle" style="font-size:11.5px">${esc(trunc(tApps.join(", ") || "uygulama kaydı yok", 32))}</text>
    </g>
  </svg>`;
  $("#topo").innerHTML = svg;
  applyZoom();
  wireTopology();
  renderFilterbar();
}

function applyZoom() {
  const svg = $("#topoSvg"); if (!svg) return;
  const base = Math.max($("#topo").clientWidth - 2, 1100);
  svg.style.width = Math.round(base * state.zoom) + "px";
}

function wireTopology() {
  const svg = $("#topoSvg");
  const edgesOf = id => Array.from(svg.querySelectorAll(".edge")).filter(p => p.dataset.rel.split(" ").includes(id));
  svg.querySelectorAll("[data-id]").forEach(n => {
    n.addEventListener("mouseenter", () => {
      svg.classList.add("hl");
      for (const p of edgesOf(n.dataset.id)) p.classList.add("on");
      n.classList.add("on");
    });
    n.addEventListener("mouseleave", () => {
      svg.classList.remove("hl");
      svg.querySelectorAll(".on").forEach(x => x.classList.remove("on"));
    });
  });
  svg.querySelectorAll(".hdr").forEach(h => h.addEventListener("click", () => {
    const k = h.dataset.zone, [dir] = k.split("|");
    const z = buildZones(dir).find(z => dir + "|" + z.key === k);
    state.expand.set(k, z.mode === "none" ? (z.ips.length > TOP_IPS + 1 ? "top" : "all") : "none");
    renderTopology();
  }));
  svg.querySelectorAll(".row").forEach(r => r.addEventListener("click", () => {
    if (r.classList.contains("more")) { state.expand.set(r.dataset.zone, "all"); renderTopology(); return; }
    const dir = r.dataset.dir, ip = r.dataset.ip;
    const same = state.selected && state.selected.dir === dir && state.selected.ip === ip;
    state.selected = same ? null : { dir, ip };
    state.filter = same ? null : { dir, label: ip, test: e => e.peerIp === ip };
    renderTopology(); renderDetail(); renderTables();
  }));
  svg.querySelectorAll(".port").forEach(p => p.addEventListener("click", () => {
    const port = p.dataset.port;
    const same = state.filter && state.filter.port === port;
    state.selected = null;
    state.filter = same ? null : { dir: "in", port, label: "port " + portText(port), test: e => e.port === port };
    renderTopology(); renderDetail(); renderTables();
  }));
}

function renderFilterbar() {
  $("#filterbar").innerHTML = state.filter
    ? `<div style="margin-bottom:8px"><span class="chip">${state.filter.dir === "in" ? "Gelen" : "Giden"}: ${esc(state.filter.label)} <button type="button" id="clr" title="Filtreyi kaldır">✕</button></span></div>` : "";
  $("#clr")?.addEventListener("click", clearFilter);
}
function clearFilter() { state.filter = null; state.selected = null; renderTopology(); renderDetail(); renderTables(); }

// Seçili IP'nin detay kartı + "bu IP'yi sorgula" (topolojide bir adım ileri git)
function renderDetail() {
  const el = $("#detail"); const s = state.selected;
  if (!s) { el.innerHTML = ""; return; }
  const edges = (s.dir === "in" ? state.data.inbound : state.data.outbound).filter(e => e.peerIp === s.ip);
  const seg = edges[0]?.peerSegment;
  const apps = edges.flatMap(e => e.peerApps?.apps ?? []);
  el.innerHTML = `<div class="panel">
    <div class="toolbar">
      <h2 style="margin:0">${esc(s.ip)} <span class="muted" style="font-weight:400">${s.dir === "in" ? "→ bu makineye geliyor" : "← bu makine buraya gidiyor"}</span></h2>
      <div style="display:flex;gap:8px">
        <button type="button" id="drill" class="primary">Bu IP'nin topolojisini aç</button>
        <button type="button" id="closeDetail">Kapat</button>
      </div>
    </div>
    <div class="target-grid">
      <div>${seg ? `<dl><dt>Segment</dt><dd><b>${esc(seg.label)}</b></dd><dt>CIDR</dt><dd>${esc(seg.cidr)}</dd>
        ${[["VLAN", seg.vlan], ["Tenant", seg.tenant], ["App Profile", seg.applicationProfile], ["EPG", seg.epgName], ["BD", seg.bd], ["Domain", seg.domain]]
          .filter(x => x[1]).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : `<div class="unk">Segment envanterinde yok.</div>`}
        ${apps.length ? `<div style="margin-top:8px"><b>Uygulama:</b> ${esc([...new Set(apps.map(appName))].join(", "))}
          <div class="small muted">${esc([...new Set(apps.map(a => a.varlikMuhafizi).filter(Boolean))].join(", "))}</div></div>` : ""}
      </div>
      <div class="tbl-wrap" style="max-height:260px"><table>
        <thead><tr><th>Port</th><th>${s.dir === "in" ? "Bizdeki uygulama" : "Hedef uygulama"}</th><th class="num">Hit</th><th>Son görülme</th><th>Detay</th></tr></thead>
        <tbody>${edges.map(e => `<tr><td class="mono">${esc(portText(e.port))}</td>
          <td>${appsCell(s.dir === "in" ? e.localApp : e.peerApps, true)}</td><td class="num">${fmt(e.hits)}</td>
          <td class="mono">${esc(e.lastSeen ?? "")}</td><td>${detailCell(e)}</td></tr>`).join("")}</tbody>
      </table></div>
    </div></div>`;
  $("#closeDetail").addEventListener("click", clearFilter);
  $("#drill").addEventListener("click", () => { $("#ip").value = s.ip; window.scrollTo({ top: 0, behavior: "smooth" }); run(); });
}

// ---------- Segment özeti ----------
function renderSummary() {
  for (const dir of ["in", "out"]) {
    const edges = dir === "in" ? state.data.inbound : state.data.outbound;
    const m = new Map();
    for (const e of edges) {
      const k = zoneKey(e, "segment");
      let r = m.get(k);
      if (!r) m.set(k, r = { key: k, seg: e.peerSegment, same: sameSegment(e), ips: new Set(), ports: new Set(), apps: new Set(), hits: 0 });
      r.ips.add(e.peerIp); r.ports.add(e.port); r.hits += e.hits;
      appNames(dir === "in" ? e.localApp : e.peerApps).forEach(a => r.apps.add(a));
    }
    const rows = [...m.values()].sort((a, b) => b.hits - a.hits);
    $("#sum-" + dir).innerHTML = `
      <h2 style="color:var(--${dir})">${dir === "in" ? `Gelen: ${fmt(rows.length)} segmentten geliniyor` : `Giden: ${fmt(rows.length)} segmente gidiliyor`}</h2>
      ${rows.length ? `<div class="tbl-wrap" style="max-height:340px"><table>
        <thead><tr><th>Segment</th><th>VLAN</th><th class="num">IP</th><th>Port</th><th>${dir === "in" ? "Bizdeki uygulama" : "Hedef uygulama"}</th><th class="num">Hit</th></tr></thead>
        <tbody>${rows.map(r => `<tr class="click" data-dir="${dir}" data-key="${esc(r.key)}">
          <td>${r.seg ? `<b>${esc(r.seg.label)}</b>${r.same ? ' <span class="badge strong">aynı segment</span>' : ""}<div class="small muted mono">${esc(r.seg.cidr)}${r.seg.tenant ? " · " + esc(r.seg.tenant) : ""}</div>` : `<span class="unk">Segment envanterinde yok</span>`}</td>
          <td class="mono">${esc(r.seg?.vlan ?? "")}</td>
          <td class="num">${fmt(r.ips.size)}</td>
          <td class="mono">${esc([...r.ports].sort(portSort).map(portText).slice(0, 8).join(", "))}${r.ports.size > 8 ? "…" : ""}</td>
          <td>${esc([...r.apps].slice(0, 4).join(", "))}${r.apps.size > 4 ? "…" : ""}</td>
          <td class="num">${fmt(r.hits)}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">Kayıt yok.</div>`}`;
    $("#sum-" + dir).querySelectorAll("tr.click").forEach(tr => tr.addEventListener("click", () => {
      const k = tr.dataset.key, row = rows.find(r => r.key === k);
      state.selected = null;
      state.filter = { dir, label: row.seg ? row.seg.label : "segment bilinmiyor", test: e => zoneKey(e, "segment") === k };
      renderTopology(); renderDetail(); renderTables();
      document.getElementById("tbl-" + dir).scrollIntoView({ behavior: "smooth" });
    }));
  }
}

// ---------- Görüntü indirme ----------
function exportImage(kind) {
  const src = $("#topoSvg"); if (!src) return;
  const clone = src.cloneNode(true);
  const props = ["fill", "stroke", "stroke-width", "stroke-dasharray", "opacity", "font-size", "font-weight", "font-family", "font-style"];
  const a = [src, ...src.querySelectorAll("*")], b = [clone, ...clone.querySelectorAll("*")];
  a.forEach((el, i) => { const cs = getComputedStyle(el); b[i].setAttribute("style", props.map(p => `${p}:${cs.getPropertyValue(p)}`).join(";")); });
  const [, , w, h] = src.getAttribute("viewBox").split(" ").map(Number);
  clone.setAttribute("width", w); clone.setAttribute("height", h);
  clone.querySelector("*") && clone.insertAdjacentHTML("afterbegin", `<rect width="${w}" height="${h}" fill="${getComputedStyle(document.body).backgroundColor}"></rect>`);
  const xml = new XMLSerializer().serializeToString(clone);
  const name = `${state.data.target.ip}_topoloji`;
  const save = (blob, ext) => { const l = document.createElement("a"); l.href = URL.createObjectURL(blob); l.download = `${name}.${ext}`; l.click(); setTimeout(() => URL.revokeObjectURL(l.href), 1000); };
  if (kind === "svg") { save(new Blob([xml], { type: "image/svg+xml" }), "svg"); return; }
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas"); c.width = w * 2; c.height = h * 2;
    const ctx = c.getContext("2d"); ctx.scale(2, 2); ctx.drawImage(img, 0, 0);
    c.toBlob(bl => save(bl, "png"));
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
}

// ---------- Tablolar ----------
const COLS = {
  in: [
    { h: "Kaynak IP", v: e => e.peerIp, c: "mono" },
    { h: "Kaynak segment", v: e => segLabel(e.peerSegment) ?? "", html: e => segCell(e.peerSegment) },
    { h: "Kaynak uygulama", v: e => appNames(e.peerApps).join(", "), html: e => appsCell(e.peerApps, false) },
    { h: "Port", v: e => portText(e.port), c: "mono" },
    { h: "Bizdeki uygulama", v: e => appNames(e.localApp).join(", "), html: e => appsCell(e.localApp, true) },
    ...commonCols()
  ],
  out: [
    { h: "Hedef IP", v: e => e.peerIp, c: "mono" },
    { h: "Hedef segment", v: e => segLabel(e.peerSegment) ?? "", html: e => segCell(e.peerSegment) },
    { h: "Port", v: e => portText(e.port), c: "mono" },
    { h: "Hedef uygulama", v: e => appNames(e.peerApps).join(", "), html: e => appsCell(e.peerApps, true) },
    ...commonCols()
  ]
};

function commonCols() {
  return [
    { h: "Hit", v: e => e.hits, c: "num", html: e => fmt(e.hits) },
    { h: "Splunk", v: e => e.splunkHits, c: "num", html: e => e.splunkHits ? fmt(e.splunkHits) : "" },
    { h: "AppResp.", v: e => e.appResponseHits, c: "num", html: e => e.appResponseHits ? fmt(e.appResponseHits) : "" },
    { h: "Son görülme", v: e => e.lastSeen ?? "", c: "mono" },
    { h: "Detay", v: e => [...e.computers, ...e.processes, ...e.urls].join(" "), html: detailCell }
  ];
}

function segCell(s) {
  return s ? `${esc(s.label)}<div class="small muted mono">${esc(s.cidr)}${s.vlan ? " · VLAN " + esc(s.vlan) : ""}</div>` : `<span class="unk">bilinmiyor</span>`;
}
function appsCell(m, showBadge) {
  const n = appNames(m);
  if (!n.length) return `<span class="unk">bilinmiyor</span>`;
  const owner = [...new Set(m.apps.map(a => a.varlikMuhafizi).filter(Boolean))][0];
  return `${n.map(x => `<div>${esc(x)}</div>`).join("")}${owner ? `<div class="small muted">${esc(owner)}</div>` : ""}${showBadge ? matchBadge(m) : ""}`;
}
function detailCell(e) {
  const parts = [];
  if (e.protocols.length) parts.push(`<span class="badge">${esc(e.protocols.join("/"))}</span>`);
  if (e.computers.length) parts.push(`<div class="small">💻 ${esc(e.computers.slice(0, 3).join(", "))}${e.computers.length > 3 ? "…" : ""}</div>`);
  if (e.processes.length) parts.push(`<div class="small">⚙ ${esc(e.processes.slice(0, 3).join(", "))}${e.processes.length > 3 ? "…" : ""}</div>`);
  if (e.urls.length) parts.push(`<details class="small"><summary>${e.urls.length} URL</summary>${e.urls.map(u => `<div class="mono">${esc(u)}</div>`).join("")}</details>`);
  return parts.join("");
}

function visibleEdges(dir) {
  let list = dir === "in" ? state.data.inbound : state.data.outbound;
  const f = state.filter;
  if (f && f.dir === dir) list = list.filter(f.test);
  const q = state.search[dir].toLowerCase();
  if (q) list = list.filter(e => COLS[dir].some(c => String(c.v(e)).toLowerCase().includes(q)));
  const s = state.sort[dir];
  if (s) {
    const col = COLS[dir][s.i];
    list = [...list].sort((a, b) => {
      const x = col.v(a), y = col.v(b);
      const r = typeof x === "number" ? x - y : String(x).localeCompare(String(y), "tr", { numeric: true });
      return s.desc ? -r : r;
    });
  }
  return list;
}

function renderTables() {
  for (const dir of ["in", "out"]) {
    const el = $("#tbl-" + dir);
    const rows = visibleEdges(dir);
    const total = (dir === "in" ? state.data.inbound : state.data.outbound).length;
    const cols = COLS[dir];
    const s = state.sort[dir];
    el.innerHTML = `
      <div class="toolbar">
        <h2 style="margin:0">${dir === "in" ? "Gelen trafik — bu makineye kim geliyor" : "Giden trafik — bu makine nereye gidiyor"}
          <span class="muted" style="font-weight:400">(${fmt(rows.length)}${rows.length !== total ? " / " + fmt(total) : ""})</span></h2>
        <div style="display:flex;gap:8px">
          <input type="search" placeholder="Tabloda ara…" value="${esc(state.search[dir])}" data-search="${dir}">
          <button type="button" data-csv="${dir}">CSV</button>
        </div>
      </div>
      ${rows.length ? `<div class="tbl-wrap"><table>
        <thead><tr>${cols.map((c, i) => `<th class="${c.c === "num" ? "num" : ""}" data-sort="${i}">${c.h}${s && s.i === i ? (s.desc ? " ▼" : " ▲") : ""}</th>`).join("")}</tr></thead>
        <tbody>${rows.map(e => `<tr>${cols.map(c => `<td class="${c.c ?? ""}">${c.html ? c.html(e) : esc(c.v(e))}</td>`).join("")}</tr>`).join("")}</tbody>
      </table></div>` : `<div class="empty">Kayıt yok.</div>`}`;

    const inp = el.querySelector("[data-search]");
    inp.addEventListener("input", () => {
      state.search[dir] = inp.value;
      const pos = inp.selectionStart;
      renderTables();
      const again = $(`#tbl-${dir} [data-search]`); again.focus(); again.setSelectionRange(pos, pos);
    });
    el.querySelector("[data-csv]").addEventListener("click", () => exportCsv(dir));
    el.querySelectorAll("th[data-sort]").forEach(th => th.addEventListener("click", () => {
      const i = +th.dataset.sort, cur = state.sort[dir];
      state.sort[dir] = cur && cur.i === i ? (cur.desc ? null : { i, desc: true }) : { i, desc: cols[i].c === "num" };
      renderTables();
    }));
  }
}

function exportCsv(dir) {
  const cols = COLS[dir];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [cols.map(c => q(c.h)).join(";"), ...visibleEdges(dir).map(e => cols.map(c => q(c.v(e))).join(";"))];
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${state.data.target.ip}_${dir === "in" ? "gelen" : "giden"}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

window.addEventListener("resize", applyZoom);
loadAppliances().then(() => { if (initForm()) run(); });
</script>
</body>
</html>
