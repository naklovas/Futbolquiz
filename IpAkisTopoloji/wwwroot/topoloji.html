<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeltaFlow · Akış Topolojisi</title>
<link rel="icon" type="image/svg+xml" href="deltaflow.svg">
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1d2330; --muted: #677084; --line: #dde1e8;
    --in: #2f6fd6; --in-soft: #e5eefc; --out: #d9822b; --out-soft: #fcefe2;
    --ok: #2e8b57; --err: #c8353a; --warn: #b7791f; --unknown: #9aa1ad;
    --node: #ffffff; --target: #1d2330; --target-text: #ffffff; --vip: #7c3aed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --panel: #1c2028; --text: #e4e7ec; --muted: #9098a8; --line: #2d333e;
      --in: #6ea0f0; --in-soft: #1f2d45; --out: #eba35c; --out-soft: #3a2c1d;
      --ok: #5cc28a; --err: #ef6b6f; --warn: #e0b050; --unknown: #6b7280;
      --node: #232833; --target: #e4e7ec; --target-text: #14171d; --vip: #a78bfa;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { padding: 14px 20px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: relative; }
  header::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, #1e3a8a, #2563eb 45%, #0d9488 75%, #f97316); }
  .brand { display: flex; align-items: center; gap: 12px; margin: 2px 0 14px; }
  .brand img { width: 42px; height: 42px; display: block; filter: drop-shadow(0 2px 6px rgba(37, 99, 235, .25)); }
  .brand-name { font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; margin: 0; }
  .brand-name .d { color: var(--text); }
  .brand-name .f { background: linear-gradient(90deg, #2563eb, #0d9488 60%, #f97316); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand-tag { font-size: 12.5px; color: var(--muted); margin-top: 2px; letter-spacing: .01em; }
  h1 { font-size: 18px; margin: 0 0 10px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  main { padding: 16px 20px 40px; display: grid; gap: 16px; }
  form { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  input, select, button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; }
  input[type=text] { width: 150px; }
  button { cursor: pointer; }
  button.primary { background: var(--in); border-color: var(--in); color: #fff; font-weight: 600; padding: 6px 18px; }
  button:disabled { opacity: .6; cursor: default; }
  .checks { display: flex; gap: 10px; font-size: 13px; color: var(--text); padding-bottom: 6px; }
  .checks label { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
  .status { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12.5px; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  .pill.ok::before, .pill.err::before, .pill.skip::before { content: "●"; margin-right: 6px; }
  .pill.ok::before { color: var(--ok); } .pill.err::before { color: var(--err); } .pill.skip::before { color: var(--unknown); }
  .msgs { font-size: 12px; color: var(--warn); margin-top: 6px; white-space: pre-wrap; }
  .target-grid { display: grid; grid-template-columns: minmax(220px, 340px) 1fr; gap: 16px; }
  @media (max-width: 800px) { .target-grid { grid-template-columns: 1fr; } }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; }
  .bigip { font-size: 22px; font-weight: 700; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .kpis { display: flex; flex-wrap: wrap; gap: 10px; }
  .kpi { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 120px; }
  .kpi b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 12px; color: var(--muted); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 5px 12px; }
  .seg button.on { background: var(--text); color: var(--panel); }
  .legend { font-size: 12px; color: var(--muted); display: flex; gap: 14px; }
  .legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
  .topo-wrap { overflow: auto; max-height: 80vh; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  svg.topo { display: block; height: auto; }
  svg.topo text { font-family: "Segoe UI", system-ui, sans-serif; }
  .srv, .sgn { cursor: pointer; }
  .srv rect { fill: var(--panel); stroke-width: 1.5; }
  .srv.in rect { stroke: var(--in); } .srv.out rect { stroke: var(--out); }
  .sgn rect { stroke-width: 1.5; }
  .sgn.in rect { fill: var(--in-soft); stroke: var(--in); } .sgn.out rect { fill: var(--out-soft); stroke: var(--out); }
  .sgn.unknown rect { fill: color-mix(in srgb, var(--unknown) 15%, transparent); stroke: var(--unknown); stroke-dasharray: 5 4; }
  .sgn.same rect { stroke-width: 3; }
  .srv.sel rect, .sgn.sel rect, .srv.on rect, .sgn.on rect { stroke-width: 3; }
  .srv.more rect, .sgn.more rect, .srv.nohit rect { stroke-dasharray: 4 3; }
  .srv.vip rect { stroke: var(--vip); stroke-width: 2; }
  .srv .vipt { fill: var(--vip); font-size: 10.5px; font-weight: 700; }
  .vipbox { margin-top: 14px; border: 1px solid var(--vip); border-radius: 8px; padding: 10px 12px; background: color-mix(in srgb, var(--vip) 7%, transparent); }
  .vipbox h2 { color: var(--vip); }
  .badge.vip { border-color: var(--vip); color: var(--vip); }
  .srv .t1, .sgn .t1 { fill: var(--text); font-size: 13px; font-weight: 700; }
  .srv .t1 { font-family: Consolas, ui-monospace, monospace; }
  .srv .t2, .sgn .t2 { fill: var(--text); font-size: 11.5px; }
  .srv .t3, .sgn .t3, .srv .num, .sgn .num { fill: var(--muted); font-size: 11px; }
  .badge-same { fill: var(--ok); font-size: 10.5px; font-weight: 700; }
  .hint { fill: var(--muted); font-size: 12px; font-style: italic; }
  .hint.err { fill: var(--err); font-style: normal; }
  .edge { fill: none; opacity: .5; transition: opacity .12s; }
  .edge.in { stroke: var(--in); } .edge.out { stroke: var(--out); }
  .edge.hop { stroke-dasharray: 6 3; }
  svg.hl .edge { opacity: .07; } svg.hl .edge.on { opacity: .95; }
  .tnode rect { fill: var(--target); }
  .tnode text { fill: var(--target-text); font-size: 12.5px; }
  .colhead { fill: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .05em; }
  .zoom { display: inline-flex; gap: 4px; }
  .zoom button { padding: 4px 10px; }
  .detail { margin-top: 10px; }
  .detail:empty { display: none; }
  .detail .panel { background: var(--bg); }
  .sumgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 1100px) { .sumgrid { grid-template-columns: 1fr; } }
  tr.click { cursor: pointer; }
  .ai-q { width: 100%; min-height: 54px; resize: vertical; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .ai-out { margin-top: 12px; line-height: 1.55; }
  .ai-out h3 { font-size: 14px; margin: 14px 0 4px; color: var(--in); }
  .ai-out ul { margin: 4px 0; padding-left: 20px; }
  .ai-out p { margin: 4px 0; }
  .ai-meta { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .ai-meta pre { white-space: pre-wrap; font-size: 11.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; max-height: 320px; overflow: auto; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--in-soft); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; }
  .chip button { border: 0; background: transparent; padding: 0 2px; }
  .tbl-wrap { overflow-x: auto; max-height: 560px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 600; white-space: nowrap; cursor: pointer; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.mono { font-family: Consolas, ui-monospace, monospace; white-space: nowrap; }
  tr:hover td { background: color-mix(in srgb, var(--in-soft) 45%, transparent); }
  .dir-in h2 { color: var(--in); } .dir-out h2 { color: var(--out); }
  .muted { color: var(--muted); }
  .unk { color: var(--unknown); font-style: italic; }
  .badge { display: inline-block; font-size: 11px; border-radius: 4px; padding: 0 5px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.strong { border-color: var(--ok); color: var(--ok); }
  .badge.weak { border-color: var(--warn); color: var(--warn); }
  details summary { cursor: pointer; color: var(--muted); }
  .small { font-size: 11.5px; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--in); border-radius: 50%; animation: spin 1s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .grid2 { display: grid; gap: 16px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="deltaflow.svg" alt="DeltaFlow logosu">
    <div>
      <h1 class="brand-name"><span class="d">Delta</span><span class="f">Flow</span></h1>
      <div class="brand-tag">Ağ akışı · segment · uygulama topolojisi ve etki analizi</div>
    </div>
  </div>
  <form id="f">
    <label>IP adresi <input type="text" id="ip" placeholder="10.50.20.15" required></label>
    <label>Başlangıç <input type="datetime-local" id="start"></label>
    <label>Bitiş <input type="datetime-local" id="end"></label>
    <label>AppResponse kutusu <select id="appliance"></select></label>
    <div class="checks">
      <label><input type="checkbox" id="srcSplunk" checked> Splunk</label>
      <label><input type="checkbox" id="srcAr" checked> AppResponse</label>
      <label title="Bulunan sunucuların kendi trafiğini de sorgular (segment → sunucu → sorgulanan IP → sunucu → segment)"><input type="checkbox" id="hop2On" checked> 2. seviye</label>
    </div>
    <button class="primary" id="go" type="submit">Sorgula</button>
    <button type="button" id="cancel" hidden>İptal</button>
  </form>
</header>

<main id="main">
  <div class="panel empty" id="placeholder">Bir IP adresi girip sorgulayın.</div>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => (n ?? 0).toLocaleString("tr-TR");
const pad = n => String(n).padStart(2, "0");
const toLocalInput = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

const SERVER_CHOICES = [10, 15, 25, 40];  // her tarafta çizilen (ve 2. seviyede sorgulanan) sunucu sayısı
const SEG_CHOICES = [8, 12, 25, 50];  // her tarafta çizilen 2. seviye segment sayısı
const state = {
  data: null, hop2: null, filter: null, zoom: 1, selected: null, maxServers: 15, maxSegs: 12, lastParams: null,
  // Sol: sunuculara GELEN segmentler (in), sağ: sunucuların GİTTİĞİ segmentler (out). Değiştirilebilir.
  hopDir: { in: "in", out: "out" },
  search: { in: "", out: "" }, sort: { in: null, out: null }
};
let hopAbort = null;
let abort = null;

// ---------- Envanter yardımcıları ----------
const appName = a => a.appName || a.serviceName || a.unixName || a.website || "?";
const appNames = m => m && m.apps && m.apps.length ? [...new Set(m.apps.map(appName))].sort() : [];
const segLabel = s => s ? s.label : null;
const MATCH = {
  "ip-port": ["IP+Port", "strong"], "vip": ["VIP", "strong"],
  "ip": ["Sadece IP", "weak"], "vip-ip": ["VIP IP", "weak"], "yok": ["Envanterde yok", ""]
};
const matchBadge = m => m ? `<span class="badge ${MATCH[m.kind]?.[1] ?? ""}" title="Eşleşme türü">${esc(MATCH[m.kind]?.[0] ?? m.kind)}</span>` : "";
const portText = p => p === "" ? "web (L7)" : p;

const UNK = "__unk";
// Segment kimliği = segment adı (EPG > AppProfile > Description > CIDR); aynı adlı CIDR'lar tek segment.
const segKey = seg => seg ? seg.label : UNK;
const zoneKey = e => segKey(e.peerSegment);
const isTargetSeg = seg => !!(seg && state.data.target.segment && seg.label === state.data.target.segment.label);
const sameSegment = e => isTargetSeg(e.peerSegment);

// ---------- Form ----------
async function loadAppliances() {
  try {
    const list = await (await fetch("api/appliances")).json();
    // Varsayılan: tüm kutular birlikte sorgulanır; tek kutu seçmek de mümkün.
    $("#appliance").innerHTML = (list.length > 1 ? `<option value="-1" selected>Tüm kutular (${list.length})</option>` : "")
      + list.map(a => `<option value="${a.index}">${esc(a.name)}</option>`).join("") || `<option value="0">-</option>`;
  } catch { $("#appliance").innerHTML = `<option value="0">-</option>`; }
}

function initForm() {
  const p = new URLSearchParams(location.search);
  const now = new Date();
  $("#end").value = p.get("end") || toLocalInput(now);
  $("#start").value = p.get("start") || toLocalInput(new Date(now - 3600e3));
  if (p.get("ip")) $("#ip").value = p.get("ip");
  return !!p.get("ip");
}

$("#f").addEventListener("submit", ev => { ev.preventDefault(); run(); });
$("#cancel").addEventListener("click", () => abort?.abort());

async function run() {
  const srcs = [$("#srcSplunk").checked && "splunk", $("#srcAr").checked && "appresponse"].filter(Boolean);
  if (!srcs.length) { alert("En az bir kaynak seçin."); return; }
  const params = new URLSearchParams({
    ip: $("#ip").value.trim(), start: $("#start").value, end: $("#end").value,
    appliance: $("#appliance").value || "0", sources: srcs.join(",")
  });
  history.replaceState(null, "", "?" + new URLSearchParams({ ip: params.get("ip"), start: params.get("start"), end: params.get("end") }));

  abort?.abort(); hopAbort?.abort(); aiAbort?.abort();
  abort = new AbortController();
  $("#go").disabled = true; $("#cancel").hidden = false;
  $("#main").innerHTML = `<div class="panel empty"><span class="spinner"></span> Sorgulanıyor… (AppResponse raporu 1 dakikaya kadar sürebilir)</div>`;
  try {
    const r = await fetch("api/flow?" + params, { signal: abort.signal });
    const body = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
    if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
    state.data = body; state.hop2 = null; state.filter = null; state.selected = null; state.zoom = 1;
    state.lastParams = params;
    render();
    if ($("#hop2On").checked) runHop2(params);
  } catch (e) {
    const msg = e.name === "AbortError" ? "Sorgu iptal edildi." : e.message;
    $("#main").innerHTML = `<div class="panel empty" style="color:var(--err)">${esc(msg)}</div>`;
  } finally {
    $("#go").disabled = false; $("#cancel").hidden = true;
  }
}

// 2. seviye: çizilen sunucuların kendi trafiğini tek istekte getir.
async function runHop2(params) {
  const ips = [...new Set([...sideServers("in").slice(0, state.maxServers), ...sideServers("out").slice(0, state.maxServers)].map(s => s.ip))];
  if (!ips.length) return;
  hopAbort = new AbortController();
  state.hop2 = { status: "loading" };
  renderTopology();
  try {
    const r = await fetch("api/hop2", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: hopAbort.signal,
      body: JSON.stringify({ target: params.get("ip"), ips, start: params.get("start"), end: params.get("end"),
        appliance: +params.get("appliance"), sources: params.get("sources") })
    });
    const body = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
    if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
    const errs = [["Splunk", body.splunk], ["AppResponse", body.appResponse]].filter(([, s]) => s.error && s.error !== "Sorgulanmadı").map(([n, s]) => `${n}: ${s.error}`);
    state.hop2 = { status: "ok", peers: new Map(body.peers.map(p => [p.ip, p])), warn: errs.join(" · "), body };
  } catch (e) {
    state.hop2 = e.name === "AbortError" ? null : { status: "error", error: e.message };
  }
  renderTopology(); renderDetail();
}

// ---------- Render ----------
function render() {
  const d = state.data;
  $("#main").innerHTML = `
    <section class="panel">${renderStatus(d)}</section>
    <section class="panel">${renderTarget(d)}</section>
    <section class="panel">
      <div class="toolbar">
        <h2 style="margin:0">Topoloji</h2>
        <label style="flex-direction:row;align-items:center;gap:6px">Sunucu sayısı
          <select id="maxSrv">${SERVER_CHOICES.map(n => `<option value="${n}"${n === state.maxServers ? " selected" : ""}>ilk ${n}</option>`).join("")}</select></label>
        <label style="flex-direction:row;align-items:center;gap:6px">Segment sayısı
          <select id="maxSeg">${SEG_CHOICES.map(n => `<option value="${n}"${n === state.maxSegs ? " selected" : ""}>ilk ${n}</option>`).join("")}</select></label>
        <label style="flex-direction:row;align-items:center;gap:6px">Sol segmentler
          <select id="hopIn"><option value="in">sunuculara gelenler</option><option value="out">sunucuların gittikleri</option></select></label>
        <label style="flex-direction:row;align-items:center;gap:6px">Sağ segmentler
          <select id="hopOut"><option value="out">sunucuların gittikleri</option><option value="in">sunuculara gelenler</option></select></label>
        <div class="legend">
          <span><i style="background:var(--in)"></i>Gelen</span><span><i style="background:var(--out)"></i>Giden</span>
          <span>Kalın çerçeve = sorgulanan IP ile aynı segment</span><span>Çizgi kalınlığı = hit</span>
        </div>
        <div class="zoom">
          <button type="button" data-zoom="-" title="Uzaklaş">−</button>
          <button type="button" data-zoom="0" title="Ekrana sığdır">Sığdır</button>
          <button type="button" data-zoom="+" title="Yakınlaş">+</button>
          <button type="button" id="dlSvg">SVG</button>
          <button type="button" id="dlPng">PNG</button>
        </div>
      </div>
      <div id="filterbar"></div>
      <div class="topo-wrap" id="topo"></div>
      <div class="detail" id="detail"></div>
    </section>
    <section class="panel">
      <div class="toolbar"><h2 style="margin:0">AI etki analizi</h2>
        <span class="muted small">Gelen/giden bağlantılar (uygulama, IP, port, segment, sahip) şirket içi AI servisine gönderilir.</span></div>
      <textarea class="ai-q" id="aiQ"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
        <button type="button" class="primary" id="aiGo">AI'a yorumlat</button>
        <span class="muted small" id="aiNote"></span>
      </div>
      <div id="aiOut"></div>
    </section>
    <section class="panel">
      <h2>Sunucuların kendi segmentleri (1. seviye)</h2>
      <div class="sumgrid"><div id="sum-in"></div><div id="sum-out"></div></div>
    </section>
    <div class="grid2">
      <section class="panel dir-in" id="tbl-in"></section>
      <section class="panel dir-out" id="tbl-out"></section>
    </div>`;
  $("#maxSrv").addEventListener("change", ev => {
    state.maxServers = +ev.target.value; state.selected = null;
    renderTopology(); renderDetail();
    // Yeni gösterilen sunucuların 2. seviyesi henüz yoksa tekrar sorgula.
    const peers = state.hop2?.peers;
    const missing = [...sideServers("in"), ...sideServers("out")].map(x => x.ip).length &&
      ["in", "out"].some(d => sideServers(d).slice(0, state.maxServers).some(x => !peers?.has(x.ip)));
    if ($("#hop2On").checked && state.hop2?.status !== "loading" && missing) runHop2(state.lastParams);
  });
  $("#maxSeg").addEventListener("change", ev => { state.maxSegs = +ev.target.value; state.selected = null; renderTopology(); renderDetail(); });
  $("#hopIn").value = state.hopDir.in; $("#hopOut").value = state.hopDir.out;
  $("#hopIn").addEventListener("change", ev => { state.hopDir.in = ev.target.value; state.selected = null; renderTopology(); renderDetail(); });
  $("#hopOut").addEventListener("change", ev => { state.hopDir.out = ev.target.value; state.selected = null; renderTopology(); renderDetail(); });
  document.querySelectorAll("[data-zoom]").forEach(bt => bt.addEventListener("click", () => {
    const z = bt.dataset.zoom;
    state.zoom = z === "0" ? 1 : Math.min(4, Math.max(0.4, state.zoom * (z === "+" ? 1.25 : 0.8)));
    applyZoom();
  }));
  $("#aiQ").value = AI_DEFAULT_Q;
  $("#aiGo").addEventListener("click", runAi);
  $("#dlSvg").addEventListener("click", () => exportImage("svg"));
  $("#dlPng").addEventListener("click", () => exportImage("png"));
  renderTopology();
  renderSummary();
  renderTables();
}

    const cls = s.ok ? "ok" : s.error === "Sorgulanmadı" ? "skip" : "err";

    return `<span class="pill ${cls}" title="${esc(s.error ?? "")}"><b>${name}</b> ${info}</span>`;

}

          <td class="mono">${esc(m.ip)}:${esc(m.port ?? "")}</td><td class="mono">${esc(m.lbPort ?? "")}</td>
          <td>${segCell(m.segment)}</td><td class="mono">${esc(m.gwIps.join(", ") || "—")}<div class="small muted">${esc(m.fw ?? "")}</div></td>

          <td>${m.verified ? '<span class="badge strong">doğrulandı</span>' : m.hits ? '<span class="badge weak">GW görülmedi</span>' : '<span class="badge">trafik yok</span>'}</td></tr>`).join("")}</tbody>
      </table></div></div>`;
  }
  if (t.memberOf?.length) {

}

// ---------- Topoloji modeli ----------
// Sorgulanan IP'nin karşısındaki sunucular (1. seviye), hit'e göre sıralı.
function sideServers(dir) {
  const edges = dir === "in" ? state.data.inbound : state.data.outbound;
  const m = new Map();
  for (const e of edges) {
    let s = m.get(e.peerIp);
    if (!s) m.set(e.peerIp, s = { ip: e.peerIp, dir, hits: 0, ports: new Set(), seg: e.peerSegment, apps: appNames(e.peerApps), localApps: new Set(),
      viaVip: e.viaVip ?? null, peerVip: e.peerVip ?? null, peerVipGw: e.peerVipGw ?? null });
    s.hits += e.hits; s.ports.add(e.port);
    if (e.peerVip && !s.peerVip) s.peerVip = e.peerVip;
    if (dir === "in") appNames(e.localApp).forEach(a => s.localApps.add(a));
  }
  return [...m.values()].sort((a, b) => b.hits - a.hits);
}

// 2. seviye segmentler: çizilen sunucuların (gelen ya da giden) trafiğinin segment özeti.
function sideSegments(dir, servers) {
  const peers = state.hop2?.peers;
  if (!peers) return [];
  const m = new Map();
  for (const srv of servers) {
    const hop = peers.get(srv.ip); if (!hop) continue;
    for (const a of (state.hopDir[dir] === "in" ? hop.inbound : hop.outbound)) {
      const k = segKey(a.segment);
      let g = m.get(k);
      if (!g) m.set(k, g = { key: k, seg: a.segment, cidrs: new Set(), vlans: new Set(), hits: 0, ips: new Set(), ports: new Set(), apps: new Set(), links: new Map() });
      if (a.segment) { g.cidrs.add(a.segment.cidr); if (a.segment.vlan) g.vlans.add(a.segment.vlan); }
      g.hits += a.hits; a.topIps.forEach(ip => g.ips.add(ip)); a.ports.forEach(p => g.ports.add(p)); a.apps.forEach(x => g.apps.add(x));
      g.ipCount = (g.ipCount ?? 0) + a.ipCount;
      // Aynı sunucunun aynı adlı birden fazla CIDR'ı tek bağlantıda toplanır.
      const l = g.links.get(srv.ip) ?? { hits: 0, agg: { ports: [], apps: [], topIps: [] } };
      l.hits += a.hits;
      l.agg = { ports: [...new Set([...l.agg.ports, ...a.ports])], apps: [...new Set([...l.agg.apps, ...a.apps])], topIps: [...new Set([...l.agg.topIps, ...a.topIps])].slice(0, 10) };
      g.links.set(srv.ip, l);
    }
  }
  let list = [...m.values()].sort((a, b) => (a.key === UNK) - (b.key === UNK) || b.hits - a.hits);
  if (list.length > state.maxSegs) {
    const rest = list.slice(state.maxSegs - 1);
    const other = { key: "__other", other: rest, hits: 0, ipCount: 0, ips: new Set(), ports: new Set(), apps: new Set(), links: new Map() };
    for (const r of rest) {
      other.hits += r.hits; other.ipCount += r.ipCount;
      r.links.forEach((v, k) => other.links.set(k, { hits: (other.links.get(k)?.hits ?? 0) + v.hits }));
    }
    list = [...list.slice(0, state.maxSegs - 1), other];
  }
  return list;
}

const trunc = (s, n) => (s = String(s ?? "")).length > n ? s.slice(0, n - 1) + "…" : s;
const portSort = (a, b) => (a === "" ? 1e9 : +a || 0) - (b === "" ? 1e9 : +b || 0);
const portsLabel = set => { const p = [...set].sort(portSort).map(x => x === "" ? "web" : ":" + x); return p.slice(0, 4).join(" ") + (p.length > 4 ? "…" : ""); };
const segTitle = g => g.key === "__other" ? `Diğer ${g.other.length} segment` : g.seg ? g.seg.label : "Segment envanterinde yok";
const cidrText = set => set.size <= 1 ? [...set].join("") : `${set.size} CIDR`;
const segSub = g => {
  if (g.key === "__other" || !g.seg) return "";
  const c = cidrText(g.cidrs);
  return [c !== g.seg.label && c, g.vlans.size && "VLAN " + [...g.vlans].join(",")].filter(Boolean).join(" · ");
};

// ---------- Topoloji çizimi ----------
// Sütunlar: [segment] → [gelen sunucu] → [SORGULANAN IP] → [gidilen sunucu] → [segment]
function renderTopology() {
  const d = state.data;
  if (!d.inbound.length && !d.outbound.length) {
    $("#topo").innerHTML = `<div class="empty">Bu aralıkta akış bulunamadı.</div>`;
    renderFilterbar(); return;
  }
  const cols = {};
  for (const dir of ["in", "out"]) {
    const all = sideServers(dir);
    const shown = all.slice(0, state.maxServers);
    const hidden = all.slice(state.maxServers);
    const srv = shown.map(x => ({ ...x }));
    if (hidden.length) srv.push({ more: true, ip: `+ ${hidden.length} sunucu`, dir, hits: hidden.reduce((n, x) => n + x.hits, 0), ports: new Set(), apps: [], localApps: new Set(), list: hidden });
    cols[dir] = { srv, seg: sideSegments(dir, shown) };
  }

  const TOP = 56, SH = 58, SG = 10, GH = 50, GG = 10, TH = 140;
  const X = { segIn: 12, srvIn: 390, tgt: 740, srvOut: 1040, segOut: 1420 };
  const SW = 250, VW = 270, TW = 220, W = X.segOut + SW + 12;
  const colH = (n, h, g) => n ? n * h + (n - 1) * g : 0;
  const hop2Pending = !state.hop2 || state.hop2.status !== "ok";
  const inner = Math.max(TH, colH(cols.in.srv.length, SH, SG), colH(cols.out.srv.length, SH, SG),
    colH(cols.in.seg.length, GH, GG), colH(cols.out.seg.length, GH, GG), 80);
  const H = TOP + inner + 20, center = TOP + inner / 2;
  const place = (list, h, g) => { let y = TOP + (inner - colH(list.length, h, g)) / 2; list.forEach(n => { n.y = y; y += h + g; }); };
  for (const dir of ["in", "out"]) { place(cols[dir].srv, SH, SG); place(cols[dir].seg, GH, GG); }
  const ty = center - TH / 2;

  const allHits = [cols.in, cols.out].flatMap(c => [...c.srv.map(x => x.hits), ...c.seg.flatMap(g => [...g.links.values()].map(l => l.hits))]).concat([1]);
  const maxHit = Math.max(...allHits);
  const sw = h => (1.2 + 8 * Math.log(1 + h) / Math.log(1 + maxHit)).toFixed(1);
  const curve = (x1, y1, x2, y2) => { const mx = (x1 + x2) / 2; return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`; };
  const sel = state.selected;

  let edges = "", nodes = "";
  const srvId = (dir, i) => `v${dir}${i}`, segId = (dir, i) => `g${dir}${i}`;

  for (const dir of ["in", "out"]) {
    const { srv, seg } = cols[dir];
    const srvX = dir === "in" ? X.srvIn : X.srvOut, segX = dir === "in" ? X.segIn : X.segOut;
    const srvIdx = new Map(srv.map((s, i) => [s.ip, i]));
    const segOfSrv = new Map();

    // segment ↔ sunucu bağlantıları (2. seviye)
    seg.forEach((g, gi) => {
      for (const [ip, l] of g.links) {
        const si = srvIdx.get(ip); if (si == null) continue;
        const s = srv[si];
        (segOfSrv.get(si) ?? segOfSrv.set(si, []).get(si)).push(segId(dir, gi));
        const sy = s.y + SH / 2, gy = g.y + GH / 2;
        // okun yönü trafiğin yönü: segment → sunucu (gelen) ya da sunucu → segment (giden)
        const toServer = state.hopDir[dir] === "in";
        const segEdgeX = dir === "in" ? segX + SW : segX, srvEdgeX = dir === "in" ? srvX : srvX + VW;
        const path = toServer ? curve(segEdgeX, gy, srvEdgeX, sy) : curve(srvEdgeX, sy, segEdgeX, gy);
        const cls = toServer ? "in" : "out";
        edges += `<path class="edge hop ${cls}" data-rel="${segId(dir, gi)} ${srvId(dir, si)}" marker-end="url(#arr-${cls})" stroke-width="${sw(l.hits)}" d="${path}"><title>${esc(toServer ? `${segTitle(g)} → ${s.ip}` : `${s.ip} → ${segTitle(g)}`)}: ${fmt(l.hits)} hit</title></path>`;
      }
    });

    // sunucu ↔ sorgulanan IP
    srv.forEach((s, i) => {
      const sy = s.y + SH / 2;
      const tyy = ty + 24 + (TH - 48) * (srv.length > 1 ? i / (srv.length - 1) : 0.5);
      const rel = srvId(dir, i);
      const path = dir === "in" ? curve(X.srvIn + VW, sy, X.tgt, tyy) : curve(X.tgt + TW, tyy, X.srvOut, sy);
      edges += `<path class="edge ${dir}" data-rel="${rel}" marker-end="url(#arr-${dir})" stroke-width="${sw(s.hits)}" d="${path}"><title>${esc(dir === "in" ? `${s.ip} → ${d.target.ip}` : `${d.target.ip} → ${s.ip}`)} ${esc(portsLabel(s.ports))}: ${fmt(s.hits)} hit</title></path>`;

      const isSel = sel && sel.type === "srv" && sel.dir === dir && sel.ip === s.ip;
      let appTxt = dir === "in"
        ? (s.apps.join(", ") || "uygulama ?") + (s.localApps.size ? `  →  ${[...s.localApps].join(", ")}` : "")
        : (s.apps.join(", ") || "uygulama ?");
      // VIP işaretleri: üye (VIP → üye), karşı IP VIP, karşı IP LB GW
      let vipTag = "", line3 = [segLabel(s.seg) ?? "segment ?", portsLabel(s.ports)].join(" · ");
      if (s.viaVip) {
        vipTag = s.viaVip.verified ? "VIP ÜYESİ ✓" : "VIP ÜYESİ";
        appTxt = `${s.viaVip.hostname ?? ""} ${s.apps.length ? "· " + s.apps.join(", ") : ""}`.trim() || appTxt;
        const gws = s.viaVip.gwIps;
        line3 = s.hits ? `${segLabel(s.seg) ?? "segment ?"} · GW ${gws[0] ?? "?"}${gws.length > 1 ? " +" + (gws.length - 1) : ""}` : "trafik görülmedi (envanter)";
      } else if (s.peerVip) {
        vipTag = `VIP → ${s.peerVip.length} ÜYE`;
        appTxt = [...new Set(s.peerVip.map(m => m.hostname ?? m.ip))].join(", ");
      } else if (s.peerVipGw) {
        vipTag = "LB GW";
        appTxt = `Load balancer GW · ${s.peerVipGw}`;
      }
      nodes += `<g class="srv ${dir}${s.more ? " more" : ""}${isSel ? " sel" : ""}${vipTag ? " vip" : ""}${s.viaVip && !s.hits ? " nohit" : ""}" data-id="${srvId(dir, i)}" data-dir="${dir}" data-ip="${esc(s.ip)}" transform="translate(${srvX},${s.y})">
        <title>${esc(s.ip)}\n${esc(s.more ? s.list.slice(0, 30).map(x => x.ip).join(", ") : [segLabel(s.seg) ?? "segment ?", s.apps.join(", "), "Port: " + portsLabel(s.ports)].join("\n"))}\n${fmt(s.hits)} hit</title>
        <rect width="${VW}" height="${SH}" rx="8"></rect>
        <text class="t1" x="10" y="19">${esc(s.ip)}</text>
        <text class="num" x="${VW - 10}" y="19" text-anchor="end">${fmt(s.hits)}</text>
        ${vipTag ? `<text class="vipt" x="${VW - 60}" y="19" text-anchor="end">${esc(vipTag)}</text>` : ""}
        ${s.more ? `<text class="t3" x="10" y="38">2. seviyede sorgulanmadı</text>` : `
        <text class="t2" x="10" y="35">${esc(trunc(appTxt, 38))}</text>
        <text class="t3" x="10" y="50">${esc(trunc(line3, 42))}</text>`}
      </g>`;
    });

    // 2. seviye segment düğümleri
    seg.forEach((g, gi) => {
      const isSel = sel && sel.type === "seg" && sel.dir === dir && sel.key === g.key;
      const same = isTargetSeg(g.seg);
      nodes += `<g class="sgn ${dir}${g.key === UNK ? " unknown" : ""}${g.key === "__other" ? " more" : ""}${same ? " same" : ""}${isSel ? " sel" : ""}" data-id="${segId(dir, gi)}" data-dir="${dir}" data-key="${esc(g.key)}" transform="translate(${segX},${g.y})">
        <title>${esc(segTitle(g))}\n${esc(g.cidrs ? [...g.cidrs].join(", ") : g.other.map(segTitle).join(", "))}\n${fmt(g.links.size)} sunucu · ~${fmt(g.ipCount)} IP · ${fmt(g.hits)} hit${g.apps.size ? "\nUygulama: " + esc([...g.apps].join(", ")) : ""}</title>
        <rect width="${SW}" height="${GH}" rx="8"></rect>
        <text class="t1" x="10" y="19">${esc(trunc(segTitle(g), 24))}</text>
        <text class="num" x="${SW - 10}" y="19" text-anchor="end">${fmt(g.hits)}</text>
        <text class="t3" x="10" y="38">${esc(trunc(segSub(g) || `${fmt(g.links.size)} sunucu`, same ? 17 : 24))}</text>
        ${same ? `<text class="badge-same" x="${SW - 10}" y="38" text-anchor="end">AYNI SEGMENT</text>` : `<text class="num" x="${SW - 10}" y="38" text-anchor="end">${g.key === "__other" || !segSub(g) ? "" : fmt(g.links.size) + " sunucu"}</text>`}
      </g>`;
    });
  }

  // 2. seviye durum yazısı
  const hopHint = x => {
    if (!$("#hop2On").checked && !state.hop2) return `<text class="hint" x="${x}" y="${center}">2. seviye kapalı</text>`;
    if (!state.hop2 || state.hop2.status === "loading") return `<text class="hint" x="${x}" y="${center}">sunucuların trafiği sorgulanıyor…</text>`;
    if (state.hop2.status === "error") return `<text class="hint err" x="${x}" y="${center}">${esc(trunc(state.hop2.error, 40))}</text>`;
    return "";
  };
  const hopWarn = state.hop2?.status === "ok" && state.hop2.warn ? `<text class="hint err" x="${W / 2}" y="44" text-anchor="middle">${esc(trunc(state.hop2.warn, 140))}</text>` : "";

  const t = d.target;
  const tApps = [...new Set(t.apps.map(appName))];
  const lbl = { in: "SUNUCULARA GELEN SEGMENTLER", out: "SUNUCULARIN GİTTİĞİ SEGMENTLER" };
  const svg = `<svg class="topo" id="topoSvg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      ${["in", "out"].map(c => `<marker id="arr-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" style="fill:var(--${c})"></path></marker>`).join("")}
    </defs>
    <text class="colhead" x="${X.segIn}" y="22">${lbl[state.hopDir.in]} · ${fmt(cols.in.seg.length)}</text>
    <text class="colhead" x="${X.srvIn}" y="22">GELEN SUNUCULAR · ${fmt(sideServers("in").length)}</text>
    <text class="colhead" x="${X.tgt + TW / 2}" y="22" text-anchor="middle">SORGULANAN IP</text>
    <text class="colhead" x="${X.srvOut}" y="22">GİDİLEN SUNUCULAR · ${fmt(sideServers("out").length)}</text>
    <text class="colhead" x="${X.segOut + SW}" y="22" text-anchor="end">${lbl[state.hopDir.out]} · ${fmt(cols.out.seg.length)}</text>
    ${hopWarn}
    ${hop2Pending ? hopHint(X.segIn) + hopHint(X.segOut) : ""}
    ${edges}
    ${nodes}
    <g class="tnode" transform="translate(${X.tgt},${ty})">
      <title>${esc(t.ip)}\n${esc(t.segment ? `${t.segment.label} (${t.segment.cidr})` : "segment ?")}\n${esc(tApps.join(", "))}</title>
      <rect width="${TW}" height="${TH}" rx="12"></rect>
      <text x="${TW / 2}" y="30" text-anchor="middle" style="font-size:12px;font-weight:700;letter-spacing:.06em">SORGULANAN IP</text>
      <text x="${TW / 2}" y="55" text-anchor="middle" style="font-size:17px;font-weight:700">${esc(t.ip)}</text>

function applyZoom() {
  const svg = $("#topoSvg"); if (!svg) return;
  const base = Math.max($("#topo").clientWidth - 2, 1200);
  svg.style.width = Math.round(base * state.zoom) + "px";
}

function wireTopology() {
  const svg = $("#topoSvg");
  const edgesOf = id => Array.from(svg.querySelectorAll(".edge")).filter(p => p.dataset.rel.split(" ").includes(id));
  svg.querySelectorAll("[data-id]").forEach(n => {
    // Vurgu: düğümün kendi bağlantıları + segment için bağlı sunucuların sorgulanan IP'ye giden yolu.
    n.addEventListener("mouseenter", () => {
      svg.classList.add("hl");
      const id = n.dataset.id;
      for (const p of edgesOf(id)) {
        p.classList.add("on");
        for (const other of p.dataset.rel.split(" ")) {
          if (other === id) continue;
          svg.querySelector(`[data-id="${other}"]`)?.classList.add("on");
          if (n.classList.contains("sgn"))
            svg.querySelectorAll(`.edge[data-rel="${other}"]`).forEach(x => x.classList.add("on"));
        }
      }
      n.classList.add("on");
    });
    n.addEventListener("mouseleave", () => {
      svg.classList.remove("hl");
      svg.querySelectorAll(".on").forEach(x => x.classList.remove("on"));
    });
  });
  svg.querySelectorAll(".srv").forEach(n => n.addEventListener("click", () => {
    const dir = n.dataset.dir, ip = n.dataset.ip;
    const s = state.cols[dir].srv.find(x => x.ip === ip);
    const same = state.selected && state.selected.type === "srv" && state.selected.dir === dir && state.selected.ip === ip;
    if (same) { clearFilter(); return; }
    const set = new Set(s.more ? s.list.map(x => x.ip) : [ip]);
    state.selected = s.more ? null : { type: "srv", dir, ip };
    state.filter = { dir, label: s.more ? s.ip : ip, test: e => set.has(e.peerIp) };
    renderTopology(); renderDetail(); renderTables();
  }));
  svg.querySelectorAll(".sgn").forEach(n => n.addEventListener("click", () => {
    const dir = n.dataset.dir, key = n.dataset.key;
    const g = state.cols[dir].seg.find(x => x.key === key);
    const same = state.selected && state.selected.type === "seg" && state.selected.dir === dir && state.selected.key === key;
    if (same) { clearFilter(); return; }
    const set = new Set(g.links.keys());
    state.selected = { type: "seg", dir, key };
    state.filter = { dir, label: `${segTitle(g)} ile bağlantılı sunucular`, test: e => set.has(e.peerIp) };
    renderTopology(); renderDetail(); renderTables();
  }));
}

// ---------- AI etki analizi ----------
const AI_DEFAULT_Q = "Bu sunucuda bir değişiklik (bakım, yeniden başlatma, sürüm/konfigürasyon değişikliği, kapatma) yapılırsa nereler etkilenir?";
const AI_MAX_PEERS = 30;
let aiAbort = null;

// Sorgu sonucunu AI'a gidecek bağlantı listesine çevirir: her (karşı IP, port) için iki uçtaki uygulamalar.
// 2. seviye gönderilmez; etki listesi backend'de servis → kullanan uygulama olarak gruplanır.
const AI_MAX_EDGES = 80;
function buildAiRequest() {
  const d = state.data;
  const edgesOf = dir => (dir === "in" ? d.inbound : d.outbound)
    .slice().sort((a, b) => b.hits - a.hits).slice(0, AI_MAX_EDGES)
    .map(e => {
      const apps = e.peerApps?.apps ?? [];
      return {
        ip: e.peerIp,
        segment: e.peerSegment ? `${e.peerSegment.label}${e.peerSegment.label !== e.peerSegment.cidr ? " " + e.peerSegment.cidr : ""}` : null,
        apps: [...appNames(e.peerApps), ...(vipText(e) ? [vipText(e)] : [])],
        owners: [...new Set(apps.flatMap(a => [a.varlikMuhafizi, a.uygulamaVarlikSahibi]).filter(Boolean))],
        port: e.port === "" ? "web" : e.port,
        hits: e.hits,
        localApps: dir === "in" ? appNames(e.localApp) : null,
        processes: dir === "out" ? e.processes.slice(0, 6) : null
      };
    });
  const t = d.target;
  return {
    question: $("#aiQ").value.trim(),
    ip: t.ip,
    segment: t.segment ? `${t.segment.label} (${t.segment.cidr}${t.segment.vlan ? ", VLAN " + t.segment.vlan : ""})` : null,
    apps: [...new Set(t.apps.map(a => `${appName(a)}${a.port ? " :" + a.port : ""}`)),
      ...(t.vip?.length ? [`VIP (load balancer), havuz: ${[...new Set(t.vip.map(m => m.pool).filter(Boolean))].join(", ")}; üyeler: ${t.vip.map(m => `${m.hostname ?? ""} ${m.ip}:${m.port ?? ""}`).join(", ")}`] : []),
      ...(t.memberOf?.length ? [`VIP havuz üyesi: ${t.memberOf.map(m => `${m.lbIp}:${m.lbPort ?? ""} (${m.pool ?? ""})`).join(", ")}`] : [])],
    period: state.lastParams ? `${state.lastParams.get("start").replace("T", " ")} - ${state.lastParams.get("end").replace("T", " ")}` : null,
    inbound: edgesOf("in"), outbound: edgesOf("out"),
    inboundTotal: sideServers("in").length, outboundTotal: sideServers("out").length
  };
}

async function runAi() {
  aiAbort?.abort();
  aiAbort = new AbortController();
  const btn = $("#aiGo");
  btn.disabled = true;
  $("#aiNote").textContent = "";
  $("#aiOut").innerHTML = `<div class="muted" style="margin-top:12px"><span class="spinner"></span> AI yorumluyor… (birkaç dakika sürebilir)</div>`;
  try {
    const r = await fetch("api/ai/etki", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(buildAiRequest()), signal: aiAbort.signal });
    const body = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
    if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
    $("#aiOut").innerHTML = `<div class="ai-out">${renderMarkdown(body.answer)}</div>
      <div class="ai-meta">Model: ${esc(body.model)} · ${(body.elapsedMs / 1000).toFixed(1)} sn
        <details><summary>AI'a gönderilen metin</summary><pre>${esc(body.prompt)}</pre></details></div>`;
  } catch (e) {
    if (e.name !== "AbortError") $("#aiOut").innerHTML = `<div style="color:var(--err);margin-top:12px">${esc(e.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
}

// Modelin döndürdüğü basit markdown: ## başlık, - madde, **kalın**.
function renderMarkdown(text) {
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  let html = "", inList = false;
  for (const raw of String(text ?? "").split(/\r?\n/)) {
    const line = raw.trim();
    const item = line.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (item) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(item[1])}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    const h = line.match(/^#{1,6}\s+(.*)$/);
    if (h) html += `<h3>${inline(h[1])}</h3>`;
    else if (line) html += `<p>${inline(line)}</p>`;
  }
  return html + (inList ? "</ul>" : "");
}

function renderSummary() {
  for (const dir of ["in", "out"]) {
    const edges = dir === "in" ? state.data.inbound : state.data.outbound;
    const m = new Map();
    for (const e of edges) {
      const k = zoneKey(e);
      let r = m.get(k);
      if (!r) m.set(k, r = { key: k, seg: e.peerSegment, same: sameSegment(e), cidrs: new Set(), vlans: new Set(), ips: new Set(), ports: new Set(), apps: new Set(), hits: 0 });
      if (e.peerSegment) { r.cidrs.add(e.peerSegment.cidr); if (e.peerSegment.vlan) r.vlans.add(e.peerSegment.vlan); }
      r.ips.add(e.peerIp); r.ports.add(e.port); r.hits += e.hits;
      appNames(dir === "in" ? e.localApp : e.peerApps).forEach(a => r.apps.add(a));
    }
    const rows = [...m.values()].sort((a, b) => b.hits - a.hits);
    $("#sum-" + dir).innerHTML = `
      <h2 style="color:var(--${dir})">${dir === "in" ? `Gelen: ${fmt(rows.length)} segmentten geliniyor` : `Giden: ${fmt(rows.length)} segmente gidiliyor`}</h2>
      ${rows.length ? `<div class="tbl-wrap" style="max-height:340px"><table>
        <thead><tr><th>Segment</th><th>VLAN</th><th class="num">IP</th><th>Port</th><th>${dir === "in" ? "Karşılayan uygulama" : "Hedef uygulama"}</th><th class="num">Hit</th></tr></thead>
        <tbody>${rows.map(r => `<tr class="click" data-dir="${dir}" data-key="${esc(r.key)}">
          <td>${r.seg ? `<b>${esc(r.seg.label)}</b>${r.same ? ' <span class="badge strong">aynı segment</span>' : ""}<div class="small muted mono" title="${esc([...r.cidrs].join(", "))}">${esc([...r.cidrs].slice(0, 3).join(", "))}${r.cidrs.size > 3 ? ` +${r.cidrs.size - 3}` : ""}${r.seg.tenant ? " · " + esc(r.seg.tenant) : ""}</div>` : `<span class="unk">Segment envanterinde yok</span>`}</td>
          <td class="mono">${esc([...r.vlans].join(", "))}</td>
          <td class="num">${fmt(r.ips.size)}</td>
          <td class="mono">${esc([...r.ports].sort(portSort).map(portText).slice(0, 8).join(", "))}${r.ports.size > 8 ? "…" : ""}</td>
          <td>${esc([...r.apps].slice(0, 4).join(", "))}${r.apps.size > 4 ? "…" : ""}</td>
          <td class="num">${fmt(r.hits)}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">Kayıt yok.</div>`}`;
    $("#sum-" + dir).querySelectorAll("tr.click").forEach(tr => tr.addEventListener("click", () => {
      const k = tr.dataset.key, row = rows.find(r => r.key === k);
      state.selected = null;
      state.filter = { dir, label: row.seg ? row.seg.label : "segment bilinmiyor", test: e => zoneKey(e) === k };
      renderTopology(); renderDetail(); renderTables();
      document.getElementById("tbl-" + dir).scrollIntoView({ behavior: "smooth" });
    }));
  }
}

// ---------- Görüntü indirme ----------
function exportImage(kind) {
  const src = $("#topoSvg"); if (!src) return;
  const clone = src.cloneNode(true);
  const props = ["fill", "stroke", "stroke-width", "stroke-dasharray", "opacity", "font-size", "font-weight", "font-family", "font-style"];
  const a = [src, ...src.querySelectorAll("*")], b = [clone, ...clone.querySelectorAll("*")];
  a.forEach((el, i) => { const cs = getComputedStyle(el); b[i].setAttribute("style", props.map(p => `${p}:${cs.getPropertyValue(p)}`).join(";")); });
  const [, , w, h] = src.getAttribute("viewBox").split(" ").map(Number);
  clone.setAttribute("width", w); clone.setAttribute("height", h);
  clone.querySelector("*") && clone.insertAdjacentHTML("afterbegin", `<rect width="${w}" height="${h}" fill="${getComputedStyle(document.body).backgroundColor}"></rect>`);
  const xml = new XMLSerializer().serializeToString(clone);
  const name = `DeltaFlow_${state.data.target.ip}_topoloji`;
  const save = (blob, ext) => { const l = document.createElement("a"); l.href = URL.createObjectURL(blob); l.download = `${name}.${ext}`; l.click(); setTimeout(() => URL.revokeObjectURL(l.href), 1000); };
  if (kind === "svg") { save(new Blob([xml], { type: "image/svg+xml" }), "svg"); return; }
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas"); c.width = w * 2; c.height = h * 2;
    const ctx = c.getContext("2d"); ctx.scale(2, 2); ctx.drawImage(img, 0, 0);
    c.toBlob(bl => save(bl, "png"));
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
}

}
function appsCell(m, showBadge) {
  const n = appNames(m);
  if (!n.length) return `<span class="unk">bilinmiyor</span>`;
  const owner = [...new Set(m.apps.map(a => a.varlikMuhafizi).filter(Boolean))][0];
  return `${n.map(x => `<div>${esc(x)}</div>`).join("")}${owner ? `<div class="small muted">${esc(owner)}</div>` : ""}${showBadge ? matchBadge(m) : ""}`;
}
function detailCell(e) {
  const parts = [];
  if (e.protocols.length) parts.push(`<span class="badge">${esc(e.protocols.join("/"))}</span>`);
  if (e.computers.length) parts.push(`<div class="small">💻 ${esc(e.computers.slice(0, 3).join(", "))}${e.computers.length > 3 ? "…" : ""}</div>`);
  if (e.processes.length) parts.push(`<div class="small">⚙ ${esc(e.processes.slice(0, 3).join(", "))}${e.processes.length > 3 ? "…" : ""}</div>`);
  if (e.urls.length) parts.push(`<details class="small"><summary>${e.urls.length} URL</summary>${e.urls.map(u => `<div class="mono">${esc(u)}</div>`).join("")}</details>`);
  return parts.join("");
}

function visibleEdges(dir) {
  let list = dir === "in" ? state.data.inbound : state.data.outbound;
  const f = state.filter;
  if (f && f.dir === dir) list = list.filter(f.test);
  const q = state.search[dir].toLowerCase();
  if (q) list = list.filter(e => COLS[dir].some(c => String(c.v(e)).toLowerCase().includes(q)));
  const s = state.sort[dir];
  if (s) {
    const col = COLS[dir][s.i];
    list = [...list].sort((a, b) => {
      const x = col.v(a), y = col.v(b);
      const r = typeof x === "number" ? x - y : String(x).localeCompare(String(y), "tr", { numeric: true });
      return s.desc ? -r : r;
    });
  }
  return list;
}

function renderTables() {
  for (const dir of ["in", "out"]) {
    const el = $("#tbl-" + dir);
    const rows = visibleEdges(dir);
    const total = (dir === "in" ? state.data.inbound : state.data.outbound).length;
    const cols = COLS[dir];
    const s = state.sort[dir];
    el.innerHTML = `
      <div class="toolbar">
        <h2 style="margin:0">${dir === "in" ? "Gelen trafik — bu makineye kim geliyor" : "Giden trafik — bu makine nereye gidiyor"}
          <span class="muted" style="font-weight:400">(${fmt(rows.length)}${rows.length !== total ? " / " + fmt(total) : ""})</span></h2>
        <div style="display:flex;gap:8px">
          <input type="search" placeholder="Tabloda ara…" value="${esc(state.search[dir])}" data-search="${dir}">
          <button type="button" data-csv="${dir}">CSV</button>
        </div>
      </div>
      ${rows.length ? `<div class="tbl-wrap"><table>
        <thead><tr>${cols.map((c, i) => `<th class="${c.c === "num" ? "num" : ""}" data-sort="${i}">${c.h}${s && s.i === i ? (s.desc ? " ▼" : " ▲") : ""}</th>`).join("")}</tr></thead>
        <tbody>${rows.map(e => `<tr>${cols.map(c => `<td class="${c.c ?? ""}">${c.html ? c.html(e) : esc(c.v(e))}</td>`).join("")}</tr>`).join("")}</tbody>
      </table></div>` : `<div class="empty">Kayıt yok.</div>`}`;

    const inp = el.querySelector("[data-search]");
    inp.addEventListener("input", () => {
      state.search[dir] = inp.value;
      const pos = inp.selectionStart;
      renderTables();
      const again = $(`#tbl-${dir} [data-search]`); again.focus(); again.setSelectionRange(pos, pos);
    });
    el.querySelector("[data-csv]").addEventListener("click", () => exportCsv(dir));
    el.querySelectorAll("th[data-sort]").forEach(th => th.addEventListener("click", () => {
      const i = +th.dataset.sort, cur = state.sort[dir];
      state.sort[dir] = cur && cur.i === i ? (cur.desc ? null : { i, desc: true }) : { i, desc: cols[i].c === "num" };
      renderTables();
    }));
  }
}

function exportCsv(dir) {
  const cols = COLS[dir];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [cols.map(c => q(c.h)).join(";"), ...visibleEdges(dir).map(e => cols.map(c => q(c.v(e))).join(";"))];
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `DeltaFlow_${state.data.target.ip}_${dir === "in" ? "gelen" : "giden"}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

window.addEventListener("resize", applyZoom);
loadAppliances().then(() => { if (initForm()) run(); });
</script>
</body>
