<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeltaFlow · Segment tarama</title>
<link rel="icon" href="deltaflow.svg">
<script>
  try { const t = localStorage.getItem("deltaflow.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<!--
  Segment tarama (Segment.cs): verilen segmentteki tüm IP'lerin Carbon Black'te görülen gelen portları ve o portu kabul eden exe'ler
  (ERT'den bağımsız); ERT yalnız karşılaştırma (kayıtlı / adı boş / yok). Tarama arka plan işi, sayfa durumu sorgular.
-->
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1d2330; --muted: #677084; --line: #dde1e8;
    --in: #2f6fd6; --in-soft: #e5eefc; --ok: #2e8b57; --err: #c8353a; --warn: #b7791f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171d; --panel: #1c2028; --text: #e4e7ec; --muted: #9098a8; --line: #2d333e;
      --in: #6ea0f0; --in-soft: #1f2d45; --ok: #5cc28a; --err: #ef6b6f; --warn: #e0b050;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171d; --panel: #1c2028; --text: #e4e7ec; --muted: #9098a8; --line: #2d333e;
    --in: #6ea0f0; --in-soft: #1f2d45; --ok: #5cc28a; --err: #ef6b6f; --warn: #e0b050;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  header img { width: 30px; height: 30px; }
  header h1 { margin: 0; font-size: 19px; }
  header a { color: var(--muted); text-decoration: none; font-size: 13px; }
  header a:hover { color: var(--in); }
  header .sp { flex: 1; }
  #me { font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
  main { padding: 18px 20px 40px; max-width: 1700px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; min-width: 120px; background: var(--bg); }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
  input, select, button, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--in); border-color: var(--in); color: #fff; font-weight: 600; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 4px 0 12px; }
  .tools .sp { flex: 1; }
  .tools label { display: flex; gap: 6px; align-items: center; font-size: 13px; }
  .warn { border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); border-radius: 10px; padding: 9px 14px; margin-bottom: 12px; font-size: 13px; }
  .run { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; background: var(--bg); display: grid; gap: 6px; font-size: 13px; }
  .run .bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .run .bar i { display: block; height: 100%; background: var(--in); transition: width .4s; }
  .grid { border: 1px solid var(--line); border-radius: 10px; overflow: auto; max-height: calc(100vh - 330px); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th[data-sort], th [data-sort] { cursor: pointer; user-select: none; }
  th .arr { margin-left: 3px; opacity: .35; }
  th .on > .arr, th.on > .arr { opacity: 1; color: var(--in); }
  th .sub2 { font-weight: 500; text-transform: none; letter-spacing: 0; margin-left: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; }
  th .sub2.on { border-color: var(--in); color: var(--in); }
  th { position: sticky; top: 0; background: var(--bg); color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); z-index: 1; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:hover td { background: var(--in-soft); }
  tr.alt td { color: var(--muted); }
  .mono { font-family: Consolas, ui-monospace, monospace; }
  .ip a { font-family: Consolas, ui-monospace, monospace; font-weight: 600; color: var(--text); text-decoration: none; }
  .ip a:hover { color: var(--in); text-decoration: underline; }
  .chips span { display: inline-block; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; margin: 1px 3px 1px 0; font-size: 12px; }
  .small { font-size: 12px; } .muted { color: var(--muted); }
  .sug b { font-size: 13.5px; }
  .sug .why { color: var(--muted); font-size: 12px; margin-top: 2px; max-width: 520px; }
  .conf { display: inline-block; width: 46px; height: 6px; border-radius: 9px; background: var(--line); vertical-align: middle; margin: 0 6px; overflow: hidden; }
  .conf i { display: block; height: 100%; }
  .st { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px; border: 1px solid; }
  .st.ai { color: var(--in); border-color: var(--in); }
  .st.ok { color: var(--ok); border-color: var(--ok); }
  .st.red { color: var(--err); border-color: var(--err); }
  .st.new { color: var(--warn); border-color: var(--warn); }
  .acts { white-space: nowrap; }
  .acts button { padding: 2px 8px; font-size: 12px; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; color: var(--muted); font-size: 12.5px; gap: 10px; flex-wrap: wrap; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--in); border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -2px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100vw); background: var(--panel); border-left: 1px solid var(--line);
    box-shadow: -12px 0 32px rgba(0,0,0,.18); z-index: 50; display: flex; flex-direction: column; }
  .drawer .dh { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: start; }
  .drawer .dh h3 { margin: 0; font-size: 17px; }
  .drawer pre { margin: 0; padding: 14px 18px; overflow: auto; white-space: pre-wrap; font-size: 12px; line-height: 1.5; flex: 1; }
  .st.yok { color: var(--err); border-color: var(--err); }
  .st.bos { color: var(--warn); border-color: var(--warn); }
  .urun { display: inline-block; font-size: 11px; font-weight: 700; color: var(--in); border: 1px solid var(--in); border-radius: 4px; padding: 0 5px; margin-left: 4px; }
  tr.grp td { border-top: 2px solid var(--line); }
  tr.cont td.ipc a, tr.cont td.hc { opacity: .35; }
  details { margin-top: 14px; } summary { cursor: pointer; font-weight: 600; }
  .segrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #seg { min-width: 360px; }
</style>
</head>
<body>
<header>
  <img src="deltaflow.svg" alt="">
  <div><h1>Segment / etiket tarama · gelen portlar ve exe'ler</h1>
    <div class="sub">Segmentteki ya da etiketteki bütün IP'lerin Carbon Black'te görülen gelen portları ve o portu kabul eden programlar · ERT ile karşılaştırma</div></div>
  <span class="sp"></span>
  <a href="eksik.html">ERT eksikleri ↗</a>
  <a href="./">← DeltaFlow</a>
  <span id="surum" class="small muted"></span>
  <span id="me"></span>
</header>
<main>
  <section class="panel">
    <div class="segrow">
      <select id="tur" title="Neye göre taransın"><option value="segment">Segment</option><option value="etiket">Etiket</option></select>
      <input id="seg" list="segList" placeholder="Segment adı ya da CIDR (ör. 10.1.2.0/24)" autocomplete="off">
      <datalist id="segList"></datalist>
      <label class="small muted">Carbon Black aralığı <select id="saat"><option value="1">1 saat</option><option value="6">6 saat</option>
        <option value="24" selected>24 saat</option><option value="72">3 gün</option><option value="168">7 gün</option></select></label>
      <button id="tara" class="primary">Tara</button>
      <button id="dur" hidden>Durdur</button>
      <span id="segInfo" class="small muted"></span>
    </div>
    <div id="warn" style="margin-top:12px"></div>
    <div id="run"></div>
    <div id="res"></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Number(n || 0).toLocaleString("tr-TR");
const st = { ai: null, aiTimer: null, open: new Set(), tur: "segment", tags: [], segs: [], job: null, data: null, timer: null, yetki: {}, q: "", alt: false, dyn: false, genel: false, sifir: true, durum: "", sort: "ip", desc: false };
const ipNum = ip => ip.split(".").reduce((a, b) => a * 256 + +b, 0);

async function api(url, opt) {
  const r = await fetch(url, opt);
  const b = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok) throw new Error(b.error || `HTTP ${r.status}`);
  return b;
}

async function loadSegs() {
  try {
    [st.segs, st.tags] = await Promise.all([api("api/segment/liste"), api("api/etiketler").then(b => b.etiketler || []).catch(() => [])]);
    fillList();
  } catch (e) { $("#warn").innerHTML = `<div class="warn">Segment listesi alınamadı: ${esc(e.message)}</div>`; }
}
// Segment ya da etiket listesi (etiket: ana etiket seçilince alt etiketli sunucular da gelir)
function fillList() {
  $("#seg").placeholder = st.tur === "etiket" ? "Etiket (ör. VERIAMBARI ya da MOBILBANKACILIK/MOBIL APP)" : "Segment adı ya da CIDR (ör. 10.1.2.0/24)";
  $("#segList").innerHTML = st.tur === "etiket"
    ? st.tags.map(t => `<option value="${esc(t.ad)}">${t.sunucu} sunucu${t.aciklama ? " · " + esc(t.aciklama) : ""}</option>`).join("")
    : st.segs.map(s => `<option value="${esc(s.ad)}">${esc(s.cidrler.join(", "))}${s.kurum ? " · " + esc(s.kurum) : ""} · ERT'de ${s.ertSunucu} sunucu</option>`).join("");
  segInfo();
}
function segInfo() {
  const v = $("#seg").value.trim().toLowerCase();
  if (st.tur === "etiket") { const t = st.tags.find(x => x.ad.toLowerCase() === v); $("#segInfo").textContent = t ? `${t.sunucu} sunucu` : ""; return; }
  const s = st.segs.find(x => x.ad.toLowerCase() === v);
  $("#segInfo").textContent = s ? `${s.cidrler.join(", ")} · ERT'de ${s.ertSunucu} sunucu` : /\/\d+$/.test(v) ? "CIDR" : "";
}

async function start() {
  const seg = $("#seg").value.trim();
  if (!seg) return alert(st.tur === "etiket" ? "Etiket girin." : "Segment adı ya da CIDR girin.");
  $("#warn").innerHTML = ""; $("#res").innerHTML = "";
  try {
    const j = await api("api/segment/tarama", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ [st.tur]: seg, saat: +$("#saat").value }) });
    st.job = j.id; st.ai = null; clearTimeout(st.aiTimer);
    history.replaceState(null, "", "?" + new URLSearchParams({ [st.tur]: seg, saat: $("#saat").value }));
    poll(j);
  } catch (e) { $("#warn").innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
}

async function poll(j) {
  clearTimeout(st.timer);
  if (!j) { try { j = await api("api/segment/tarama/" + st.job); } catch (e) { $("#warn").innerHTML = `<div class="warn">${esc(e.message)}</div>`; return; } }
  const pct = j.toplam ? Math.round(100 * j.biten / j.toplam) : 0;
  $("#tara").disabled = j.calisiyor; $("#dur").hidden = !j.calisiyor;
  $("#run").innerHTML = j.calisiyor ? `<div class="run"><div><span class="spinner"></span> <b>${esc(j.segment)}</b> · ${esc(j.asama)}</div><div class="bar"><i style="width:${pct}%"></i></div></div>`
    : j.hata ? `<div class="warn">Tarama başarısız: ${esc(j.hata)}</div>` : j.asama === "Durduruldu" ? `<div class="warn">Durduruldu.</div>` : "";
  if (j.calisiyor) { st.timer = setTimeout(() => poll(), 2000); return; }
  if (j.sonuc) { st.data = j.sonuc; render(); setTimeout(aiPoll, 800); }   // AI tahmini sunucuda kendiliğinden başlar
}

// ---- AI ile iş uygulaması tahmini (sunucu sunucu, SurecAi) ----
async function aiPoll(deneme = 0) {
  clearTimeout(st.aiTimer);
  try { st.ai = await api(`api/segment/tarama/${st.job}/ai`); }
  catch (e) {   // iş henüz kayıtlı değilse bir süre daha dene
    st.aiHata = e.message; render();
    // uç hiç yoksa (JSON'suz 404) sunucudaki DLL bu sürümden eski: beklemeden söyle
    if (/^HTTP 404/.test(e.message) && !st.surum?.segmentAi) {
      st.ai = { calisiyor: false, toplam: 0, biten: 0, sonuclar: {}, hatalar: {}, uyari: `Sunucudaki DeltaFlow sürümü AI tahminini desteklemiyor (eski DLL${st.surum?.surum ? ", " + st.surum.surum : ""}). Segment.cs / Program.cs ile yeniden derleyip yayınlayın.` };
      render(); return;
    }
    if (deneme < 40) st.aiTimer = setTimeout(() => aiPoll(deneme + 1), 2000);
    else { st.ai = { calisiyor: false, toplam: 0, biten: 0, sonuclar: {}, hatalar: {}, uyari: "AI tahmini durumu alınamadı: " + e.message }; render(); }
    return;
  }
  st.aiHata = null; render();
  if (st.ai.calisiyor) st.aiTimer = setTimeout(aiPoll, 2500);
}
// Satırın exe'si için AI tahmini (sonuç exe adıyla eşleşir)
function aiOf(ip, exe) {
  const s = st.ai?.sonuclar?.[ip];
  if (!s) return st.ai?.hatalar?.[ip] ? { hata: st.ai.hatalar[ip] } : null;
  // AI exe'yi tam yol, büyük/küçük harf ya da ".exe"siz yazabilir: dosya adına indirgenip karşılaştırılır
  const n = v => String(v || "").toLowerCase().split(/[\\/]/).pop().replace(/\.exe$/, "").trim();
  const k = n(exe);
  return { u: (s.uygulamalar || []).find(u => n(u.exe) === k || n(u.yol) === k), ozet: s.ozet, var: true };
}
function aiCell(ip, exe) {
  const a = aiOf(ip, exe);
  if (!a) return !st.ai || st.ai.calisiyor ? `<span class="small muted">…</span>`
    : `<span class="small muted" title="Bu sunucu AI'a gönderilmedi (yalnız genel / ajan süreçleri) ya da sonuç gelmedi">sorulmadı</span>`;
  if (a.hata) return `<span class="small" style="color:var(--err)" title="${esc(a.hata)}">AI hatası</span>`;
  if (!a.u) return `<span class="small muted" title="AI bu exe'yi iş uygulaması saymadı (genel / altyapı)">—</span>`;
  const u = a.u, c = u.guven >= 75 ? "var(--ok)" : u.guven >= 50 ? "var(--warn)" : "var(--err)";
  const tarih = st.ai?.tarihler?.[ip];
  return `<div class="sug" title="${esc((u.gerekce || "") + (tarih ? "\nTahmin tarihi: " + tarih : ""))}"><b>${esc(u.uygulama || "?")}</b><span class="conf"><i style="width:${u.guven}%;background:${c}"></i></span><span class="small muted">%${u.guven}</span>
    ${u.ertKarsiligi ? `<div class="small">ERT: ${esc(u.ertKarsiligi)}</div>` : ""}${u.rol ? `<div class="small muted">${esc(u.rol)}</div>` : ""}</div>`;
}
const aiText = (ip, exe) => { const a = aiOf(ip, exe); return a?.u ? `${a.u.uygulama || ""}${a.u.ertKarsiligi ? " (ERT: " + a.u.ertKarsiligi + ")" : ""} %${a.u.guven}` : ""; };

function rows() {
  const q = st.q.toLowerCase();
  // Port 0 / boş: Carbon Black'te yerel portu olmayan gelen olaylar. Kullanıcı: aralarında çok iş uygulaması var, görünsün (kutucukla gizlenebilir)
  let r = st.data.satirlar.filter(x => (st.sifir || !sifir(x)) && (st.alt || !x.altyapi) && (st.dyn || !x.dinamik) && (st.genel || !x.genel) && (!st.durum || x.ertDurum === st.durum)
    && (!q || [x.ip, x.sunucu, x.segment, x.port, x.exe, x.yol, x.urun, aiText(x.ip, x.exe), ...x.ertUygulama, ...x.istemciler].some(v => (v || "").toLowerCase().includes(q))));
  const key = { ip: x => ipNum(x.ip) * 1e5 + (+x.port || 0), port: x => +x.port || 0, exe: x => x.exe.toLowerCase(), baglanti: x => x.baglanti, istemci: x => x.istemci,
    ert: x => ({ yok: 0, bos: 1, kayitli: 2 }[x.ertDurum]), son: x => x.son || "", ai: x => aiText(x.ip, x.exe).toLowerCase() || "\uffff" }[st.sort];
  r.sort((a, b) => { const A = key(a), B = key(b); return (A < B ? -1 : A > B ? 1 : 0) * (st.desc ? -1 : 1); });
  return r;
}

// AI tahmini ilerleme çubuğu (tarama çubuğuyla aynı görünüm): beklerken ve çalışırken
function aiBar() {
  if (!st.ai) return `<div class="run" style="margin-top:10px"><div><span class="spinner"></span> 🤖 AI tahmini hazırlanıyor…${st.aiHata ? ` <span class="small muted">(${esc(st.aiHata)})</span>` : ""}</div><div class="bar"><i style="width:3%"></i></div></div>`;
  if (!st.ai.calisiyor) return "";
  const pct = st.ai.toplam ? Math.round(100 * st.ai.biten / st.ai.toplam) : 3;
  return `<div class="run" style="margin-top:10px"><div><span class="spinner"></span> 🤖 AI iş uygulamalarını tahmin ediyor · <b>${st.ai.biten} / ${st.ai.toplam}</b> sunucu (%${pct})${st.ai.kayitli ? ` · ${st.ai.kayitli} sunucuda kayıtlı tahmin kullanıldı` : ""}${Object.keys(st.ai.hatalar || {}).length ? ` · <span style="color:var(--err)">${Object.keys(st.ai.hatalar).length} hata</span>` : ""}</div><div class="bar"><i style="width:${Math.max(pct, 3)}%"></i></div></div>`;
}
const sifir = x => !x.port || x.port === "0";
function render() {
  const d = st.data, all = d.satirlar.filter(x => !x.altyapi && !x.dinamik && !x.genel);
  const nSifir = d.satirlar.filter(sifir).length;
  const cb = d.sunucular.filter(s => s.cbVar).length, ertIp = d.sunucular.filter(s => s.ertPort > 0).length;
  const r = rows();
  const th = (k, t) => `<th data-sort="${k}" class="${st.sort === k ? "on" : ""}">${t}<span class="arr">${st.sort === k ? (st.desc ? "▼" : "▲") : "↕"}</span></th>`;
  let last = null;
  const body = r.map(x => {
    const first = x.ip !== last; last = x.ip;
    const ert = x.ertDurum === "kayitli" ? esc(x.ertUygulama.join(", ")) : x.ertDurum === "bos" ? `<span class="st bos">ERT'de adı boş</span>` : `<span class="st yok">ERT'de yok</span>`;
    return `<tr class="${first ? "grp" : "cont"}${x.altyapi || x.genel ? " alt" : ""}">
      <td class="ip ipc"><a href="./?ip=${encodeURIComponent(x.ip)}" target="_blank" rel="noopener" title="IP topolojisini aç">${esc(x.ip)}</a></td>
      <td class="hc">${esc(x.sunucu || "")}${d.tur === "etiket" && x.segment ? `<div class="small muted">${esc(x.segment)}</div>` : ""}${first && st.ai?.sonuclar?.[x.ip]?.ozet ? `<div class="small" style="margin-top:4px;max-width:260px" title="${esc(st.ai.sonuclar[x.ip].ozet)}">🤖 ${esc(st.ai.sonuclar[x.ip].ozet.length > 110 ? st.ai.sonuclar[x.ip].ozet.slice(0, 110) + "…" : st.ai.sonuclar[x.ip].ozet)}</div>` : ""}</td>
      <td class="mono"><b>${esc(x.port || "—")}</b>${sifir(x) ? ' <span class="small muted" title="Carbon Black bu olayda yerel port vermedi">port yok</span>' : ""}${x.altyapi ? ' <span class="small muted">altyapı</span>' : ""}${x.dinamik ? ' <span class="small muted">dinamik</span>' : ""}</td>
      <td title="${esc(x.yol)}"><b>${esc(x.exe)}</b>${x.urun ? `<span class="urun">${esc(x.urun)}</span>` : ""}<div class="small muted mono">${esc(x.yol.length > 70 ? "…" + x.yol.slice(-70) : x.yol)}</div></td>
      <td>${aiCell(x.ip, x.exe)}</td>
      <td>${fmt(x.baglanti)}</td>
      <td>${x.istemci}<div class="small muted">${esc(x.istemciler.slice(0, 3).join(", "))}${x.istemci > 3 ? " …" : ""}</div></td>
      <td>${ert}</td>
      <td class="small muted">${esc(x.son || "")}</td></tr>`;
  }).join("");
  const yok = d.sunucular.filter(s => !s.cbVar && s.ertPort > 0);
  const giden = d.giden.filter(g => st.genel || !g.genel);
  $("#res").innerHTML = `
    <div class="sub" style="margin-top:8px">${d.tur === "etiket" ? "Etiket " : ""}${esc(d.segment)}${d.cidrler.length ? " · " + esc(d.cidrler.join(", ")) : ""} · Carbon Black ${new Date(d.baslangic).toLocaleString("tr-TR")} – ${new Date(d.bitis).toLocaleString("tr-TR")} · ${(d.ms / 1000).toFixed(1)} sn</div>
    ${d.mesajlar.length ? `<div class="warn" style="margin-top:8px">${d.mesajlar.map(esc).join("<br>")}</div>` : ""}
    ${aiBar()}
    <div class="stats">
      <div class="stat"><b>${fmt(d.sunucular.length)}</b><span>IP</span></div>
      <div class="stat"><b>${fmt(cb)}</b><span>Carbon Black verisi olan</span></div>
      <div class="stat"><b>${fmt(ertIp)}</b><span>ERT'de kayıtlı IP</span></div>
      <div class="stat"><b>${fmt(all.length)}</b><span>Gelen port (iş)</span></div>
      <div class="stat"><b>${fmt(all.filter(x => x.ertDurum === "yok").length)}</b><span>ERT'de olmayan port</span></div>
      <div class="stat"><b>${fmt(all.filter(x => x.ertDurum === "bos").length)}</b><span>ERT'de adı boş</span></div>
      <div class="stat"><b>${fmt(new Set(all.map(x => x.exe.toLowerCase())).size)}</b><span>Farklı exe</span></div>
    </div>
    <div class="tools">
      <input type="search" id="q" placeholder="IP, sunucu, port, exe, yol, uygulama ara…" value="${esc(st.q)}" style="min-width:300px">
      <select id="durumF"><option value="">ERT: tümü</option><option value="yok">ERT'de yok</option><option value="bos">ERT'de adı boş</option><option value="kayitli">ERT'de kayıtlı</option></select>
      <label><input type="checkbox" id="altF" ${st.alt ? "checked" : ""}> Altyapı portları</label>
      <label title="49152 ve üstü (otomatik / dinamik)"><input type="checkbox" id="dynF" ${st.dyn ? "checked" : ""}> Dinamik portlar</label>
      <label title="svchost, splunkd, Trend Micro, Carbon Black gibi genel süreçler"><input type="checkbox" id="genelF" ${st.genel ? "checked" : ""}> Genel süreçler</label>
      <label title="Carbon Black'te yerel portu 0 / boş gelen olaylar; kaldırırsanız bu satırlar gizlenir"><input type="checkbox" id="sifirF" ${st.sifir ? "checked" : ""}> Port 0 (${fmt(nSifir)})</label>
      <span class="sp"></span>
      <span class="small muted">${fmt(r.length)} satır</span>
      ${!st.ai ? `<span class="small muted">🤖 AI tahmini bekleniyor…${st.aiHata ? ` (${esc(st.aiHata)})` : ""}</span>` : ""}
      ${st.ai ? `<span class="small" title="Tarama bitince her sunucunun iş exe'leri AI'a gider ve sonuç kaydedilir; kayıtlı tahmini olan ve yeni exe'si olmayan sunucu yeniden sorulmaz">🤖 ${st.ai.calisiyor ? `<span class="spinner"></span> AI tahmini: ${st.ai.biten} / ${st.ai.toplam} sunucu` : `AI tahmini: ${st.ai.toplam} sunucu soruldu`}${st.ai.kayitli ? ` · ${st.ai.kayitli} sunucuda kayıtlı tahmin kullanıldı` : ""}</span>` : ""}
      ${st.ai?.uyari ? `<span class="small" style="color:var(--warn)">${esc(st.ai.uyari)}</span>` : ""}
      ${st.ai && !st.ai.calisiyor && Object.keys(st.ai.hatalar || {}).length ? `<span class="small" style="color:var(--err)">${Object.keys(st.ai.hatalar).length} sunucuda AI hatası</span>` : ""}
      ${st.yetki.disari ? `<button id="csv" type="button">Excel'e aktar</button>` : ""}
    </div>
    <div class="grid"><table><thead><tr>${th("ip", "IP")}<th>Sunucu</th>${th("port", "Port")}${th("exe", "Program (exe)")}${th("ai", "AI tahmini")}${th("baglanti", "Bağlantı")}${th("istemci", "İstemci")}${th("ert", "ERT")}${th("son", "Son görülme")}</tr></thead>
      <tbody>${body || `<tr><td colspan="9" class="empty">Filtreye uyan gelen port yok.</td></tr>`}</tbody></table></div>
    <details data-k="giden" ${st.open.has("giden") ? "open" : ""} ${giden.length ? "" : "hidden"}><summary>Gelen bağlantısı görülmeyen programlar (yalnız giden) · ${fmt(giden.length)}</summary>
      <div class="grid" style="margin-top:8px;max-height:400px"><table><thead><tr><th>IP</th><th>Sunucu</th><th>Program</th><th>AI tahmini</th><th>Giden bağlantı</th><th>Gittiği yerler</th></tr></thead><tbody>
      ${giden.map(g => `<tr><td class="ip"><a href="./?ip=${encodeURIComponent(g.ip)}" target="_blank" rel="noopener">${esc(g.ip)}</a></td><td>${esc(g.sunucu || "")}</td>
        <td title="${esc(g.yol)}"><b>${esc(g.exe)}</b>${g.urun ? `<span class="urun">${esc(g.urun)}</span>` : ""}</td><td>${aiCell(g.ip, g.exe)}</td><td>${fmt(g.baglanti)}</td><td class="small">${esc(g.hedefler.join(", "))}</td></tr>`).join("")}
      </tbody></table></div></details>
    <details data-k="yok" ${st.open.has("yok") ? "open" : ""} ${yok.length ? "" : "hidden"}><summary>ERT'de kayıtlı ama bu aralıkta Carbon Black verisi olmayan sunucular · ${fmt(yok.length)}</summary>
      <div class="small" style="margin-top:8px">${yok.map(s => `<span class="chips"><span class="mono">${esc(s.ip)}</span></span> ${esc(s.sunucu || "")} <span class="muted">${esc(s.ertUygulamalar.join(", "))}</span>`).join("<br>")}</div>
      <div class="small muted" style="margin-top:6px">Carbon Black ajanı olmayabilir, sunucu kapalı olabilir ya da bu aralıkta ağ olayı olmamış olabilir.</div></details>`;
  $("#durumF").value = st.durum;
  $("#q").addEventListener("input", e => { st.q = e.target.value; render(); $("#q").focus(); $("#q").setSelectionRange(st.q.length, st.q.length); });
  $("#durumF").addEventListener("change", e => { st.durum = e.target.value; render(); });
  $("#altF").addEventListener("change", e => { st.alt = e.target.checked; render(); });
  $("#dynF").addEventListener("change", e => { st.dyn = e.target.checked; render(); });
  $("#genelF").addEventListener("change", e => { st.genel = e.target.checked; render(); });
  $("#sifirF").addEventListener("change", e => { st.sifir = e.target.checked; render(); });
  $("#csv")?.addEventListener("click", csv);
  document.querySelectorAll("#res details[data-k]").forEach(x => x.addEventListener("toggle", () => x.open ? st.open.add(x.dataset.k) : st.open.delete(x.dataset.k)));
  document.querySelectorAll("th[data-sort]").forEach(h => h.addEventListener("click", () => {
    if (st.sort === h.dataset.sort) st.desc = !st.desc; else { st.sort = h.dataset.sort; st.desc = ["baglanti", "istemci", "son"].includes(st.sort); }
    render();
  }));
}

function csv() {
  if (!st.yetki.disari) return alert("Dışa aktarma yetkiniz yok. Yetki DokuPanel'den verilir.");
  const C = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = ["IP;SUNUCU;SEGMENT;PORT;EXE;YOL;BİLİNEN ÜRÜN;AI TAHMİNİ;AI ERT KARŞILIĞI;AI GÜVEN;AI SUNUCU ÖZETİ;BAĞLANTI;İSTEMCİ SAYISI;İSTEMCİLER;ERT DURUMU;ERT UYGULAMASI;SON GÖRÜLME"]
    .concat(rows().map(x => { const a = aiOf(x.ip, x.exe); return [x.ip, x.sunucu, x.segment, x.port, x.exe, x.yol, x.urun,
      a?.u?.uygulama, a?.u?.ertKarsiligi, a?.u ? a.u.guven : "", a?.ozet, x.baglanti, x.istemci, x.istemciler.join(", "),
      { yok: "ERT'de yok", bos: "ERT'de adı boş", kayitli: "kayıtlı" }[x.ertDurum], x.ertUygulama.join(", "), x.son].map(C).join(";"); }));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" }));
  a.download = `DeltaFlow_segment_${st.data.segment.replace(/[^\w.-]+/g, "_")}.csv`;
  a.click();
}

$("#tara").addEventListener("click", start);
$("#tur").addEventListener("change", e => { st.tur = e.target.value; $("#seg").value = ""; fillList(); });
$("#seg").addEventListener("keydown", e => { if (e.key === "Enter") start(); });
$("#seg").addEventListener("input", segInfo);
$("#dur").addEventListener("click", async () => { if (st.job) { await fetch(`api/segment/tarama/${st.job}/durdur`, { method: "POST" }); } });
fetch("api/me").then(r => r.ok ? r.json() : null).then(me => {
  if (me?.name) $("#me").textContent = "👤 " + me.name;
  st.yetki = me?.yetki || {};
  if (!st.yetki.topoloji) { $("#tara").disabled = true; $("#tara").title = "Segment tarama için topoloji yetkisi gerekir (DokuPanel)."; }
  if (st.data) render();
}).catch(() => {});
const p = new URLSearchParams(location.search);
if (p.get("etiket")) { st.tur = "etiket"; $("#tur").value = "etiket"; $("#seg").value = p.get("etiket"); }
else if (p.get("segment")) $("#seg").value = p.get("segment");
if (p.get("saat")) $("#saat").value = p.get("saat");
loadSegs();
fetch("api/surum").then(r => r.ok ? r.json() : null).then(v => { st.surum = v; $("#surum").textContent = v ? "sunucu sürümü " + v.surum : "eski sunucu sürümü (DLL güncel değil)"; }).catch(() => {});
</script>
</body>
</html>
