<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeltaFlow · Segment tarama</title>
<link rel="icon" href="deltaflow.svg">
<script>
  try { const t = localStorage.getItem("deltaflow.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<!--
  Segment tarama (Segment.cs): verilen segmentteki tüm IP'lerin Carbon Black'te görülen gelen portları ve o portu kabul eden exe'ler
  (ERT'den bağımsız); ERT yalnız karşılaştırma (kayıtlı / adı boş / yok). Tarama arka plan işi, sayfa durumu sorgular.
-->
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1d2330; --muted: #677084; --line: #dde1e8;
    --in: #2f6fd6; --in-soft: #e5eefc; --ok: #2e8b57; --err: #c8353a; --warn: #b7791f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171d; --panel: #1c2028; --text: #e4e7ec; --muted: #9098a8; --line: #2d333e;
      --in: #6ea0f0; --in-soft: #1f2d45; --ok: #5cc28a; --err: #ef6b6f; --warn: #e0b050;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171d; --panel: #1c2028; --text: #e4e7ec; --muted: #9098a8; --line: #2d333e;
    --in: #6ea0f0; --in-soft: #1f2d45; --ok: #5cc28a; --err: #ef6b6f; --warn: #e0b050;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  header img { width: 30px; height: 30px; }
  header h1 { margin: 0; font-size: 19px; }
  header a { color: var(--muted); text-decoration: none; font-size: 13px; }
  header a:hover { color: var(--in); }
  header .sp { flex: 1; }
  #me { font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
  main { padding: 18px 20px 40px; max-width: 1700px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; min-width: 120px; background: var(--bg); }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
  input, select, button, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--in); border-color: var(--in); color: #fff; font-weight: 600; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 4px 0 12px; }
  .tools .sp { flex: 1; }
  .tools label { display: flex; gap: 6px; align-items: center; font-size: 13px; }
  .warn { border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); border-radius: 10px; padding: 9px 14px; margin-bottom: 12px; font-size: 13px; }
  .run { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; background: var(--bg); display: grid; gap: 6px; font-size: 13px; }
  .run .bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .run .bar i { display: block; height: 100%; background: var(--in); transition: width .4s; }
  .grid { border: 1px solid var(--line); border-radius: 10px; overflow: auto; max-height: calc(100vh - 330px); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th[data-sort], th [data-sort] { cursor: pointer; user-select: none; }
  th .arr { margin-left: 3px; opacity: .35; }
  th .on > .arr, th.on > .arr { opacity: 1; color: var(--in); }
  th .sub2 { font-weight: 500; text-transform: none; letter-spacing: 0; margin-left: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; }
  th .sub2.on { border-color: var(--in); color: var(--in); }
  th { position: sticky; top: 0; background: var(--bg); color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); z-index: 1; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:hover td { background: var(--in-soft); }
  tr.alt td { color: var(--muted); }
  .mono { font-family: Consolas, ui-monospace, monospace; }
  .ip a { font-family: Consolas, ui-monospace, monospace; font-weight: 600; color: var(--text); text-decoration: none; }
  .ip a:hover { color: var(--in); text-decoration: underline; }
  .chips span { display: inline-block; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; margin: 1px 3px 1px 0; font-size: 12px; }
  .small { font-size: 12px; } .muted { color: var(--muted); }
  .sug b { font-size: 13.5px; }
  .sug .why { color: var(--muted); font-size: 12px; margin-top: 2px; max-width: 520px; }
  .conf { display: inline-block; width: 46px; height: 6px; border-radius: 9px; background: var(--line); vertical-align: middle; margin: 0 6px; overflow: hidden; }
  .conf i { display: block; height: 100%; }
  .st { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px; border: 1px solid; }
  .st.ai { color: var(--in); border-color: var(--in); }
  .st.ok { color: var(--ok); border-color: var(--ok); }
  .st.red { color: var(--err); border-color: var(--err); }
  .st.new { color: var(--warn); border-color: var(--warn); }
  .acts { white-space: nowrap; }
  .acts button { padding: 2px 8px; font-size: 12px; }
  button.mini { padding: 1px 7px; font-size: 12px; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; color: var(--muted); font-size: 12.5px; gap: 10px; flex-wrap: wrap; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--in); border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -2px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100vw); background: var(--panel); border-left: 1px solid var(--line);
    box-shadow: -12px 0 32px rgba(0,0,0,.18); z-index: 50; display: flex; flex-direction: column; }
  .drawer .dh { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: start; }
  .drawer .dh h3 { margin: 0; font-size: 17px; }
  .drawer pre { margin: 0; padding: 14px 18px; overflow: auto; white-space: pre-wrap; font-size: 12px; line-height: 1.5; flex: 1; }
  .st.yok { color: var(--err); border-color: var(--err); }
  .st.bos { color: var(--warn); border-color: var(--warn); }
  .urun { display: inline-block; font-size: 11px; font-weight: 700; color: var(--in); border: 1px solid var(--in); border-radius: 4px; padding: 0 5px; margin-left: 4px; }
  tr.grp td { border-top: 2px solid var(--line); }
  tr.cont td.ipc a, tr.cont td.hc { opacity: .35; }
  details { margin-top: 14px; } summary { cursor: pointer; font-weight: 600; }
  .segrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #seg { min-width: 360px; }
  .vt { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .vt button { border: 0; border-radius: 0; padding: 6px 14px; }
  .vt button.on { background: var(--in); color: #fff; font-weight: 600; }
  .kurumSec { position: relative; } .kurumSec summary { list-style: none; cursor: pointer; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font-size: 13px; }
  .kurumPop { position: absolute; z-index: 30; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: grid; gap: 4px; min-width: 240px; max-height: 320px; overflow: auto; box-shadow: 0 10px 28px rgba(0,0,0,.15); font-size: 13px; }
  .drawer { width: min(820px, 100vw); }
  #agSvg .agok { fill: none; stroke: color-mix(in srgb, var(--muted) 55%, transparent); }
  #agSvg .agok.geri { stroke-dasharray: 5 4; }
  #agSvg .agok.on { stroke: var(--in); }
  #agSvg .aghit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
  #agSvg .aghit:hover + .agok, #agSvg .aghit:hover { stroke: color-mix(in srgb, var(--in) 25%, transparent); }
  #agSvg .agkutu { cursor: pointer; }
  #agSvg .agkutu rect:first-child { fill: var(--panel); stroke-width: 1.5; }
  #agSvg .agkutu.on rect:first-child, #agSvg .agkutu:hover rect:first-child { stroke-width: 3; }
  #agSvg .aggizle { opacity: 0; cursor: pointer; } #agSvg .agkutu:hover .aggizle { opacity: 1; }
  #agSvg .aggizle circle { fill: var(--bg); stroke: var(--line); } #agSvg .aggizle text { font-size: 13px; fill: var(--err); font-weight: 700; }
  #agSvg .agad { font-size: 13.5px; font-weight: 700; fill: var(--text); }
  #agSvg .agalt { font-size: 11.5px; fill: var(--muted); }
</style>
</head>
<body>
<header>
  <img src="deltaflow.svg" alt="">
  <div><h1>Segment / etiket tarama · gelen portlar ve exe'ler</h1>
    <div class="sub">Segmentteki ya da etiketteki bütün IP'lerin Carbon Black'te görülen gelen portları ve o portu kabul eden programlar · ERT ile karşılaştırma</div></div>
  <span class="sp"></span>
  <a href="eksik.html">ERT eksikleri ↗</a>
  <a href="./">← DeltaFlow</a>
  <span id="surum" class="small muted"></span>
  <span id="me"></span>
</header>
<main>
  <section class="panel">
    <div class="segrow">
      <select id="tur" title="Neye göre taransın"><option value="segment">Segment</option><option value="etiket">Etiket</option></select>
      <input id="seg" list="segList" placeholder="Segment adı ya da CIDR (ör. 10.1.2.0/24)" autocomplete="off">
      <datalist id="segList"></datalist>
      <label class="small muted">Carbon Black aralığı <select id="saat"><option value="1">1 saat</option><option value="6">6 saat</option>
        <option value="24" selected>24 saat</option><option value="72">3 gün</option><option value="168">7 gün</option></select></label>
      <button id="tara" class="primary">Tara</button>
      <button id="dur" hidden>Durdur</button>
      <span id="segInfo" class="small muted"></span>
    </div>
    <div id="warn" style="margin-top:12px"></div>
    <div id="run"></div>
    <div id="res"></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Number(n || 0).toLocaleString("tr-TR");
const st = { view: "port", bz: null, bzAyni: 0.6, bzYakin: 0.35, bzSec: new Set(), ai: null, aiTimer: null, open: new Set(), tur: "segment", tags: [], segs: [], job: null, data: null, timer: null, yetki: {}, q: "", alt: false, dyn: false, genel: false, sifir: true, durum: "", sort: "ip", desc: false };
const ipNum = ip => ip.split(".").reduce((a, b) => a * 256 + +b, 0);

async function api(url, opt) {
  const r = await fetch(url, opt);
  const b = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok) throw new Error(b.error || `HTTP ${r.status}`);
  return b;
}

async function loadSegs() {
  try {
    [st.segs, st.tags] = await Promise.all([api("api/segment/liste"), api("api/etiketler").then(b => b.etiketler || []).catch(() => [])]);
    await loadKayit();
    fillList();
  } catch (e) { $("#warn").innerHTML = `<div class="warn">Segment listesi alınamadı: ${esc(e.message)}</div>`; }
}
// Segment ya da etiket listesi (etiket: ana etiket seçilince alt etiketli sunucular da gelir)
function fillList() {
  $("#seg").placeholder = st.tur === "etiket" ? "Etiket (ör. VERIAMBARI ya da MOBILBANKACILIK/MOBIL APP)" : "Segment adı ya da CIDR (ör. 10.1.2.0/24)";
  $("#segList").innerHTML = st.tur === "etiket"
    ? st.tags.map(t => `<option value="${esc(t.ad)}">${t.sunucu} sunucu${t.aciklama ? " · " + esc(t.aciklama) : ""}</option>`).join("")
    : st.segs.map(s => `<option value="${esc(s.ad)}">${esc(s.cidrler.join(", "))}${s.kurum ? " · " + esc(s.kurum) : ""} · ERT'de ${s.ertSunucu} sunucu</option>`).join("");
  segInfo();
}
// Kayıtlı taramalar (tür + ad başına son tarama): seçilen segment / etiketin kaydı varsa "Tara" kayıttan açar
async function loadKayit() {
  try { const b = await api("api/segment/kayitlar"); st.kayitlar = b.kayitlar || []; st.kayitUyari = b.uyari; } catch { st.kayitlar = []; }
}
const kayitOf = (tur, ad) => (st.kayitlar || []).find(k => k.tur === tur && k.ad.toLowerCase() === String(ad || "").trim().toLowerCase());
const tarihTr = t => t ? new Date(t).toLocaleString("tr-TR", { dateStyle: "short", timeStyle: "short" }) : "";
function segInfo() {
  const v = $("#seg").value.trim().toLowerCase();
  const k = kayitOf(st.tur, v);
  const kt = k ? ` · 📁 kayıtlı tarama ${tarihTr(k.tarih)} (${k.saat} saat, ${k.sunucu} sunucu) — Tara kayıttan açar` : "";
  $("#tara").textContent = k ? "Aç (kayıtlı)" : "Tara";
  if (st.tur === "etiket") { const t = st.tags.find(x => x.ad.toLowerCase() === v); $("#segInfo").textContent = (t ? `${t.sunucu} sunucu` : "") + kt; return; }
  const s = st.segs.find(x => x.ad.toLowerCase() === v);
  $("#segInfo").textContent = (s ? `${s.cidrler.join(", ")} · ERT'de ${s.ertSunucu} sunucu` : /\/\d+$/.test(v) ? "CIDR" : "") + kt;
}

async function start(mod) {
  if (typeof mod !== "string") mod = "";
  const seg = mod && st.jobInfo ? st.jobInfo.adGirdi : $("#seg").value.trim();
  if (!seg) return alert(st.tur === "etiket" ? "Etiket girin." : "Segment adı ya da CIDR girin.");
  $("#warn").innerHTML = ""; $("#res").innerHTML = "";
  try {
    const j = await api("api/segment/tarama", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ [st.tur]: seg, saat: +$("#saat").value, mod }) });
    j.adGirdi = seg; st.jobInfo = j;
    st.job = j.id; st.ag = null; st.on = {}; st.ed = null; st.edMsg = null; st.bz = null; clearTimeout(st.aiTimer);
    history.replaceState(null, "", "?" + new URLSearchParams({ [st.tur]: seg, saat: $("#saat").value }));
    poll(j);
  } catch (e) { $("#warn").innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
}

async function poll(j) {
  clearTimeout(st.timer);
  if (!j) { try { j = await api("api/segment/tarama/" + st.job); } catch (e) { $("#warn").innerHTML = `<div class="warn">${esc(e.message)}</div>`; return; } }
  const pct = j.toplam ? Math.round(100 * j.biten / j.toplam) : 0;
  $("#tara").disabled = j.calisiyor; $("#dur").hidden = !j.calisiyor;
  $("#run").innerHTML = j.calisiyor ? `<div class="run"><div><span class="spinner"></span> <b>${esc(j.segment)}</b> · ${esc(j.asama)}</div><div class="bar"><i style="width:${pct}%"></i></div></div>`
    : j.hata ? `<div class="warn">Tarama başarısız: ${esc(j.hata)}</div>` : j.asama === "Durduruldu" ? `<div class="warn">Durduruldu.</div>` : "";
  if (j.calisiyor) { st.timer = setTimeout(() => poll(), 2000); return; }
  if (st.jobInfo && j.id === st.jobInfo.id) st.jobInfo = { ...j, adGirdi: st.jobInfo.adGirdi };
  // Yeni taramada önerisi olmayan portlar kendiliğinden sorulur; kayıttan açılınca (kullanıcı: "Aç kayıtlı'ya basınca doğrudan AI devreye girdi")
  // yalnız kayıtlı öneriler gösterilir, sormak için araç çubuğundaki düğme ya da satırdaki ↻
  if (j.sonuc) { st.data = j.sonuc; if (j.kayit) loadKayit().then(segInfo); render(); loadOneri().then(() => { render(); if (j.asama !== "Kayıttan açıldı") aiBaslat(); else aiWatch(true); }); }
}

// ---- AI önerisi: ERT eksikleriyle AYNI motor ve kayıt (Eksik.cs; kullanıcı: "buradaki AI tahmini eksik.cs'deki olmalı, aynı yapı: silme,
// tekrar AI'a sorma") — (IP, port) başına öneri, durum AI / Onaylandı / Reddedildi / Elle; onaylanan / elle girilene AI dokunmaz.
// Sorulan: iş süreci (genel / altyapı / dinamik değil), gerçek portu olan ve ERT'de adı boş ya da hiç kaydı olmayan satırlar.
const aiGerek = x => !x.genel && !x.altyapi && !x.dinamik && !sifir(x) && x.ertDurum !== "kayitli";
const oneriOf = x => st.on?.[x.ip]?.[x.port] || null;
function aiHedef(sadeceYeni) {
  const h = {};
  for (const x of st.data.satirlar.filter(aiGerek)) if (!sadeceYeni || !oneriOf(x)) (h[x.ip] ||= []).includes(x.port) || h[x.ip].push(x.port);
  return h;
}
async function loadOneri() {
  try { st.on = await api("api/eksik/oneriler", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ips: st.data.sunucular.map(s => s.ip) }) }); }
  catch (e) { st.edMsg = "AI önerileri okunamadı: " + e.message; }
}
// Önerisi olmayan portlar kendiliğinden sorulur (kayıtlı olanlar sorulmaz); yeniden=true + portlar: satırdaki "↻ tekrar sor"
async function aiBaslat(yeniden = false, portlar = null) {
  clearTimeout(st.aiTimer);
  await st.surumP;
  // Eski DLL'de /api/eksik/calistir "portlar"ı tanımaz ve TÜM ERT eksiklerini çalıştırırdı: göndermeden uyar
  if (!st.surum?.eksikPortlar) { st.edMsg = `Sunucudaki DeltaFlow sürümü (${st.surum.surum || "?"}) bu sayfadan eski; AI önerisi için Eksik.cs, Segment.cs ve Program.cs ile yeniden derleyip yayınlayın.`; render(); return; }
  if (!st.yetki.yazma) { st.edMsg = "AI önerisi istemek için yazma yetkisi gerekir (DokuPanel); kayıtlı öneriler gösteriliyor."; render(); return; }
  let h = portlar || aiHedef(true), ips = Object.keys(h);
  if (!ips.length) { st.edMsg = null; render(); return; }
  let kalan = 0;
  if (!st.yetki.toplu && ips.length > 50) { kalan = ips.length - 50; h = Object.fromEntries(ips.slice(0, 50).map(ip => [ip, h[ip]])); }
  try {
    st.ed = await api("api/eksik/calistir", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ portlar: h, yeniden, saat: st.data.saat }) });
    st.edMsg = kalan ? `Bu çalıştırmada 50 sunucu soruluyor; ${kalan} sunucu sonraki açılışta (50'den çok sunucu için toplu yetki gerekir).` : null;
    st.edBekle = false;
  } catch (e) {
    if (/zaten çalışıyor/.test(e.message)) { st.edMsg = "Başka bir ERT eksikleri AI işi çalışıyor; bitince bu segmentin portları kendiliğinden sorulacak."; st.edBekle = true; }
    else { st.edMsg = "AI önerisi başlatılamadı: " + e.message; render(); return; }
  }
  render(); aiWatch();
}
async function aiWatch(tekSefer = false) {
  clearTimeout(st.aiTimer);
  try { st.ed = await api("api/eksik/durum"); } catch { if (!tekSefer) st.aiTimer = setTimeout(aiWatch, 5000); return; }
  if (tekSefer && !st.ed.calisiyor) { render(); return; }
  await loadOneri(); render();
  if (st.ed.calisiyor) { st.aiTimer = setTimeout(aiWatch, 3000); return; }
  if (st.edBekle) { st.edBekle = false; aiBaslat(); }
}
const aiText = x => { const o = oneriOf(x); return o ? `${o.uygulama || "öneri yok"} %${o.guven} ${o.durum}` : ""; };
function aiCell(x) {
  if (!aiGerek(x)) return x.ertDurum === "kayitli" && !x.genel ? `<span class="small muted" title="ERT'de bu port için uygulama adı var">ERT'de kayıtlı</span>`
    : sifir(x) && !x.genel ? `<span class="small muted" title="ERT eksikleri port bazında çalışır; bu olayda yerel port yok">port yok</span>` : `<span class="small muted">—</span>`;
  const o = oneriOf(x), w = st.yetki.yazma, d = `data-ip="${esc(x.ip)}" data-port="${esc(x.port)}"${w ? "" : ` disabled title="Yazma yetkisi gerekir (DokuPanel)"`}`;
  const tekrar = `<button class="mini" data-ak="tekrar" ${d} title="Bu portu AI'a ${o ? "yeniden " : ""}sor (kanıtlar yeniden toplanır)">↻${o ? "" : " AI'a sor"}</button>`;
  if (!o) return `<span class="small muted">${st.ed?.calisiyor ? "sırada / soruluyor…" : "önerisi yok"}</span> ${tekrar} <button class="mini" data-ak="elle" ${d} title="Uygulama adını elle yaz">✎</button>`;

    ${gr ? `<div class="why" title="${esc(gr)}">${esc(gr.length > 140 ? gr.slice(0, 140) + "…" : gr)}</div>` : ""}${o.durum !== "AI" && o.kaynak ? `<div class="why">${esc(o.kaynak)}</div>` : ""}
    <div class="acts" style="margin-top:3px">${o.uygulama && o.durum === "AI" ? `<button class="mini" data-ak="onay" ${d} title="Öneriyi onayla">✓ onay</button> ` : ""}${o.durum !== "Reddedildi" ? `<button class="mini" data-ak="red" ${d} title="Reddet">✗ ret</button> ` : ""}<button class="mini" data-ak="elle" ${d} data-cur="${esc(o.uygulama || "")}" title="Uygulama adını elle yaz">✎ elle</button> <button class="mini" data-ak="sil" ${d} title="Öneriyi ve kararı sil (sonra yeniden sorulabilir)">🗑 sil</button> ${o.durum === "Onaylandı" || o.durum === "Elle" ? "" : tekrar} <a href="#" class="small" data-kanit="${esc(x.ip)}">kanıtlar</a></div></div>`;

// Satırdaki işlemler: onay / ret / elle / sil (ERT eksikleriyle aynı /api/eksik/karar) ve tekrar sor
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-ak]"), kn = e.target.closest("[data-kanit]");
  if (kn) { e.preventDefault(); return kanitAc(kn.dataset.kanit); }
  if (!b) return;
  const { ak, ip, port, cur } = b.dataset;
  if (ak === "tekrar") return aiBaslat(true, { [ip]: [port] });
  let uygulama = null;
  if (ak === "elle") { uygulama = prompt(`${ip}:${port} için uygulama adı (ERT'deki adla aynı yazılırsa eşleşir):`, cur || ""); if (!uygulama?.trim()) return; }
  if (ak === "sil" && !confirm(`${ip}:${port} önerisi ve kararı silinsin mi?`)) return;
  try { await api("api/eksik/karar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ip, port, karar: ak, uygulama }) }); await loadOneri(); render(); }
  catch (er) { alert(er.message); }
});
async function kanitAc(ip) {
  document.querySelector(".drawer")?.remove();
  const d = document.createElement("div"); d.className = "drawer";
  d.innerHTML = `<div class="dh"><div><h3>AI'a giden kanıtlar · ${esc(ip)}</h3><div class="sub">ERT eksikleriyle aynı kanıt metni (son AI çalıştırmasında kaydedilen)</div></div><button type="button">Kapat</button></div><pre>yükleniyor…</pre>`;
  d.querySelector("button").onclick = () => d.remove();
  document.body.appendChild(d);
  try { d.querySelector("pre").textContent = (await api("api/eksik/kanit?ip=" + encodeURIComponent(ip))).metin || "(kanıt yok)"; }
  catch (er) { d.querySelector("pre").textContent = er.message; }

function rows() {
  const q = st.q.toLowerCase();
  // Port 0 / boş: Carbon Black'te yerel portu olmayan gelen olaylar. Kullanıcı: aralarında çok iş uygulaması var, görünsün (kutucukla gizlenebilir)
  let r = st.data.satirlar.filter(x => (st.sifir || !sifir(x)) && (st.alt || !x.altyapi) && (st.dyn || !x.dinamik) && (st.genel || !x.genel) && (!st.durum || x.ertDurum === st.durum)
    && (!q || [x.ip, x.sunucu, x.segment, x.port, x.exe, x.yol, x.urun, aiText(x), nsText(x.ip, x.port), ...x.ertUygulama, ...x.istemciler].some(v => (v || "").toLowerCase().includes(q))));
  const key = { ip: x => ipNum(x.ip) * 1e5 + (+x.port || 0), port: x => +x.port || 0, exe: x => x.exe.toLowerCase(), baglanti: x => x.baglanti, istemci: x => x.istemci,
    ert: x => ({ yok: 0, bos: 1, kayitli: 2 }[x.ertDurum]), son: x => x.son || "", ns: x => nsText(x.ip, x.port).toLowerCase() || "\uffff", ai: x => aiText(x).toLowerCase() || "\uffff" }[st.sort];
  r.sort((a, b) => { const A = key(a), B = key(b); return (A < B ? -1 : A > B ? 1 : 0) * (st.desc ? -1 : 1); });
  return r;
}

    ${p.sertifika.length ? `<div class="small mono">🔒 ${esc(p.sertifika.slice(0, 2).join(", "))}${p.sertifika.length > 2 ? " …" : ""}</div>` : ""}${p.dinleyen ? `<div class="small muted mono">${esc(p.dinleyen.split(/[\\/]/).pop())}</div>` : ""}</div>`;

const nsHost = ip => { const n = st.data.nessus?.[ip]; return n ? `<div class="small muted" title="Nessus son tarama ${esc(n.son || "")}${n.kimlikli ? " · kimlik bilgili" : n.kimlikli === false ? " · kimlik bilgisiz" : ""}">${esc(n.os || "Nessus")}${n.kimlikli === false ? " · dış tarama" : ""}

// ---- Benzer sunucular (Benzer.cs): exe / port / trafik / Nessus parmak izi → aynı amaçlı, yakın amaçlı, alakasız ----

// ---- Exe ilişki ağı (kullanıcı: "çok karmaşık; her exe tek kutu, dış istemci tek, bağlantıya tıklayınca sağda panel"): /api/segment/exeag
// (ExeAgi.cs) verisi kutu = exe olarak toplanır; tüm dış istemciler tek kutu; sütunlar soldan sağa akış sırası (istemciler → exe'ler → dış hedefler)
async function loadAg() {
  if (!st.data?.baglar) { st.ag = { eski: true }; render(); return; }
  st.ag = { loading: true }; render();
  try {
    const q = st.jobInfo?.kayit ? { tur: st.jobInfo.kayit.tur, ad: st.jobInfo.kayit.ad } : { id: st.job };
    st.agRaw = await api("api/segment/exeag?" + new URLSearchParams({ ...q, ...(st.agGenel ? { genel: "true" } : {}) }));
    st.ag = agHazirla(st.agRaw);
  } catch (e) { st.ag = { error: e.message }; }

}
// Kurum (segment Domain) seçimi: yalnız seçili kurumlardaki sunucuların exe'leri; dış hedef / istemciler bağlı oldukları sürece kalır
const KURUMSUZ = "(kurum yok)";
const agKurumlar = k => { const m = new Map(); for (const ku of k.kumeler) for (const e of ku.elemanlar) if (e.id.startsWith("x:")) { const d = e.kurum || KURUMSUZ; (m.get(d) || m.set(d, new Set()).get(d)).add(e.ip); } return [...m].map(([ad, ips]) => ({ ad, n: ips.size })).sort((a, b) => b.n - a.n); };
function agHazirla(k) {
  const node = new Map(), elNode = {}, el = {}, sec = st.agKurum?.size ? st.agKurum : null;
  const N = (key, ad, tur, aciklama) => node.get(key) || node.set(key, { key, ad, tur, aciklama, sunucu: new Set(), uyg: new Set(), gelen: 0, giden: 0 }).get(key);
  for (const ku of k.kumeler) for (const e of ku.elemanlar) {
    const ist = e.id.startsWith("c:"), dis = e.id.startsWith("d:");
    if (sec && !ist && !dis && !sec.has(e.kurum || KURUMSUZ)) continue;
    const n = ist ? N("__ist", "Dış istemciler", "ist", "Taranan exe'lere bağlanan, istemci exe'si bilinmeyen sunucular") : N(ku.ad, ku.ad, dis ? "dis" : "exe", ku.aciklama);
    n.sunucu.add(e.ip); if (e.uygulama) n.uyg.add(e.uygulama); (n.el ||= []).push(e);
    elNode[e.id] = n.key; el[e.id] = e;
  }
  const edge = new Map();
  for (const b of k.baglar) {
    const f = elNode[b.from], t = elNode[b.to];
    if (!f || !t || f === t) continue;
    const x = edge.get(f + "\u0000" + t) || edge.set(f + "\u0000" + t, { f, t, hits: 0, portlar: new Set(), altyapi: true, satir: [] }).get(f + "\u0000" + t);
    x.hits += b.hits; b.portlar.forEach(p => x.portlar.add(p)); x.altyapi &&= b.altyapi;
    x.satir.push({ from: el[b.from], to: el[b.to], portlar: b.portlar, hits: b.hits });
    node.get(f).giden += b.hits; node.get(t).gelen += b.hits;

  return { nodes: [...node.values()].filter(n => n.tur === "exe" || bagli.has(n.key)), edges: [...edge.values()], sec: null, kurumlar: agKurumlar(k) };
}
// Yerleşim: istemciler 0. sütun; exe'ler gelen bağlarına göre en uzun yol derinliği (döngüde sınırlı); dış hedefler en sağ; bağsızlar listede
// Gizlenen kutular (kullanıcı: "bazı exe'leri çıkartabileyim: SiteScope, dış istemci ya da herhangi bir kutu"): tarayıcıda hatırlanır
// (localStorage df.agGizli, kutu adı küçük harf) — başka segmentte de aynı adlı kutu gizli açılır
st.agGizli = new Set((() => { try { return JSON.parse(localStorage.getItem("df.agGizli") || "[]"); } catch { return []; } })());
const agGizliMi = key => st.agGizli.has(String(key).toLowerCase());
function agGizle(key, gizle) {
  const k = String(key).toLowerCase();
  gizle ? st.agGizli.add(k) : st.agGizli.delete(k);
  try { localStorage.setItem("df.agGizli", JSON.stringify([...st.agGizli])); } catch { /* tarayıcı izin vermezse yalnız bu oturum */ }
  if (st.ag) st.ag.sec = null;
  document.querySelector(".drawer")?.remove(); render();
}
function agYerlesim(g, infra) {
  const E = g.edges.filter(e => (infra || !e.altyapi) && !agGizliMi(e.f) && !agGizliMi(e.t)), bagli = new Set(E.flatMap(e => [e.f, e.t]));
  const nodes = g.nodes.filter(n => bagli.has(n.key)), d = {};
  nodes.forEach(n => d[n.key] = n.tur === "ist" ? 0 : 1);
  for (let i = 0; i < nodes.length; i++) {
    let deg = false;
    for (const e of E) if (g.nodes.find(n => n.key === e.t)?.tur === "exe" && d[e.t] < d[e.f] + 1 && d[e.f] + 1 <= 8) { d[e.t] = d[e.f] + 1; deg = true; }
    if (!deg) break;
  }
  const maxExe = Math.max(1, ...nodes.filter(n => n.tur === "exe").map(n => d[n.key]));
  nodes.filter(n => n.tur === "dis").forEach(n => d[n.key] = maxExe + 1);
  const cols = [];
  nodes.forEach(n => (cols[d[n.key]] ||= []).push(n));
  const C = cols.filter(Boolean), W = 230, H = 54, GX = 110, GY = 18, pos = {};
  C.forEach((col, ci) => {
    // aynı sütunda: önceki sütundaki bağlı kutuların ortalama sırasına göre (çizgiler az kesişsin)
    if (ci > 0) col.forEach(n => { const ins = E.filter(e => e.t === n.key && pos[e.f]); n._b = ins.length ? ins.reduce((a, e) => a + pos[e.f].y, 0) / ins.length : 1e9; });
    else col.sort((a, b) => b.giden - a.giden);
    if (ci > 0) col.sort((a, b) => a._b - b._b || b.gelen - a.gelen);
    col.forEach((n, i) => pos[n.key] = { x: 20 + ci * (W + GX), y: 20 + i * (H + GY), w: W, h: H });
  });
  const Hh = Math.max(...Object.values(pos).map(p => p.y + p.h), 100) + 20, Ww = 20 + C.length * (W + GX) - GX + 20;
  return { E, pos, W: Ww, H: Hh, bagsiz: g.nodes.filter(n => !bagli.has(n.key) && n.tur === "exe" && !agGizliMi(n.key)) };
}
function renderAg() {

  else if (g.eski) body = `<div class="warn">Bu tarama exe ilişki ağı verisi içermiyor (bu özellikten önce kaydedilmiş). ${st.yetki.topoloji ? `<button type="button" id="agYeni">🔄 Yeniden çek</button>` : ""}</div>`;
  else if (g.error) body = `<div class="warn">Exe ağı hazırlanamadı: ${esc(g.error)}</div>`;
  else {
    const L = agYerlesim(g, st.agInfra), maxH = Math.max(1, ...L.E.map(e => e.hits));
    const renk = { exe: "var(--in)", dis: "var(--warn)", ist: "var(--muted)" };
    // Uç noktaları: bir kutudan çıkan / giren oklar kenar boyunca karşı ucun yüksekliğine göre dağıtılır.
    // Komşu sütuna giden ok S eğrisi; sütun atlayan ya da geri giden ok kutuların altındaki kendi şeridinden (üst üste binmesin).

    const cikis = {}, giris = {};
    L.E.forEach((e, i) => { (cikis[e.f] ||= []).push(i); (giris[e.t] ||= []).push(i); });
    const uc = {};
    for (const [k, list] of Object.entries(cikis)) list.sort((a, b) => cy(L.E[a].t) - cy(L.E[b].t)).forEach((i, n) => (uc[i] ||= {}).y1 = L.pos[k].y + L.pos[k].h * (n + 1) / (list.length + 1));
    for (const [k, list] of Object.entries(giris)) list.sort((a, b) => cy(L.E[a].f) - cy(L.E[b].f)).forEach((i, n) => (uc[i] ||= {}).y2 = L.pos[k].y + L.pos[k].h * (n + 1) / (list.length + 1));
    const altY = Math.max(...Object.values(L.pos).map(p => p.y + p.h)) + 22;
    let serit = 0;
    const yol = pts => pts.reduce((a, [x, y], n) => a + (n ? ` L${x},${y}` : `M${x},${y}`), "");
    const okl = L.E.map((e, i) => {

      const span = colOf(e.t) - colOf(e.f), w = 1.2 + 4 * Math.log(1 + e.hits) / Math.log(1 + maxH);

      return `<g class="agkutu${on ? " on" : ""}" data-agkutu="${esc(key)}"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="9" style="stroke:${renk[n.tur]}"/>

        <label><input type="checkbox" id="agInfra" ${st.agInfra ? "checked" : ""}> Altyapı portları</label>
        <label title="svchost, splunkd gibi genel / ajan süreçleri de"><input type="checkbox" id="agGenel" ${st.agGenel ? "checked" : ""}> Genel süreçler</label></div>

    const r = satir.filter(x => x.ip === ip), gg = gid.filter(x => x.ip === ip), el = (n.el || []).find(e => e.ip === ip);
    const portlar = [...new Set(r.map(x => x.port).filter(p => p && p !== "0"))];
    const ert = [...new Set(r.flatMap(x => x.ertUygulama))], on = portlar.map(p => st.on?.[ip]?.[p]).filter(o => o?.uygulama);
    const tek = [...new Set(portlar.flatMap(p => nsTek(nsOf(ip, p))))];
    const son = r.concat(gg).map(x => x.son).filter(Boolean).sort().pop();
    return `<tr><td><b>${esc(el?.ad || ip)}</b><div class="small muted mono">${esc(ip)}</div></td>
      <td class="small mono">${esc([...new Set(r.concat(gg).map(x => x.yol))].join(" | ") || el?.alt || "")}</td>
      <td class="mono">${esc(portlar.join(", ") || (gg.length ? "yalnız giden" : "—"))}</td>
      <td class="small">${ert.length ? esc(ert.join(", ")) : on.length ? `🤖 ${esc([...new Set(on.map(o => o.uygulama))].join(", "))} <span class="muted">(${esc(on[0].durum)})</span>` : `<span class="muted">${esc(el?.uygulama || "—")}</span>`}${tek.length ? `<div class="muted">${esc(tek.join(", "))}</div>` : ""}</td>
      <td>${fmt(r.reduce((a, x) => a + x.baglanti, 0) + gg.reduce((a, x) => a + x.baglanti, 0))}</td><td class="small muted">${esc(son || "")}</td></tr>`;
  }).join("");
  return `<div><b>${baslik ? esc(baslik) + ": " : ""}${esc(n.ad)}</b>${urun.map(u => `<span class="urun">${esc(u)}</span>`).join("")}
    <div class="small muted mono" style="margin:2px 0 6px">${esc(yollar.slice(0, 3).join(" | "))}${yollar.length > 3 ? " …" : ""}</div>
    <table><thead><tr><th>Sunucu</th><th>Exe yolu</th><th>Port</th><th>Uygulama (ERT / AI)</th><th>Bağlantı</th><th>Son görülme</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// Sağ panel: seçili bağın sunucu sunucu dökümü ya da kutunun sunucuları ve bağları
function agPanel() {
  const g = st.ag, L = agYerlesim(g, st.agInfra), ad = key => g.nodes.find(n => n.key === key)?.ad || key;
  const srv = e => `${esc(e.ad)}${e.ad !== e.ip ? ` <span class="small muted mono">${esc(e.ip)}</span>` : ""}`;

      <div style="padding:12px 18px;overflow:auto;display:grid;gap:14px">${agExeBilgi(e.f, "Kaynak exe")}${agExeBilgi(e.t, "Hedef exe")}

      ${e.satir.sort((a, b) => b.hits - a.hits).map(r => `<tr><td>${srv(r.from)}${r.from.alt && r.from.id.startsWith("x:") ? `<div class="small muted mono">${esc(r.from.alt)}</div>` : r.from.uygulama ? `<div class="small muted">${esc(r.from.uygulama)}</div>` : ""}</td>
        <td>${srv(r.to)}${r.to.alt && r.to.id.startsWith("x:") ? `<div class="small muted mono">${esc(r.to.alt)}</div>` : ""}${r.to.uygulama ? `<div class="small muted">${esc(r.to.uygulama)}</div>` : ""}</td><td class="mono">${esc(r.portlar.join(", "))}</td><td>${fmt(r.hits)}</td></tr>`).join("")}
      </tbody></table></div></div>`;
  } else {
    const n = g.nodes.find(x => x.key === g.sec.key), ins = L.E.filter(e => e.t === n.key), outs = L.E.filter(e => e.f === n.key);
    const tb = (rows, side) => rows.length ? `<table><thead><tr><th>${side === "in" ? "Bağlanan" : "Bağlandığı"}</th><th>Port</th><th class="num">Bağlantı</th></tr></thead><tbody>
      ${rows.sort((a, b) => b.hits - a.hits).map(e => `<tr class="cl" data-agk="${L.E.indexOf(e)}" style="cursor:pointer"><td><b>${esc(ad(side === "in" ? e.f : e.t))}</b></td><td class="mono">${esc([...e.portlar].join(", "))}</td><td>${fmt(e.hits)}</td></tr>`).join("")}</tbody></table>` : `<div class="small muted">Yok.</div>`;
    html = `<div class="dh"><div><h3>${esc(n.ad)}</h3><div class="sub">${esc(n.aciklama || "")}</div></div><button type="button">Kapat</button></div>
      <div style="padding:12px 18px;overflow:auto;display:grid;gap:14px">
        ${n.tur === "exe" ? agExeBilgi(n.key) : `<div><b>${n.tur === "ist" ? "İstemciler" : "Hedefler"}</b> (${n.sunucu.size})<div class="chips small" style="margin-top:4px">${(n.el || []).map(e => `<span class="mono" title="${esc(e.uygulama || "")}">${esc(e.ad)}</span>`).join("")}</div>
          ${n.uyg.size ? `<div class="small muted" style="margin-top:4px">Uygulama / segment: ${esc([...n.uyg].join(", "))}</div>` : ""}</div>`}
        <div><button type="button" class="mini" id="agPGizle" title="Kutuyu bağlarıyla birlikte çizimden çıkarır; şeritten geri getirilir">🙈 Bu kutuyu gizle</button></div>
        <div><b>Bu kutuya bağlananlar</b>${tb(ins, "in")}</div><div><b>Bu kutunun bağlandıkları</b>${tb(outs, "out")}</div>
        <div class="small muted">Satıra tıklayınca o bağın sunucu sunucu dökümü açılır.</div></div>`;
  }
  document.querySelector(".drawer")?.remove();

  document.body.appendChild(d);
}

function bzCsv() {
  if (!st.yetki.disari) return alert("Dışa aktarma yetkiniz yok. Yetki DokuPanel'den verilir.");
  const C = v => `"${String(v ?? "").replace(/"/g, '""')}"`, S = st.bz.sunucular;
  const sinif = { ayni: "aynı amaçlı", yakin: "yakın amaçlı", alakasiz: "alakasız", zayif: "parmak izi zayıf" };
  const lines = ["IP;SUNUCU;SEGMENT;SINIF;GRUP;GRUP ADI;EN BENZER;BENZERLİK;ERT UYGULAMALARI;ÖNERİ;ÖNERİ DÜZEYİ;İŞ PROGRAMLARI;GELEN;GİDEN;EXE YOLLARI"].concat(Object.values(S).map(x => {
    const g = st.bz.gruplar.find(g => g.no === x.grup);
    // sunucudaki iş exe'lerinin tam yolları (gelen + yalnız giden; genel süreçler hariç)
    const yollar = [...new Set(st.data.satirlar.filter(r => r.ip === x.ip && !r.genel).map(r => r.yol).concat(st.data.giden.filter(r => r.ip === x.ip && !r.genel).map(r => r.yol)))];
    return [x.ip, x.sunucu, x.segment, sinif[x.sinif], x.grup, g?.ad, x.enBenzer, x.enPuan ? Math.round(x.enPuan * 100) + "%" : "", x.ertUygulamalar.join(", "), x.oneri, x.oneriDuzey,
      (x.iz.exe || []).join(", "), (x.iz.gelen || []).join(", "), (x.iz.giden || []).join(", "), yollar.join(" | ")].map(C).join(";");
  }));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" }));
  a.download = `DeltaFlow_benzer_${st.data.segment.replace(/[^\w.-]+/g, "_")}.csv`;
  a.click();
}

    .concat(rows().map(x => { const o = oneriOf(x); return [x.ip, x.sunucu, x.segment, "gelen", x.port, x.exe, x.yol, x.urun,

  a.download = `DeltaFlow_segment_${st.data.segment.replace(/[^\w.-]+/g, "_")}.csv`;
  a.click();
}
