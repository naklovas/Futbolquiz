# TEMPLATE ONLY -- do not fill in real values here and commit this file.
#
# Create the real secret directly against the cluster instead, e.g.:
#
#   oc create secret generic itinventory-secrets \
#     --from-literal=ConnectionStrings__ITInventory='Server=sqlhost;Database=ITInventory;User Id=...;Password=...;TrustServerCertificate=True;' \
#     --from-literal=Smtp__Username='...' \
#     --from-literal=Smtp__Password='...'
#
# Shared by both Deployments (Web reads ConnectionStrings__ITInventory only; the Notifier
# reads ConnectionStrings__ITInventory + Smtp__Username/Smtp__Password). One Secret is fine
# since both live in the same namespace and need overlapping keys -- split it if your
# cluster's RBAC wants tighter separation between the two workloads.
apiVersion: v1
kind: Secret
metadata:
  name: itinventory-secrets
  labels:
    app: itinventory
type: Opaque
stringData:
  ConnectionStrings__ITInventory: "CHANGE_ME"
  Smtp__Username: "CHANGE_ME"
  Smtp__Password: "CHANGE_ME"
